<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>群钓鱼 · 数据编辑器</title>

  <!-- 桥接 SDK：AstrBot 会把下面这个相对路径改写成带 asset_token 的完整地址（服务端也会自动注入一份，这里显式引用是为了两条路都覆盖）。
       加载成功后 window.AstrBotPluginPage 才存在，页面才会显示「已连接」。 -->
  <script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
/* =============================================================================
   群钓鱼数据编辑器 —— 单文件 UI（零外部依赖）
   主题色用 CSS 变量驱动，挂在 <html data-theme="dark|light"> 上
   ============================================================================= */

:root {
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
  --dur: 140ms;
}

/* ---------- 深色主题（默认，AstrBot 面板通常为深色） ---------- */
html[data-theme="dark"] {
  --bg: #0d1117;
  --card: #161b22;
  --hover: #1c2128;
  --sunken: #10151b;
  --border: #30363d;
  --border-soft: #232a31;
  --fg: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;
  --primary: #2f81f7;
  --primary-fg: #ffffff;
  --primary-soft: rgba(47, 129, 247, 0.14);
  --success: #3fb950;
  --success-soft: rgba(63, 185, 80, 0.14);
  --warn: #d29922;
  --warn-soft: rgba(210, 153, 34, 0.14);
  --danger: #f85149;
  --danger-soft: rgba(248, 81, 73, 0.14);
  --danger-wash: rgba(248, 81, 73, 0.045);   /* 出错行的极淡底色 */
  --purple: #a371f7;
  --purple-soft: rgba(163, 113, 247, 0.14);
  --zebra: rgba(255, 255, 255, 0.018);
  --shadow: 0 8px 24px rgba(1, 4, 9, 0.5);
  --scrim: rgba(1, 4, 9, 0.6);
  --scheme: dark;
}

/* ---------- 浅色主题 ---------- */
html[data-theme="light"] {
  --bg: #ffffff;
  --card: #ffffff;
  --hover: #f6f8fa;
  --sunken: #f6f8fa;
  --border: #d0d7de;
  --border-soft: #e6eaef;
  --fg: #1f2328;
  --muted: #656d76;
  --faint: #8c959f;
  --primary: #2f81f7;
  --primary-fg: #ffffff;
  --primary-soft: rgba(47, 129, 247, 0.1);
  --success: #1a7f37;
  --success-soft: rgba(26, 127, 55, 0.1);
  --warn: #9a6700;
  --warn-soft: rgba(154, 103, 0, 0.1);
  --danger: #cf222e;
  --danger-soft: rgba(207, 34, 46, 0.1);
  --danger-wash: rgba(207, 34, 46, 0.03);   /* 出错行的极淡底色（浅色下更轻） */
  --purple: #8250df;
  --purple-soft: rgba(130, 80, 223, 0.1);
  --zebra: rgba(0, 0, 0, 0.014);
  --shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
  --scrim: rgba(31, 35, 40, 0.45);
  --scheme: light;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  color-scheme: var(--scheme);
}

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* ============================== 顶部栏 ============================== */
/* 顶栏 + 标签页一起吸顶：不用写死高度，标题换行也不会错位 */
.sticky-head {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--card);
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-5);
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }

.brand-mark {
  width: 34px; height: 34px;
  flex: none;
  display: grid; place-items: center;
  font-size: 18px;
  border-radius: var(--radius);
  background: var(--primary-soft);
  border: 1px solid var(--border);
}

.brand-text { min-width: 0; }
.brand-title {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.brand-sub {
  margin: 0;
  font-size: 11.5px;
  color: var(--muted);
  font-family: var(--mono);
  /* 插件名可能很长：换行显示，不截断（站长要求：长文字一律多行） */
  white-space: normal;
  overflow-wrap: anywhere;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* 连接状态徽标 */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  height: auto;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 550;
  line-height: 1.3;
  border: 1px solid var(--border);
  background: var(--sunken);
  color: var(--muted);
  white-space: normal;
  overflow-wrap: anywhere;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.badge.is-online { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.badge.is-online .dot { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.badge.is-offline { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.badge.is-offline .dot { background: var(--warn); }

/* ============================== 按钮 ============================== */
/* ⚠️ 缩放约定（v1.18.22）：**不要给带文字的元素写死 height** ——
   站长把浏览器缩放调大（或系统字体变大）时，固定高度会把文字切掉一半。
   统一用 min-height + 上下 padding + 可以换行来做，缩放时才不会「差一点」。 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 30px;
  height: auto;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 550;
  line-height: 1.3;
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  white-space: normal;
  overflow-wrap: anywhere;
  text-align: center;
  transition: background var(--dur), border-color var(--dur), transform var(--dur), color var(--dur);
}
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn[disabled]:hover { background: var(--card); border-color: var(--border); }

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-fg);
}
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, #000); border-color: transparent; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--hover); color: var(--fg); border-color: var(--border); }

.btn-danger { color: var(--danger); border-color: var(--border); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }

.btn-sm { min-height: 26px; height: auto; padding: 3px 9px; font-size: 12px; }
.btn-icon { width: 28px; min-width: 28px; min-height: 28px; height: auto; padding: 0; justify-content: center; }

/* ============================== 标签页 ============================== */
/* 16 个标签在窄屏上一行放不下 —— 换行显示，不要横向滚动条让人去找（站长明确要求） */
.tabs {
  display: flex;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 2px 4px;
  row-gap: 0;
  padding: 0 var(--sp-5);
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 42px;
  height: auto;
  padding: 8px 10px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 550;
  line-height: 1.25;
  cursor: pointer;
  white-space: normal;
  overflow-wrap: anywhere;
  text-align: left;
  border-bottom: 2px solid transparent;
  transition: color var(--dur), border-color var(--dur), background var(--dur);
}
.tab:hover { color: var(--fg); background: var(--hover); }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -3px; }
.tab.is-active { color: var(--fg); border-bottom-color: var(--primary); }
.tab .tab-count {
  min-width: 20px;
  min-height: 17px;
  height: auto;
  padding: 1px 5px;
  display: inline-grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  border-radius: 999px;
  background: var(--sunken);
  border: 1px solid var(--border-soft);
  color: var(--muted);
}
.tab.is-active .tab-count { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.tab .tab-dirty {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn); flex: none;
  display: none;
}
.tab.has-dirty .tab-dirty { display: block; }
/* 标签上的问题标记：红 = 你改过的行填错了（会拦住保存）；黄 = 没动过的行里的历史问题 */
.tab .tab-bad {
  font-size: 11px; line-height: 1; flex: none; display: none;
}
.tab .tab-bad.is-block { color: var(--danger); display: block; }
.tab .tab-bad.is-stale { color: var(--warn); display: block; }

/* ============================== 内容区 ============================== */
.content {
  flex: 1 1 auto;
  padding: var(--sp-4) var(--sp-5) 72px;
  max-width: 1800px;
  width: 100%;
  margin: 0 auto;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.card + .card { margin-top: var(--sp-4); }

.card-head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  background: var(--card);
}
.card-head h2 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 620;
  display: flex; align-items: center; gap: 7px;
}
.card-head .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
.card-head .spacer { margin-left: auto; }

/* ---------- 工具栏 ---------- */
.toolbar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  background: var(--sunken);
}

.field {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  height: auto;
  padding: 4px 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--dur), box-shadow var(--dur);
}
.field:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.field > .field-icon { color: var(--muted); font-size: 12px; flex: none; }
.field input, .field select {
  border: 0;
  background: transparent;
  color: var(--fg);
  font-family: inherit;
  font-size: 12.5px;
  min-height: 20px;
  height: auto;
  outline: none;
  min-width: 0;
}
.field.search { min-width: min(250px, 100%); }
.field.search input { width: 100%; }
.field select { cursor: pointer; padding-right: 2px; }
.field select option { background: var(--card); color: var(--fg); }

.toolbar .divider { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }

.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  height: auto;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--border);
}
.stat-chip b { color: var(--fg); font-weight: 620; }
.stat-chip.is-dirty { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.stat-chip.is-dirty b { color: var(--warn); }

/* ---------- 表格 ---------- */
/* 高度：给一个下限（max(...)），窗口矮的时候别把表格压成一条缝；
   内容比下限还矮时按内容高，不浪费空间 */
.table-wrap { overflow: auto; max-height: max(360px, calc(100vh - 300px)); }
table.grid {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12.5px;
}
table.grid thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  text-align: left;
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: 0.02em;
  color: var(--muted);
  background: var(--card);
  padding: 9px var(--sp-3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  user-select: none;
}
table.grid thead th.num { text-align: right; }
table.grid thead th .col-hint { font-weight: 400; color: var(--faint); font-size: 10.5px; }

table.grid tbody td {
  padding: 7px var(--sp-3);
  line-height: 1.5;
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
  /* 默认就允许换行：宁可这一行高一点，也别把内容截掉或把表格撑出横向滚动条 */
  white-space: normal;
  overflow-wrap: anywhere;
}
/* 只有「数字列 / id 列」保持一行：它们本来就没有长文本 */
table.grid tbody td.num, table.grid tbody td.id-cell { white-space: nowrap; }
/* 分节标题行（数值页按「基础 / 经济 / 拉线 …」分组显示） */
table.grid tbody tr.group-row > td {
  padding: 12px var(--sp-3) 6px;
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: 0.04em;
  color: var(--primary);
  background: var(--sunken);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 34px;
  z-index: 4;
}
/* 说明列允许换行（数值页那种长说明不再被截成一行还让人左右拉） */
table.grid.wrap-cells tbody td { white-space: normal; }
table.grid.wrap-cells .cut { max-width: none; }
/* 行状态用「左侧 3px 竖条」表达，不再整行铺色 */
table.grid tbody td:first-child { border-left: 3px solid transparent; }
table.grid tbody tr:nth-child(even) { background: var(--zebra); }
table.grid tbody tr:hover { background: var(--hover); }
table.grid tbody tr.is-invalid { background: var(--danger-wash); }
table.grid tbody tr.is-selected { background: var(--primary-soft); }
table.grid tbody tr.is-selected td:first-child { border-left-color: var(--primary); }
table.grid tbody tr.is-dirty td:first-child { border-left-color: var(--warn); }
table.grid tbody tr.is-invalid td:first-child { border-left-color: var(--danger); }
table.grid tbody tr.is-editing { background: var(--hover); }
table.grid tbody tr:last-child td { border-bottom: 0; }

/* 只读态下出错的单元格：淡红文字 + 虚线下划线，不铺底色 */
.cell-bad {
  color: var(--danger);
  text-decoration: underline dotted;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
td.id-cell { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
td.actions { min-width: 74px; width: auto; text-align: right; white-space: normal; }
td.actions .btn { opacity: 0; transition: opacity var(--dur); }
tr:hover td.actions .btn, tr.is-editing td.actions .btn { opacity: 1; }
td.actions .btn:focus-visible { opacity: 1; }

.cell-emoji { font-size: 14px; }

/* 单元格内的行内输入 */
.cell-input {
  width: 100%;
  min-width: 60px;
  padding: 3px 7px;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color var(--dur), box-shadow var(--dur);
}
.cell-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.cell-input.is-bad { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.cell-input.mono { font-family: var(--mono); font-size: 12px; }
input[type="number"].cell-input { text-align: right; }

/* 稀有度 pill */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
}
.rar-common  { color: #8b949e; background: rgba(139, 148, 158, 0.16); border-color: rgba(139, 148, 158, 0.35); }
.rar-uncommon{ color: #3fb950; background: rgba(63, 185, 80, 0.15);  border-color: rgba(63, 185, 80, 0.35); }
.rar-rare    { color: #2f81f7; background: rgba(47, 129, 247, 0.15); border-color: rgba(47, 129, 247, 0.38); }
.rar-epic    { color: #a371f7; background: rgba(163, 113, 247, 0.16);border-color: rgba(163, 113, 247, 0.38); }
.rar-myth    { color: #d29922; background: rgba(210, 153, 34, 0.16); border-color: rgba(210, 153, 34, 0.4); }
html[data-theme="light"] .rar-common   { color: #57606a; }
html[data-theme="light"] .rar-uncommon { color: #1a7f37; }
html[data-theme="light"] .rar-rare     { color: #0969da; }
html[data-theme="light"] .rar-epic     { color: #8250df; }
html[data-theme="light"] .rar-myth     { color: #9a6700; }

/* 分布标签 */
.dist { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.dist .tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 19px;
  padding: 0 7px;
  font-size: 11px;
  font-family: var(--mono);
  border-radius: var(--radius-sm);
  background: var(--sunken);
  border: 1px solid var(--border-soft);
  color: var(--muted);
  white-space: nowrap;
}
.dist .tag b { color: var(--fg); font-weight: 600; }
.dist .tag.is-star { color: var(--purple); border-color: var(--purple); background: var(--purple-soft); }
.dist .tag.is-bad { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.dist .dist-empty { color: var(--faint); font-size: 11.5px; }

.muted { color: var(--muted); }
.faint { color: var(--faint); }
/* 等宽字只是「换个字体」，**不是**「不许换行」：长指令 / 长说明照样要折行 */
.mono { font-family: var(--mono); overflow-wrap: anywhere; }
/* ⚠️ 站长要求（v1.18.16）：长文字一律换行显示，不许再用省略号截断。
   `.nowrap` 只留给「本来就一行」的东西（数字列、id、徽标、批量操作条）。 */
.nowrap { white-space: nowrap; }
/* 长说明列：以前是 nowrap + ellipsis（看不全还得横向拉），现在直接换行。
   保留 .cut 这个类名是为了不打扰老代码，语义已经改成「长文本，请换行」。 */
.cut { max-width: 420px; white-space: normal; overflow-wrap: anywhere; }

/* 逗号分隔的长列表（各钓点系数、品质权重、单条鱼改价…）：
   显示成可换行的小方块，别一行拉到底把整张表撑出去 */
.kv-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  max-width: 360px;
  cursor: text;
}
.kv-chips .tag { font-size: 11.5px; padding: 0 6px; }
.kv-chips .tag.is-more { color: var(--faint); border-style: dashed; }
.kv-chips.cell-bad { border-bottom: 1px dashed var(--danger); }

/* 多行输入框（长列表编辑用：一行一条） */
.cell-input.is-multiline {
  display: block;
  width: 100%;
  min-width: 190px;
  max-width: 460px;
  min-height: 62px;
  padding: 5px 7px;
  line-height: 1.6;
  resize: vertical;
  white-space: pre;
  overflow: auto;
}

/* 数值页「算给你看」的小提示（升级曲线这类光看名字猜不出该填多少的） */
.num-hint {
  margin-top: 4px;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}
.num-hint b { color: var(--fg); font-weight: 620; }

/* ---- 数值页的「入口行」（v1.18.16：在别的页改 / 插件面板只读的键）---- */
.entry-cell { white-space: normal; }              /* 这一格是按钮或只读值，不许 nowrap 撑宽 */
.btn-jump { white-space: normal; overflow-wrap: anywhere; text-align: left; }
.ro-value {
  display: inline-block;
  max-width: 100%;
  color: var(--muted);
  font-size: 11.5px;
  overflow-wrap: anywhere;
}
.ro-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 0 7px;
  border-radius: 999px;
  border: 1px dashed var(--border);
  color: var(--faint);
  font-size: 11px;
  white-space: normal;
  overflow-wrap: anywhere;
}
.ro-chip.is-warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }

/* 行内确认条 */
.confirm-strip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 4px 3px 10px;
  border-radius: 999px;
  background: var(--danger-soft);
  border: 1px solid var(--danger);
  white-space: nowrap;
}
.confirm-strip .q { color: var(--danger); font-size: 11.5px; font-weight: 600; }
.confirm-strip .btn { height: 22px; padding: 0 8px; font-size: 11.5px; }

/* 空状态 */
.empty {
  padding: 56px 24px;
  text-align: center;
  color: var(--muted);
}
.empty .empty-icon { font-size: 34px; display: block; margin-bottom: 10px; opacity: 0.75; }
.empty .empty-title { font-size: 13.5px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
.empty .empty-sub { font-size: 12px; }

/* 表格底部操作 */
.table-foot {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--border);
  background: var(--sunken);
}
.table-foot .spacer { margin-left: auto; }

/* ============================== 存档页 ============================== */
.snap-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--sp-3);
  padding: var(--sp-4);
}

.snap-card {
  position: relative;
  padding: var(--sp-3) var(--sp-3) var(--sp-4);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color var(--dur), transform var(--dur), box-shadow var(--dur);
}
.snap-card:hover { border-color: var(--faint); transform: translateY(-1px); box-shadow: var(--shadow); }
.snap-card.is-restoring { border-color: var(--warn); background: var(--warn-soft); }
.snap-card.is-deleting { border-color: var(--danger); background: var(--danger-soft); }

.snap-top { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }

.kind {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 620;
  border: 1px solid transparent;
}
.kind-daily  { color: var(--primary); background: var(--primary-soft); border-color: var(--primary); }
.kind-auto   { color: var(--purple);  background: var(--purple-soft);  border-color: var(--purple); }
.kind-manual { color: var(--success); background: var(--success-soft); border-color: var(--success); }

.snap-time { margin-left: auto; font-size: 11px; color: var(--faint); font-family: var(--mono); }

.snap-note {
  font-size: 13px;
  font-weight: 600;
  min-height: 20px;
  padding: 2px 4px;
  margin: 0 -4px var(--sp-2);
  border-radius: var(--radius-sm);
  cursor: text;
  border: 1px solid transparent;
}
.snap-note:hover { background: var(--hover); border-color: var(--border); }
.snap-note .placeholder { color: var(--faint); font-weight: 400; }

.snap-meta {
  display: flex; flex-wrap: wrap; gap: var(--sp-3);
  font-size: 11.5px; color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-bottom: var(--sp-3);
}
.snap-meta span { display: inline-flex; align-items: center; gap: 4px; }

.snap-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.snap-actions .spacer { margin-left: auto; }

/* 新建存档表单 */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: var(--sp-3);
  padding: var(--sp-4);
}
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-row label { font-size: 11.5px; color: var(--muted); font-weight: 550; }
.form-row .field { width: 100%; }
.form-row .field input, .form-row .field select { width: 100%; }
.form-note { font-size: 11px; color: var(--faint); }

/* 新建存档：输入框 + 按钮同一行，按钮只占内容宽度（不要撑成一条长条） */
.new-snap {
  display: flex;
  align-items: flex-end;
  gap: var(--sp-3);
  flex-wrap: wrap;
  padding: var(--sp-4);
}
.new-snap .grow { flex: 1 1 260px; max-width: 460px; }
.new-snap .new-snap-hint { flex: 1 1 200px; padding-bottom: 6px; }

.switch {
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; cursor: pointer; user-select: none;
}
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track {
  width: 38px; height: 20px; border-radius: 999px;
  background: var(--sunken); border: 1px solid var(--border);
  position: relative; transition: background var(--dur), border-color var(--dur);
}
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--faint); transition: transform var(--dur), background var(--dur);
}
.switch input:checked + .track { background: var(--primary-soft); border-color: var(--primary); }
.switch input:checked + .track::after { transform: translateX(18px); background: var(--primary); }
.switch .switch-label { font-size: 12.5px; }

/* 数值页提示 */
.notice {
  display: flex; gap: 10px;
  padding: var(--sp-3) var(--sp-4);
  font-size: 12.5px;
  color: var(--muted);
  background: var(--sunken);
  border-bottom: 1px solid var(--border);
}
.notice .notice-icon { flex: none; }
.notice b { color: var(--fg); }
.notice-danger {
  color: var(--danger);
  background: var(--danger-soft);
  border-bottom-color: var(--danger);
}
.notice-danger b { color: var(--danger); }

/* ============================== 底部状态栏 ============================== */
.statusbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 35;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  /* 窗口窄的时候允许换行：宁可变成两行，也别把右边的信息挤出屏幕 */
  flex-wrap: wrap;
  min-height: 34px;
  padding: 4px var(--sp-5);
  background: var(--card);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--muted);
}
.statusbar > * { min-width: 0; overflow-wrap: anywhere; white-space: normal; }
.statusbar .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--faint); flex: none; display: inline-block; margin-right: 6px;
}
.statusbar .dot.is-dirty { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.statusbar .dot.is-clean { background: var(--success); }
.statusbar .spacer { margin-left: auto; }
.statusbar .sep { width: 1px; height: 14px; background: var(--border); }

/* ============================== Toast ============================== */
#toasts {
  position: fixed;
  right: 18px;
  bottom: 46px;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  min-width: 240px;
  max-width: 380px;
  padding: 10px 13px;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  color: var(--fg);
  animation: toast-in 180ms ease-out;
  pointer-events: auto;
}
.toast.is-out { animation: toast-out 200ms ease-in forwards; }
.toast .toast-icon { flex: none; font-size: 14px; line-height: 1.35; }
.toast .toast-body { min-width: 0; }
.toast .toast-title { font-weight: 620; margin-bottom: 1px; overflow-wrap: anywhere; }
.toast .toast-text { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; word-break: break-word; }
/* 带动作按钮的提示（「跳到这一格」）：文案和按钮都要能看清 */
.toast.has-act { max-width: 460px; }
.toast .toast-act { margin-top: 7px; flex: none; }
.toast.ok { border-left-color: var(--success); }
.toast.ok .toast-icon { color: var(--success); }
.toast.warn { border-left-color: var(--warn); }
.toast.warn .toast-icon { color: var(--warn); }
.toast.err { border-left-color: var(--danger); }
.toast.err .toast-icon { color: var(--danger); }
.toast.info { border-left-color: var(--primary); }
.toast.info .toast-icon { color: var(--primary); }

@keyframes toast-in {
  from { opacity: 0; transform: translateX(14px) scale(0.98); }
  to { opacity: 1; transform: none; }
}
@keyframes toast-out {
  to { opacity: 0; transform: translateX(14px); }
}

/* ====================== 💬 回复（场景卡片 + 常驻预览 + 按钮总览） ====================== */
.rp-split { display: flex; gap: var(--sp-4); align-items: flex-start; }
.rp-main { flex: 1 1 auto; min-width: 0; }
/* 预览面板：吸在右边；自己高了就在面板内滚，别让下半截顶在屏幕外面够不着 */
.rp-side {
  flex: 0 0 330px; width: 330px;
  position: sticky; top: 104px;
  max-height: calc(100vh - 118px);
  overflow: auto;
}

.rp-group { margin-bottom: var(--sp-4); }
.rp-group-head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; padding: 0 2px var(--sp-2); }
.rp-group-head h3 { margin: 0; font-size: 13px; font-weight: 620; }
.rp-group-head .hint { font-size: 11.5px; color: var(--muted); }

.rp-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); margin-bottom: var(--sp-3); overflow: hidden; }
.rp-card.is-focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.rp-card-head { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; padding: 8px 10px; background: var(--sunken); border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.rp-card-head:hover { background: var(--hover); }
.rp-card-title { font-weight: 620; }
.rp-card-id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.rp-card-desc { font-size: 11.5px; color: var(--muted); }
.rp-card-head .spacer { margin-left: auto; }
.rp-body { padding: 10px; display: flex; flex-direction: column; gap: 9px; }
.rp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rp-row > .rp-label { flex: none; min-width: 58px; font-size: 11.5px; color: var(--muted); font-weight: 550; }
/* 卡片里的说明 / 提示：长文案必须换行（站长要求「字数太多就多行显示」） */
.rp-row > .hint, .rp-card-desc, .form-note, .notice div {
  white-space: normal;
  overflow-wrap: anywhere;
}
.rp-text { width: 100%; min-height: 52px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--fg); background: var(--sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; }
.rp-text:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.rp-text.is-bad { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.rp-ph { cursor: pointer; font-family: var(--mono); font-size: 11.5px; border: 1px dashed var(--border); border-radius: 999px; padding: 1px 8px; background: var(--sunken); color: var(--muted); }
.rp-ph:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.rp-ph.is-bad { border-color: var(--danger); color: var(--danger); }
.rp-btns-edit { display: flex; flex-direction: column; gap: 6px; }
.rp-btn-edit { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 5px 6px; background: var(--sunken); }
.rp-btn-edit .cell-input { background: var(--card); }
.rp-btn-edit .idx { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 16px; text-align: right; }
.rp-btn-edit .arrow-to { color: var(--faint); font-size: 11.5px; }
.rp-move { display: flex; gap: 2px; margin-left: auto; }
/* 「＋ 加按钮」的选择器：文案 / 指令 / 样式都是现成的选项（v1.18.16） */
.rp-picker {
  border: 1px dashed var(--primary);
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.rp-picker .rp-row > .rp-label { color: var(--primary); }
.rp-picker select, .rp-picker input { min-width: 0; }
.rp-src { flex: none; font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; color: var(--muted); white-space: nowrap; }
.rp-src.src-config { color: var(--success); border-color: var(--success); background: var(--success-soft); }
.rp-src.src-inherit { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.rp-src.src-default { color: var(--purple); border-color: var(--purple); background: var(--purple-soft); }
.rp-src.src-none { border-style: dashed; }
.rp-warn { font-size: 11.5px; border-radius: var(--radius-sm); padding: 5px 8px; }
.rp-warn.is-warn { color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); }
.rp-warn.is-danger { color: var(--danger); background: var(--danger-soft); border: 1px solid var(--danger); }
.rp-warn ul { margin: 0; padding-left: 16px; }

/* 预览：QQ 消息气泡的样子 */
.rp-phone { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--sunken); padding: 10px; }
.rp-phone-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); margin-bottom: 8px; flex-wrap: wrap; }
.rp-phone-head .spacer { margin-left: auto; }
.rp-msg { display: flex; gap: 8px; }
.rp-avatar { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.rp-msg-body { min-width: 0; flex: 1 1 auto; }
.rp-nick { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.rp-bubble { background: var(--card); border: 1px solid var(--border-soft); border-radius: 3px 10px 10px 10px; padding: 7px 9px; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
.rp-bubble .rp-sampled { background: var(--primary-soft); color: var(--primary); border-radius: 3px; padding: 0 2px; }
.rp-bubble .rp-decl { background: var(--sunken); color: var(--muted); border: 1px dashed var(--border); border-radius: 3px; padding: 0 2px; font-family: var(--mono); font-size: 11.5px; }
.rp-bubble .rp-ph-bad { background: var(--danger-soft); color: var(--danger); border: 1px dashed var(--danger); border-radius: 3px; padding: 0 2px; font-family: var(--mono); font-size: 11.5px; }
.rp-grid { display: grid; gap: 6px; margin-top: 7px; }
/* 预览里的按钮：文案长了自己换行（以前是 ellipsis，站长说「文字别只放一行」） */
.rp-btn { text-align: center; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 4px; font-size: 11.5px; background: var(--card); color: var(--fg); white-space: normal; overflow-wrap: anywhere; }
.rp-btn.is-primary { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
.rp-btn.is-bad { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.rp-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.rp-mode { display: flex; gap: 6px; align-items: center; }
.rp-table-wrap { overflow: auto; max-height: max(320px, calc(100vh - 380px)); }
/* 长列表用「换行小方块」铺开，别做成一行横向滚动让人去拉滑块 */
.chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
td.actions .btn + .btn { margin-left: 4px; }
table.grid td.actions { display: table-cell; }
table.grid td.actions .btn { vertical-align: middle; }

/* ============================== 响应式 ============================== */
@media (max-width: 1100px) {
  .toolbar { gap: 6px; }
  .field.search { min-width: 190px; }
}
/* 回复页：窗口不够宽就把预览挪到卡片下面。
   别硬挤 —— 右侧固定 330px 一挤，左边的按钮总览表就只剩一半，右边几列直接看不见了。 */
@media (max-width: 1400px) {
  .rp-split { flex-direction: column; }
  .rp-side { flex: 1 1 auto; width: 100%; position: static; }
}
@media (max-width: 820px) {
  .content { padding: var(--sp-3) var(--sp-3) 108px; }
  .topbar { padding: var(--sp-3); flex-wrap: wrap; }
  .topbar-right { width: 100%; margin-left: 0; justify-content: flex-start; }
  .statusbar { padding: 0 var(--sp-3); }
  /* 顶栏/标签在这种宽度下会换行，高度估不准：干脆别吸顶，免得压住内容 */
  .sticky-head { position: static; }
}

/* 窄窗口（插件页经常被塞进 700~1100px 的 iframe）：表格改成「一行一张卡」，
   别再让人拉横向滚动条 —— 右边那几列以前就是被切在外面看不见的。
   卡片模式下也取消表格内部的限高：整页滚动比小框里套小框好找内容。 */
@media (max-width: 1180px) {
  .table-wrap.is-stack { max-height: none; overflow: visible; }
  table.grid.stack { min-width: 0 !important; }
  table.grid.stack thead { display: none; }
  table.grid.stack tbody tr {
    display: block;
    margin: 0 0 var(--sp-3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    overflow: hidden;
  }
  table.grid.stack tbody tr.is-selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
  table.grid.stack tbody tr.is-invalid { border-color: var(--danger); }
  table.grid.stack tbody td {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-3);
    width: auto !important;
    padding: 6px var(--sp-3);
    border-bottom: 1px solid var(--border-soft);
    text-align: left;
  }
  table.grid.stack tbody td:last-child { border-bottom: 0; }
  table.grid.stack tbody td::before {
    content: attr(data-label);
    flex: 0 0 84px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 550;
    padding-top: 1px;
    white-space: normal;
  }
  /* 没标签的格子（勾选框 / 分组标题）不占标签位 */
  table.grid.stack tbody td[data-label=""]::before { display: none; }
  table.grid.stack tbody td[data-label=""] { padding: 6px 10px; }
  /* 长文本（说明、指令）别在卡片里再截断，让它换行占满 */
  table.grid.stack tbody td .cut,
  table.grid.stack tbody td .mono,
  table.grid.stack tbody td .nowrap {
    max-width: none; overflow: visible; text-overflow: clip;
    white-space: normal; word-break: break-word;
  }
  table.grid.stack tbody td.cell-wide { display: block; }
  table.grid.stack tbody td.cell-wide::before { display: block; flex: none; margin-bottom: 2px; }
  table.grid.stack tr.group-row { margin: 0 0 var(--sp-2); border: 0; background: transparent; }
  table.grid.stack tr.group-row td { display: block; padding: 4px 2px; font-weight: 620; color: var(--muted); }
  table.grid.stack tr.group-row td::before { display: none; }
  table.grid.stack tbody td.actions { justify-content: flex-end; }
}

/* 滚动条（深色下别是刺眼的白色） */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border);
  border: 3px solid var(--bg);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover { background: var(--faint); }
</style>
</head>
<body>
<div id="app">

  <!-- ============================ 顶部栏 + 标签页（一起吸顶） ============================ -->
  <div class="sticky-head">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🎣</div>
        <div class="brand-text">
          <h1 class="brand-title">群钓鱼 · 数据编辑器</h1>
          <p class="brand-sub" id="pluginName">astrbot_plugin_fishing_mini</p>
        </div>
      </div>

      <div class="topbar-right">
        <span class="badge" id="connBadge"><i class="dot"></i><span id="connText">检测中…</span></span>
        <button class="btn btn-ghost" id="btnReload" title="丢弃未保存的修改，重新载入数据">↻ 重新载入</button>
        <button class="btn" id="btnExport" title="把当前数据导出成 JSON 文件留底">⬇ 导出 JSON</button>
        <button class="btn" id="btnImport" title="从 JSON 文件导入数据">⬆ 导入 JSON</button>
        <button class="btn btn-primary" id="btnSave" title="保存并让配置生效（Ctrl+S）">💾 保存并生效</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>

  <!-- ============================ 内容区 ============================ -->
  <main class="content" id="panel" role="tabpanel"></main>

  <!-- ============================ 状态栏 ============================ -->
  <footer class="statusbar">
    <span id="dirtyInfo"><i class="dot is-clean"></i>已同步</span>
    <span class="sep"></span>
    <span id="savedInfo" class="faint">尚未保存</span>
    <span class="spacer"></span>
    <span id="tabInfo" class="faint">—</span>
    <span class="sep"></span>
    <span class="faint">Ctrl+S 保存 · / 搜索 · Esc 取消编辑</span>
  </footer>

  <div id="toasts"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden />
</div>

<script>
/* =============================================================================
   群钓鱼数据编辑器 —— 前端逻辑（单文件、零外部依赖）

   数据通道（细节见下面第 2 节）：
     * 读：apiGet("config") → 插件用 register_web_api 注册的 /<插件名>/config，
           返回整份配置（fish_defs / rod_defs / ... 以及 editor_status）
     * 写：apiPost("config", {action, payload}) / apiPost("snapshot", {action, ...})
           —— 同样是插件自己注册的路由，同步写回配置并回最新状态
     * 旧版「上传固定文件名 + 插件轮询」在真实环境下被
       403 /api/files：Insufficient API key scope 挡掉，已废弃
     * 离线（检测不到 AstrBotPluginPage）：用内置演示数据渲染，只提示不发送
   ============================================================================= */
(function () {
  "use strict";

  /* ===========================================================================
     1. 上下文与主题
     AstrBot 插件页面通过 window.AstrBotPluginPage 注入上下文；
     离线打开（file:// 预览）时用默认值兜底，并显示「离线预览」徽标。

     注意：桥接 SDK 的上下文是**异步**塞进来的（先 __setInitialContext，
     再让 ready() 决议），所以这里不能只在脚本开头读一次。
     =========================================================================== */
  var sdk = window.AstrBotPluginPage || null;

  function readContext() {
    var ctx = {};
    try {
      ctx = (sdk && typeof sdk.getContext === "function" && sdk.getContext()) || {};
    } catch (e) {
      ctx = {};
    }
    return ctx || {};
  }

  var ctx = readContext();

  /** 等桥接 SDK 把上下文灌进来（离线 / 老 SDK 立刻返回）。 */
  function waitForContext() {
    if (!sdk || typeof sdk.ready !== "function") return Promise.resolve(readContext());
    var ready;
    try {
      ready = sdk.ready();
    } catch (e) {
      return Promise.resolve(readContext());
    }
    if (!ready || typeof ready.then !== "function") return Promise.resolve(readContext());
    return Promise.race([
      ready,
      // 兜底：老版本 SDK 的 ready 可能永远不决议，别把页面卡在「检测中」
      new Promise(function (resolve) { setTimeout(function () { resolve(readContext()); }, 1500); })
    ]).then(function () { return readContext(); }, function () { return readContext(); });
  }

  /**
   * 判断初始主题。优先级：
   *   1) URL 上的 ?theme=dark|light（方便离线预览/截图指定主题）
   *   2) AstrBot 服务端已经写在 <html data-theme="..."> 上的值（最权威：
   *      AstrBot 会在返回页面时把 data-theme 重写进 <html> 标签）
   *   3) 桥接上下文里的 isDark / theme
   *   4) 系统偏好 prefers-color-scheme
   *   5) 兜底深色（离线预览时的观感更好）
   */
  function resolveInitialDark() {
    var forced = "";
    try {
      var m = /[?&]theme=(dark|light)/i.exec(location.search || "");
      if (m) forced = m[1].toLowerCase();
    } catch (e) { /* 忽略 */ }
    if (forced) return forced === "dark";

    var attr = String(document.documentElement.getAttribute("data-theme") || "").toLowerCase();
    if (attr === "dark") return true;
    if (attr === "light") return false;
    if (ctx.isDark !== undefined) return !!ctx.isDark;
    if (typeof ctx.theme === "string") return ctx.theme.toLowerCase().indexOf("dark") >= 0;
    try {
      if (window.matchMedia) return window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) { /* 忽略 */ }
    return true;
  }

  var ENV = {
    online: !!sdk,
    pluginName: ctx.pluginName || ctx.plugin_name || "astrbot_plugin_fishing_mini",
    displayName: ctx.displayName || "群钓鱼",
    pageTitle: ctx.pageTitle || "数据编辑器",
    isDark: resolveInitialDark(),
    locale: ctx.locale || "zh-CN",
    //: 桥接可用的插件标识（"name" 或 "author/name"，探测成功后替换）
    pluginBase: String(ctx.pluginName || ctx.plugin_name || "astrbot_plugin_fishing_mini")
      .replace(/^\/+|\/+$/g, "")
  };

  /** 主题变化 / 上下文迟到时，把 SDK 的上下文并回 ENV。 */
  function mergeContext(next) {
    if (!next || typeof next !== "object") return;
    if (next.displayName) ENV.displayName = String(next.displayName);
    if (next.pageTitle) ENV.pageTitle = String(next.pageTitle);
    if (next.locale) ENV.locale = String(next.locale);
    if (next.pluginName) ENV.pluginBase = String(next.pluginName).replace(/^\/+|\/+$/g, "");
  }

  function applyTheme(isDark) {
    ENV.isDark = !!isDark;
    document.documentElement.setAttribute("data-theme", ENV.isDark ? "dark" : "light");
  }
  applyTheme(ENV.isDark);

  function paintIdentity() {
    document.getElementById("pluginName").textContent = ENV.pluginName;
    document.title = (ENV.displayName || "群钓鱼") + " · " + (ENV.pageTitle || "数据编辑器");
  }
  paintIdentity();

  /* ===========================================================================
     2. 数据通道（全部走插件自己注册的 Web API）

     页面 → 插件（写）：
       apiPost("config", {action: "save_content"|"save_numbers"|"save_autobackup", payload})
       apiPost("snapshot", {action: "create"|"restore"|"delete"|"rename", ...})
       —— 插件端同步写回配置 / 执行存档动作，并在响应里带回最新状态。

     插件 → 页面（读）：
       apiGet("config") 返回整份配置，其中 editor_status 是一个 JSON 字符串，
       含存档清单、玩家数、下次自动存档时间、可改的数值键白名单。

     ⚠️ 桥接会把 endpoint 拼到 /api/v1/plugins/extensions/<pluginName>/ 后面，
        所以这里必须传「相对插件」的路径（config / snapshot），
        路由由插件用 register_web_api("/<插件名>/config", ...) 注册。
     =========================================================================== */

  /**
   * 写操作成功后，插件会在响应里直接回一份最新 editor_status，
   * 页面先把它存在这里，waitForStatus() 优先取它（省掉一次轮询等待）。
   */
  var pendingStatus = null;

  /**
   * 桥接请求封装：把「怎么调」和「怎么报错」分开。
   *
   * ⚠️ 实测踩坑：不同 AstrBot 版本/入口对 endpoint 的拼法不一致 ——
   * 有的直接把 endpoint 当完整 API 路径（需要 /api 前缀），
   * 有的会自己拼到某个前缀后面（此时传相对路径）。
   * 所以这里先按原样请求，若返回「未找到该路由 / 404」，
   * 自动改用 /api/ 前缀重试一次，并把成功的那种拼法记住，
   * 后续请求直接复用（只探测一次，不会每次都双发）。
   */
  var API_CANDIDATES = [""];   // 只走相对路径（Dashboard 会拼到 extensions/<插件名>/ 后面）
  // 记住首次探测成功的那一组（前缀 + 是否需要用「纯插件名」），后续请求直接复用。
  var API_PREFIX = null;
  var API_PLAIN_NAME = false;

  function rawBridgeCall(kind, endpoint, a, b) {
    var call;
    if (kind === "get") call = sdk.apiGet(endpoint, a || {});
    else if (kind === "post") call = sdk.apiPost(endpoint, a || {});
    else call = sdk.upload(endpoint, a, b);
    return Promise.resolve(call);
  }

  /** 把 plugins/<作者>/<插件名>/... 换成 plugins/<插件名>/...（配置接口只认纯插件名）。 */
  function plainNameVariant(endpoint) {
    var m = endpoint.match(/^(.*?plugins\/)[^\/]+\/([^\/]+)(\/.*)$/);
    return m ? m[1] + m[2] + m[3] : endpoint;
  }

  function shortErr(err) {
    var d = err && err.response && err.response.data;
    var msg =
      (d && (d.message || d.error || d.detail)) ||
      (err && err.message) ||
      String(err || "未知错误");
    return String(msg).slice(0, 60);
  }

  function bridgeRequest(kind, endpoint, a, b) {
    if (!sdk) {
      var off = new Error("离线预览：没有 AstrBot 桥接，不会真正发送");
      off.offline = true;
      return Promise.reject(off);
    }
    if (API_PREFIX !== null) {
      var ep0 = API_PLAIN_NAME ? plainNameVariant(endpoint) : endpoint;
      return rawBridgeCall(kind, API_PREFIX + ep0, a, b);
    }
    if (endpoint.charAt(0) === "/") {
      API_PREFIX = "";
      return rawBridgeCall(kind, endpoint, a, b);
    }

    // 首次：穷举「前缀 × plugin_id 形式」，第一个成功的记住
    var combos = [];
    [false, true].forEach(function (plain) {
      var ep = plain ? plainNameVariant(endpoint) : endpoint;
      if (combos.some(function (c) { return c.path.endsWith(ep) && c.prefix === ""; }) && ep === endpoint) return;
      API_CANDIDATES.forEach(function (pre) {
        var path = pre + ep;
        if (!combos.some(function (c) { return c.path === path; })) {
          combos.push({ prefix: pre, plain: plain, path: path });
        }
      });
    });

    var attempts = [];
    var attempt = function (index, firstError) {
      if (index >= combos.length) {
        var err = firstError || new Error("接口路径全部不可用");
        err.message =
          "试过 " + attempts.length + " 个路径都失败：" +
          attempts
            .map(function (item) { return item.endpoint + " → " + item.error; })
            .join("；");
        err.attempts = attempts;
        return Promise.reject(err);
      }
      var combo = combos[index];
      return rawBridgeCall(kind, combo.path, a, b).then(
        function (res) {
          API_PREFIX = combo.prefix;
          API_PLAIN_NAME = combo.plain;
          return res;
        },
        function (err) {
          attempts.push({ endpoint: combo.path, error: shortErr(err) });
          return attempt(index + 1, firstError || err);
        },
      );
    };
    return attempt(0, null);
  }

  /** 把各种失败形态整理成「人话 + 能定位的信息」（绝不静默失败）。 */
  function describeError(err, endpoint) {
    if (!err) return "未知错误";
    if (err.offline) return err.message;
    var status = err.status || (err.response && err.response.status);
    var detail = "";
    if (err.response) {
      var data = err.response.data;
      if (data && typeof data === "object") {
        detail = data.message || data.error || data.detail || "";
      } else if (typeof data === "string") {
        detail = data.slice(0, 200);
      }
      if (!detail && err.response.statusText) detail = err.response.statusText;
    }
    var head = status ? ("HTTP " + status) : "请求失败";
    var tail = detail ? ("：" + detail) : ("（" + String(err.message || endpoint) + "）");
    return head + " " + endpoint + tail;
  }

  /**
   * 插件标识：endpoint 现在是「相对插件」的路径，bridge 会自己补上
   * /api/v1/plugins/extensions/<插件名>/ 前缀，所以不再需要探测，
   * 这里只保留一个名字用于界面显示与排错。
   */
  async function resolvePluginBase(preferred) {
    var base = String(preferred || ENV.pluginBase || ctx.pluginName || ctx.plugin_name || "")
      .trim().replace(/^\/+|\/+$/g, "");
    if (base) ENV.pluginBase = base;
    return base;
  }

  /**
   * 读配置：插件用 register_web_api 注册了 /<插件名>/config，
   * 页面侧只传相对路径 "config"，Dashboard 会转发到那个路由。
   */
  async function fetchRawConfig() {
    var res = await bridgeRequest("get", "config", {});
    var config = res && typeof res === "object"
      ? (res.config || res)
      : null;
    if (!config || typeof config !== "object") {
      throw new Error("配置读取成功但内容为空（插件：" + ENV.pluginBase + "）");
    }
    // v1.13.0：效果键清单由插件给（改注册表 / 加扩展后页面自动跟着变）
    if (Array.isArray(config.effect_keys)) applyEffectKeys(config.effect_keys);
    return config;
  }

  /** editor_status（插件回写的 JSON 字符串）→ 对象；没有/坏了就返回 null。 */
  function parseEditorStatus(rawConfig) {
    var raw = rawConfig ? rawConfig.editor_status : null;
    if (raw && typeof raw === "object") return raw;
    if (typeof raw !== "string" || !raw.trim()) return null;
    try {
      var parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" ? parsed : null;
    } catch (e) {
      return null;
    }
  }

  /* ---------------------------------------------------------------------------
     2b. 配置 <-> 页面表格 的转换
     配置里内容是「竖线分隔的字符串 / 多行文本」，页面里是对象数组。
     --------------------------------------------------------------------------- */

  var SEP = "|";

  function toText(v) { return v === undefined || v === null ? "" : String(v); }
  function toNum(v) {
    var n = Number(String(v === undefined || v === null ? "" : v).replace(/,/g, ""));
    return isFinite(n) ? n : v;
  }
  function cell(v) {
    // 竖线是字段分隔符，单元格里绝对不能出现（否则会把一行劈成两列）
    return toText(v).replace(/[|｜\r\n]/g, " ").trim();
  }
  function splitLine(line) {
    return toText(line).replace(/｜/g, SEP).split(SEP)
      .map(function (s) { return s.trim(); });
  }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  function text(v, d) { return toText(v) === "" ? (d === undefined ? "" : d) : toText(v); }

  /* 道具效果（item_defs 第 6 段）：键名白名单 + 中文说明，和插件 _effects.py 的 BUILTIN_EFFECTS 一致。
     **顺序也照抄注册表**（历史 8 键在前、新增键一律追加在末尾；quality_up 是别名，紧跟 buff_quality）——
     在线时插件下发的 effect_keys 就是这个顺序，兜底清单跟着走，tooltip 才不会两副面孔；
     测试里有一条断言逐项核对这份顺序（test_effects_ext 也卡「历史 8 键在前」）。
     分成三种角色：喂鱼（一次性永久）、钓手手气（按竿数）、鱼缸装饰（按小时）。
     说明文字会作为「效果」列表头的 tooltip，写错键时页面会当场把行标红。 */
  var ITEM_EFFECT_KEYS = [
    ["meat", "投喂：鱼肉 +N（永久）"],
    ["spirit", "投喂：鱼灵 +N（永久）"],
    ["sheen", "投喂：鱼光 +N（永久）"],
    ["value_up", "投喂：估值 +N（永久）"],
    ["decorate", "鱼缸装饰：value 是加成比例，持续 decoration_hours 小时"],
    ["feed_bonus", "投喂：这条鱼的投喂上限 +N 次"],
    ["buff_quality", "钓手手气：value 是倍率，生效 buff_cast_count 竿"],
    ["quality_up", "同上（旧写法，插件按 buff_quality 处理）"],
    ["heal", "预留：回复体力（插件暂未启用）"],
    ["quality_reroll", "洗髓丹：重掷这条鱼的个体品质，取更好的那次（值 = 掷几次）"],
    ["buff_casts", "钓手手气：这件道具持续几竿（省略 = 全局 buff_cast_count）"],
    ["quality_floor", "钓手保底：接下来 N 竿的品质倍率不低于 value（2.0 = 至少珍品、3.5 = 至少绝品）"]
  ];
  var ITEM_EFFECT_KEY_NAMES = ITEM_EFFECT_KEYS.map(function (kv) { return kv[0]; });
  /** 旧写法 -> 正式键名（插件给的 aliases 会并进来）。只用于提示，**绝不改写站长写的数据** */
  var ITEM_EFFECT_ALIASES = { quality_up: "buff_quality" };
  var ITEM_EFFECT_HINT = ITEM_EFFECT_KEYS.map(function (kv) {
    return kv[0] + "　" + kv[1];
  }).join("\n");

  /* 彩蛋效果（easter_egg_defs 第 4 段）。和道具效果**不是同一套解析器**：那边走
     _calc._parse_effects（键来自 _effects.EFFECTS 注册表，扩展能加），这边走
     _calc._parse_easter_egg_defs，只认**写死的 4 个键**，扩展加不了 —— 所以这份清单
     没法像道具那样从插件接口取，只能照抄解析器。改 _parse_easter_egg_defs 时同步这里。
     角色分两种：数字型（gold 整数 / luck 小数）、开关型（note / heal_bait，写 1 即可）。
     ⚠️ 数字型的值走 `_defs_num`，**允许千分位逗号**（`1,200` / `1，200`），
     校验时必须跟着放行，否则会把本来能用的行标红。 */
  var EGG_EFFECT_KEYS = [
    ["gold", "金币：整数，直接加到玩家身上"],
    ["luck", "运气：小数（0.08 = +8%），只作用于这一次出鱼"],
    ["note", "开关：给一张漂流瓶纸条（写 1 即可）"],
    ["heal_bait", "开关：这一竿不消耗鱼饵（写 1 即可）"]
  ];
  var EGG_EFFECT_KEY_NAMES = EGG_EFFECT_KEYS.map(function (kv) { return kv[0]; });
  /** 开关型：值写成什么插件都收（_parse_easter_egg_defs 只判「是不是 1/true/yes/on/y/空」），不校验值 */
  var EGG_EFFECT_FLAG_KEYS = ["note", "heal_bait"];
  var EGG_EFFECT_HINT = EGG_EFFECT_KEYS.map(function (kv) {
    return kv[0] + "　" + kv[1];
  }).join("\n");

  /**
   * 用插件给的清单替换内置清单（v1.13.0）。
   *
   * 插件在 config / scenes 接口里带了 effect_keys：
   * [{key, label, scope_label, unit, source, aliases}]，于是「改 _effects.EFFECTS 或者加一个
   * 扩展」页面会自动多出新键 —— 页面不再写死效果清单（写死过，害站长被标红过）。
   * ``aliases`` 是插件解析器照收的**旧写法**（例如 quality_up = buff_quality）：
   * 这些也必须认，否则会对着一行完全能用的配置喊「插件不认识的效果键」（站长报过）。
   * 拿不到清单（离线预览 / 老版本插件）就保持内置清单：
   * 宁可不校验，也不能把本来对的行标红。
   */
  function applyEffectKeys(list) {
    if (!Array.isArray(list) || !list.length) return false;
    var rows = [];
    var aliases = {};
    list.forEach(function (item) {
      var key = toText(item && item.key);
      if (!key) return;
      var label = toText(item && item.label) || key;
      var unit = toText(item && item.unit);
      var from = toText(item && item.source);
      if (from && from !== "内置") label += "（来自 " + from + "）";
      else if (unit) label += "（" + unit + "）";
      rows.push([key, label]);
      (Array.isArray(item && item.aliases) ? item.aliases : []).forEach(function (a) {
        var alias = toText(a);
        if (!alias) return;
        aliases[alias] = key;
        rows.push([alias, "旧写法，等同于 " + key]);
      });
    });
    if (!rows.length) return false;
    var oldHint = ITEM_EFFECT_HINT;
    ITEM_EFFECT_KEYS = rows;
    ITEM_EFFECT_KEY_NAMES = rows.map(function (kv) { return kv[0]; });
    ITEM_EFFECT_ALIASES = aliases;
    ITEM_EFFECT_HINT = rows.map(function (kv) { return kv[0] + "　" + kv[1]; }).join("\n");
    // TABLE_DEFS 是启动时就建好的静态对象，title 已经把旧文本抄走一份 —— 同步回来
    Object.keys(TABLE_DEFS).forEach(function (k) {
      var def = TABLE_DEFS[k];
      if (def && def.title === oldHint) def.title = ITEM_EFFECT_HINT;
    });
    return true;
  }

  /** 每条内容表定义：配置键 + 线格式 + 两个方向的映射。 */
  var TABLE_DEFS = {
    fish: {
      configKey: "fish_defs",
      configType: "text",
      /* id|名称|稀有度|基准价|分布|说明 */
      parse: function (line) {
        var p = splitLine(line);
        if (p.length < 4 || !p[0] || !p[1]) return null;

        if (at < 0) at = spec.indexOf("：");

        return { name: p[0], action: action, body: body };

  /* ===========================================================================
     3b. 全量配置键：入口判定 / 说明合并 / 覆盖率兜底（v1.18.16）
     ---------------------------------------------------------------------------
     站长那句「编辑器要能编辑插件的所有东西，所有」的落地方式：
     ① NUMBER_KEYS 收全 `_conf_schema.json` 的每一个键；
     ② 每个键都标出「在哪儿改」（本页 / 别的标签页 / 插件面板只读）；
     ③ configKeyCoverage() 拿插件下发的真实键清单反过来核对，
        出现「插件有、页面没入口」的键就当场列出来（测试里会断言它必须是空的）。
     =========================================================================== */

  /** 一个 NUMBER_KEYS 条目的入口："" = 本页可改 / "tab:xxx" / "panel"。 */
  function numberEntryOf(item) {
    return toText(item && item[6]).trim();
  }

  /** 入口 -> 给人看的说法（数值页那一列和「全部配置键」都用它）。 */
  function keyEntryLabel(entry) {
    var e = toText(entry);
    if (e === "panel") return "插件面板（页面只读）";
    if (e.indexOf("tab:") === 0) {
      var tab = TAB_BY_ID[e.slice(4)];
      return tab ? ("「" + tab.label + "」页") : ("未知标签页 " + e.slice(4));
    }
    return "本页可改";
  }

  /** 入口 -> 能不能在页面上真正改（panel 不行，得去插件配置面板）。 */
  function keyEntryEditable(entry) {
    var e = toText(entry);
    return e === "" || e.indexOf("tab:") === 0;
  }

  /** 插件下发的配置键说明（键 -> {label, unit, desc, group}）：有就用它的，页面那份当兜底。 */
  var KEY_DOCS = {};

  /**
   * config 接口的 payload 里夹着的**非配置项**通道字段
   * （`_editor_config_payload` 除了配置还会带上这几个），核对键清单时要排除。
   * 后面几个（metadata / i18n / config）是桥接 SDK 可能套的外壳，顺手一起挡掉。
   */
  var CONFIG_PAYLOAD_EXTRA_KEYS = [
    "status", "transport", "effect_keys", "effect_hint", "extensions",
    "metadata", "i18n", "config"
  ];

  function applyKeyDocs(docs) {
    if (!docs || typeof docs !== "object") return 0;
    var n = 0;
    Object.keys(docs).forEach(function (key) {
      var d = docs[key];
      if (!d || typeof d !== "object") {
        if (toText(d)) { KEY_DOCS[key] = { desc: toText(d) }; n++; }
        return;
      }
      KEY_DOCS[key] = {
        label: toText(d.label),
        unit: toText(d.unit),
        desc: toText(d.desc || d.description),
        group: toText(d.group)
      };
      n++;
    });
    return n;
  }

  /**
   * NUMBER_KEYS 条目（+ 当前值）-> 数值页/全部配置键用的一行。
   * `value === undefined` 表示插件这次没下发这个键（行还在，只是没有当前值）。
   */
  function numberRowFromItem(item, value) {
    var key = toText(item && item[0]);
    var doc = KEY_DOCS[key] || {};
    var asText = !!(item && item[4]);
    var entry = numberEntryOf(item);
    var noValue = value === undefined || value === null;
    /* 值：文本行原样带走；数字行能转成数字就转，转不了（例如 editor_status 那段 JSON）
       就退回原文 —— 绝不能显示成 NaN，也不能把空串显示成 0。 */
    var shown = "";
    if (!noValue) {
      if (asText) {
        shown = toText(value);
      } else {
        var asNumber = toNum(value);
        shown = (toText(value).trim() !== "" && isFinite(asNumber)) ? asNumber : toText(value);
      }
    }
    return {
      key: key,
      label: toText(doc.label) || toText(item && item[1]),
      value: shown,
      unit: toText(doc.unit) || toText(item && item[2]),
      desc: toText(doc.desc) || toText(item && item[3]),
      text: asText,
      group: toText(doc.group) || toText(item && item[5]) || "其他",
      entry: entry,
      entryLabel: keyEntryLabel(entry),
      hasValue: !noValue
    };
  }

  /**
   * 配置键总览：插件下发的键清单 vs 页面认识的入口。
   *
   * 返回 `{ keys, entries, missing, badEntry, counts }`：
   *   - `missing`：插件有、页面**没有任何入口**的键 —— 这个集合必须是空的
   *     （空不了就说明插件加了新配置项，页面要跟着补一行）
   *   - `badEntry`：入口写错（例如 tab: 后面的标签页 id 不存在）的键
   */
  function configKeyCoverage(rawKeys) {
    var entries = {};
    var badEntry = [];
    NUMBER_KEYS.forEach(function (item) {
      var key = toText(item[0]);
      if (!key) return;
      var entry = numberEntryOf(item);
      entries[key] = entry || "numbers";
      if (entry.indexOf("tab:") === 0 && !TAB_BY_ID[entry.slice(4)]) badEntry.push(key);
    });
    var keys = [];
    var seen = {};
    (rawKeys || []).forEach(function (k) {
      var key = toText(k);
      if (!key || seen[key]) return;
      seen[key] = true;
      keys.push(key);
    });
    var missing = keys.filter(function (k) { return !entries[k]; });
    var counts = { numbers: 0, tab: 0, panel: 0, total: keys.length, missing: missing.length };
    keys.forEach(function (k) {
      var e = entries[k];
      if (!e) return;
      if (e === "numbers") counts.numbers++;
      else if (e === "panel") counts.panel++;
      else counts.tab++;
    });
    return {
      keys: keys, entries: entries, missing: missing, badEntry: badEntry, counts: counts
    };
  }

  /** 当前这份配置（插件下发的键清单，离线用全量清单）的覆盖率。 */
  function configKeyCoverageNow() {
    var keys = (state.configKeys && state.configKeys.length)
      ? state.configKeys
      : NUMBER_KEYS.map(function (item) { return toText(item[0]); });
    return configKeyCoverage(keys);
  }

  /**
   * 插件面板项里「永远只读」的键：页面自己的状态通道 + 插件回写的运行状态。
   * （其余 panel 键只要插件白名单放行，页面就跟着变成可编辑，见 numberRowPlan。）
   */
  var PANEL_NEVER_WRITABLE = ["editor_status", "data_status"];

  /**
   * NUMBER_KEYS 条目 + 插件下发的值 + 可写白名单 -> 数值页的一行。
   *
   * 插件给的 `numbers_editable` 是**最终权威**：
   *   - 不在白名单里 -> 行照样显示，但没有输入框（并写清为什么）；
   *   - 白名单里明确放行的键，**就算清单里标着「插件面板」也按可改渲染** ——
   *     v1.18.16 就是这样把 `backup_dir` 放开的（页面清单里它已是普通可改项，
   *     `data_*` / 上传字段仍由插件白名单挡着）。
   */
  function numberRowPlan(item, value, allowed) {
    var key = toText(item && item[0]);
    var row = numberRowFromItem(item, value);
    var inWhitelist = !allowed || allowed.indexOf(key) >= 0;
    if (row.entry === "panel" && allowed && inWhitelist && PANEL_NEVER_WRITABLE.indexOf(key) < 0) {
      row.entry = "";
      row.entryLabel = keyEntryLabel("");
      row.openedByPlugin = true;
    }
    row.writable = row.entry === "" && inWhitelist;
    if (!row.writable && row.entry === "") {
      row.readonlyWhy = "插件没把这个键放进可写白名单（在页面上改了也存不下去）";
    }
    return row;
  }

  /** lastLoadError：本轮载入失败的原因（给页面显示，不白屏）。 */
  var lastLoadError = "";
  /** skipped：哪些内容表有行没解析出来（提示用户先导出留底）。 */
  var skipped = {};
  /** 最近一次读到的 editor_status（保存时要拿 numbers_editable 白名单）。 */
  var lastStatus = null;
  /** 自动重载定时器 */
  var reloadTimer = null;

  /** 页面表格 -> 配置表（返回 {configKey: text|array}）。 */
  function serializeContentTables() {
    var tables = {};
    Object.keys(TABLE_DEFS).forEach(function (tabId) {
      var def = TABLE_DEFS[tabId];
      var keyField = def.keyField || "id";
      var rows = (state.data[tabId] || []).filter(function (row) {
        return String(row && (row[keyField] || row.id) || "").trim() !== "";
      });
      var lines = rows.map(function (row) { return def.serialize(row); });
      tables[def.configKey] = def.configType === "text" ? lines.join("\n") : lines;
    });
    return tables;
  }

  /**
   * 解析 `id:0.7,中文名:0.8` 这种「键:值」小表（咬钩率 / 钓点系数都是这个形态）。
   * 返回 `{order: [键...], map: {键: 数值文本}}` —— **保留原始写法**，
   * 这样回写时不会把站长写的中文名或百分数改掉。
   */
  function parseNamedFloats(text0) {
    var order = [];
    var map = {};
    toText(text0).split(/[,，\n]/).forEach(function (part) {
      var s = toText(part).trim();
      if (!s) return;
      var i = s.indexOf(":");
      if (i < 0) i = s.indexOf("：");
      if (i < 0) return;
      var k = s.slice(0, i).trim();
      var v = s.slice(i + 1).trim();
      if (!k || !v) return;
      if (!Object.prototype.hasOwnProperty.call(map, k)) order.push(k);
      map[k] = v;
    });
    return { order: order, map: map };
  }

  /** 外挂列（例如鱼饵的「咬钩率」）的原始文本：读配置时记下来，保存时以它为底。 */
  function externalColumnState() {
    if (!state.externalBase) state.externalBase = {};
    return state.externalBase;
  }

  /**
   * 把「外挂列」的值补进表格行 —— 在线读配置与离线演示**共用这一段**。
   *
   * 鱼饵的咬钩率存在 `bait_hook_rates`（`id:概率,...`）里，不在 `bait_defs` 行里，
   * 所以鱼饵页那一列要在解析完之后再填：先按 id 找，找不到再按中文名找
   * （插件解析也认中文名，站长可能写成「蚯蚓:0.7」）。
   */
  function fillExternalColumns(tabId, rows, raw) {
    var def = TABLE_DEFS[tabId];
    if (!def || !def.externalMap || !rows) return rows;
    var em = def.externalMap;
    var mapText = toText((raw || {})[em.configKey]);
    externalColumnState()[em.configKey] = mapText;
    var parsed = parseNamedFloats(mapText);
    rows.forEach(function (row) {
      var keys = [toText(row.id).trim(), toText(row.name).trim()];
      for (var i = 0; i < keys.length; i++) {
        if (keys[i] && Object.prototype.hasOwnProperty.call(parsed.map, keys[i])) {
          row[em.column] = parsed.map[keys[i]];
          row[em.column + "_key"] = keys[i];
          break;
        }
      }
    });
    return rows;
  }

  /**
   * 把「外挂列」的值回写进它真正的那个配置键（数值页里的那一行）。
   *
   * 例：鱼饵页的「咬钩率」列 → `bait_hook_rates`。以**数值页当前那行文本**为底
   * （站长可能在数值页手改过），只覆盖表格里填了值的那些条目；留空 = 不动它。
   * 这样两个界面看的是同一份数据，不会各存一份。
   */
  function applyExternalColumns() {
    var out = [];
    TABS.forEach(function (tab) {
      // ⚠️ 列的声明在 TABLE_DEFS 里（TABS 只管表格长什么样），两处都要看
      var def = TABLE_DEFS[tab.id] || {};
      if (!def.externalMap || !tab.columns) return;
      var em = def.externalMap;
      var row = (state.data.numbers || []).filter(function (r) { return r.key === em.configKey; })[0];
      var baseText = row && row.value !== "" && row.value !== null && row.value !== undefined
        ? row.value
        : (externalColumnState()[em.configKey] || "");
      var base = parseNamedFloats(baseText);
      var values = {};
      base.order.forEach(function (k) { values[k] = base.map[k]; });
      var touched = 0;
      (state.data[tab.id] || []).forEach(function (r) {
        var id = toText(r.id).trim();
        if (!id) return;
        var raw = r[em.column];
        if (raw === "" || raw === null || raw === undefined) return;   // 留空 = 这一项不动
        if (!isFinite(Number(raw))) return;                            // 填错的不动（校验会拦下来）
        var n = Number(raw);
        if (n > 1) n = n / 100;                                        // 写 70 = 70%（与插件解析口径一致）
        n = Math.min(1, Math.max(0, n));
        if (base.order.indexOf(id) < 0) base.order.push(id);
        values[id] = fmtNum(n);
        touched += 1;
      });
      if (!touched || !row || row.entry || row.writable === false) return;
      row.value = base.order.map(function (k) { return k + ":" + values[k]; }).join(",");
      row.touched = true;
      out.push(em.configKey);
    });
    return out;
  }

  /** 页面「数值」表格 -> 只挑插件白名单里的键（白名单外的绝不发）。 */
  function numberValuesFromPage(statusHint) {
    var allowed = (statusHint && statusHint.numbers_editable) || null;
    var out = {};
    (state.data.numbers || []).forEach(function (row) {
      var key = String(row && row.key || "");
      if (!key) return;
      // 入口行（在别的页改 / 插件面板只读）永远不提交：
      // 它们的值是**展示用的**（editor_status 那种几 KB 的 JSON），发过去会被插件整批拒收
      if (row.entry || row.writable === false) return;
      if (allowed && allowed.indexOf(key) < 0) return;
      if (row.value === "" || row.value === null || row.value === undefined) return;
      out[key] = row.value;
    });
    return out;
  }

  /** editor_status 里的自动备份设置 -> 页面表单字段。 */
  function autobackupFromStatus(status) {
    var ab = (status && status.autobackup) || null;
    if (!ab) return deepClone(DEMO.autoBackup);
    return {
      enable: !!ab.enable,
      dailyHour: num(ab.daily_hour, 4),
      intervalHours: num(ab.interval_hours, 6),
      keepDaily: num(ab.keep_daily, 30),
      keepInterval: num(ab.keep_interval, 20),
      keepManual: num(ab.keep_manual, 0)
    };
  }

  /** 自动备份设置：页面字段 -> 插件字段（键名以 DEFAULTS 为准）。 */
  function autobackupPayload(ab) {
    return {
      enable: !!ab.enable,
      daily_hour: num(ab.dailyHour, 4),
      interval_hours: num(ab.intervalHours, 6),
      keep_daily: num(ab.keepDaily, 30),
      keep_interval: num(ab.keepInterval, 20),
      keep_manual: num(ab.keepManual, 0)
    };
  }

  /**
   * 配置里的「内容表」→ 页面表格行（在线读配置与离线演示**共用这一段**）。
   *
   * 文本形态的表按换行拆行（插件下发的是带 `\n` 的多行文本），列表形态的直接用；
   * 解析不出来的行记进 `skipped`，并在 `notes` 里留一句提醒。
   */
  function parseContentTables(raw, notes) {
    var out = {};
    Object.keys(TABLE_DEFS).forEach(function (tabId) {
      var def = TABLE_DEFS[tabId];
      var rawValue = raw[def.configKey];
      var lines = def.configType === "text"
        ? toText(rawValue).split("\n")
        : (Array.isArray(rawValue) ? rawValue.slice() : null);
      if (lines === null) {
        notes.push(def.configKey + " 不是字符串数组，已留空（原值没动）");
        out[tabId] = [];
        return;
      }
      var rows = [];
      lines.forEach(function (line) {
        var s = toText(line).trim();
        if (!s || s.charAt(0) === "#") return;
        var row;
        try {
          row = def.parse(s);
        } catch (err) {
          row = null;
        }
        if (row === null) {
          skipped[def.configKey] = (skipped[def.configKey] || 0) + 1;
          return;
        }
        rows.push(row);
      });
      fillExternalColumns(tabId, rows, raw);
      out[tabId] = rows;
    });
    return out;
  }

  /**
   * 读取编辑器需要的全部数据。
   * 在线：GET 插件配置 → 解析内容表 + 用 editor_status 补存档/玩家/备份设置。
   * 离线：返回内置演示数据（保存不会真正生效）。
   * 解析失败会 **抛出带原因的错误**，由调用方显示在页面上（不白屏）。
   */
  async function loadConfig() {
    if (!ENV.online) return demoConfig();
    var raw;
    try {
      raw = await fetchRawConfig();
    } catch (e) {
      lastLoadError = describeError(e, "plugins/" + ENV.pluginBase + "/config");
      if (e && e.offline) return demoConfig();
      throw new Error(lastLoadError);
    }

    var notes = [];
    var out = parseContentTables(raw, notes);

    var status = parseEditorStatus(raw);
    lastStatus = status;
    /* 插件下发了哪些配置键（用来兜底核对「页面有没有漏掉某个键」）；
       注意 payload 里还夹着几个**不是配置项**的通道字段，要排除掉 */
    state.configKeys = Object.keys(raw).filter(function (k) {
      return CONFIG_PAYLOAD_EXTRA_KEYS.indexOf(k) < 0;
    });
    // 插件要是愿意下发配置项说明（key_docs），就用它的替换页面内置那份
    applyKeyDocs(raw.key_docs || (status && status.key_docs));
    var allowed = (status && status.numbers_editable) || null;
    out.numbers = [];
    NUMBER_KEYS.forEach(function (item) {
      var key = toText(item[0]);
      if (!(key in raw)) return;      // 插件这次没下发这个键（老版本配置）：行不显示，免得给假值
      // 白名单是最终权威（不在里面就只读；放行了就连「插件面板项」也跟着可改）
      out.numbers.push(numberRowPlan(item, raw[key], allowed));
    });

    var skippedHint = Object.keys(skipped).map(function (k) {
      return k + " 有 " + skipped[k] + " 行没解析出来";
    }).join("；");
    if (skippedHint) {
      notes.push(skippedHint + "（这些行保存后会丢，先点「导出 JSON」留底）");
    }

    out.autoBackup = autobackupFromStatus(status);
    out._notes = notes;
    out._status = status;
    return out;
  }

  /**
   * 发一条指令给插件 —— 走**插件自己注册的 Web API**（相对路径）。
   *   snapshot_* → POST "snapshot"
   *   其余       → POST "config"
   * 旧版「上传固定文件名 + 插件轮询」在真实环境会被 403（API key 无上传权限），已废弃。
   */
  async function sendCommand(action, payload) {
    if (!ENV.online) {
      return { accepted: false, message: "离线预览：不会真正执行「" + action + "」" };
    }
    var name = String(action || "");
    var isSnapshot = name.indexOf("snapshot_") === 0;
    var endpoint = isSnapshot ? "snapshot" : "config";
    var body = isSnapshot
      ? Object.assign({ action: name.replace(/^snapshot_/, "") }, payload || {})
      : { action: name, payload: payload || {} };
    try {
      var res = await bridgeRequest("post", endpoint, body);
      // 插件在响应里直接回了最新状态 → 立刻用上，不用再轮询等待
      if (res && typeof res === "object" && typeof res.editor_status === "string") {
        try {
          var fresh = parseEditorStatus({ editor_status: res.editor_status });
          if (fresh) {
            pendingStatus = fresh;
            lastStatus = fresh;
          }
        } catch (e) { /* 状态解析失败不影响「已保存」这个结论 */ }
      }
      var message = (res && typeof res === "object" && res.message)
        ? String(res.message)
        : ("已执行「" + action + "」");
      var okFlag = !(res && typeof res === "object" && res.ok === false);
      return { accepted: okFlag, message: message, detail: res };
    } catch (e) {
      return { accepted: false, message: describeError(e, endpoint) };
    }
  }

  /**
   * 保存数据：内容表 + 核心数值 + 自动备份设置，各发一条指令。
   * 插件是同步写回配置的，所以返回的 ok 就是真实结果（不再是「已提交」）。
   */
  async function saveConfig(payload) {
    if (!ENV.online) {
      return { ok: false, message: "离线预览：不会真正保存" };
    }
    var results = [];
    try {
      // 外挂列（鱼饵咬钩率这类）先合回它真正的配置键，再一起提交
      applyExternalColumns();
      results.push(await sendCommand("save_content", { tables: serializeContentTables() }));
      var numbers = numberValuesFromPage(lastStatus);
      if (Object.keys(numbers).length) {
        results.push(await sendCommand("save_numbers", numbers));
      }
      if (payload && payload.autoBackup && state.autoBackupDirty) {
        results.push(await sendCommand("save_autobackup", autobackupPayload(payload.autoBackup)));
      }
    } catch (e) {
      return { ok: false, message: "提交失败：" + describeError(e, "config") };
    }

    var accepted = results.filter(function (r) { return r.accepted; });
    if (!accepted.length) {
      var first = results[0] || {};
      return { ok: false, message: "保存没成功：" + (first.message || "未知原因") };
    }
    if (accepted.length < results.length) {
      var bad = results.filter(function (r) { return !r.accepted; })[0] || {};
      return {
        ok: false,
        message: "只成功了 " + accepted.length + "/" + results.length +
          " 项；失败的那项：" + (bad.message || "未知原因")
      };
    }
    // 插件是同步写回配置的（register_web_api 的 POST），所以这里就是真实结果。
    return {
      ok: true,
      message: accepted.map(function (r) { return r.message; }).join("；")
    };
  }

  /** 读存档列表与自动备份设置（来自 editor_status）。 */
  async function loadSnapshots() {
    if (!ENV.online) {
      return {
        snapshots: deepClone(DEMO.snapshots),
        autoBackup: deepClone(DEMO.autoBackup)
      };
    }
    try {
      var raw = await fetchRawConfig();
      var status = parseEditorStatus(raw);
      lastStatus = status;
      var list = ((status && status.snapshots) || []).map(function (s, i) {
        return {
          id: "s" + (i + 1) + "_" + text(s.name),
          name: text(s.name),                 // 真实文件名：恢复/删除/改名都用它
          rel: text(s.rel || s.name),
          kind: text(s.kind, "manual"),
          kind_name: text(s.kind_name),
          note: text(s.note),
          time: text(s.time),
          players: (s.players === undefined || s.players === null) ? "—" : s.players,
          size: text(s.size, "—"),
          mtime: num(s.mtime, 0)
        };
      });
      return {
        snapshots: list,
        autoBackup: autobackupFromStatus(status),
        players: status ? num(status.players, 0) : 0,
        nextAutoBackup: status ? text(status.next_auto_backup) : "",
        status: status
      };
    } catch (e) {
      lastLoadError = describeError(e, "plugins/" + ENV.pluginBase + "/config");
      return { snapshots: [], autoBackup: deepClone(DEMO.autoBackup), error: lastLoadError };
    }
  }

  /** 存档动作（新建 / 恢复 / 删除 / 重命名）。 */
  async function runSnapshotAction(action, payload) {
    if (!ENV.online) {
      return { ok: false, message: "离线预览：不会真正执行「" + action + "」" };
    }
    var map = {
      create: "snapshot_create",
      restore: "snapshot_restore",
      delete: "snapshot_delete",
      rename: "snapshot_rename",
      refresh: "refresh"
    };
    var remote = map[action];
    if (!remote) return { ok: false, message: "不认识的动作「" + action + "」" };

    var p = payload || {};
    var body = {};
    if (remote === "snapshot_create") {
      body = { note: text(p.note) };
    } else if (remote === "snapshot_restore") {
      body = { name: text(p.name || p.id), player: text(p.player) };
    } else if (remote === "snapshot_delete") {
      body = { name: text(p.name || p.id) };
    } else if (remote === "snapshot_rename") {
      body = { name: text(p.name || p.id), note: text(p.note) };
    }
    if (remote !== "refresh" && remote !== "snapshot_create" && !body.name) {
      return { ok: false, message: "这条存档没有文件名（先点「刷新列表」再试）" };
    }

    var res = await sendCommand(remote, body);
    if (!res.accepted) return { ok: false, message: res.message };

    var status = await waitForStatus();
    if (!status) {
      scheduleReload(1800);
      return { ok: true, message: "已提交，插件还没回写结果（稍后自动刷新）" };
    }
    // 插件回写了新状态：立刻用它刷新界面（不用等下一次整页重载）
    applyStatus(status);
    render();
    scheduleReload(1800);
    return { ok: status.ok !== false, message: text(status.last_result) || res.message };
  }

  /** 把 editor_status 的即时变更并进页面状态（存档列表 / 玩家数 / 备份设置）。 */
  function applyStatus(status) {

    if (Array.isArray(status.snapshots)) {
      state.snapshots = status.snapshots.map(function (s, i) {
        return {
          id: "s" + (i + 1) + "_" + text(s.name),
          name: text(s.name),
          rel: text(s.rel || s.name),
          kind: text(s.kind, "manual"),
          kind_name: text(s.kind_name),
          note: text(s.note),
          time: text(s.time),
          players: (s.players === undefined || s.players === null) ? "—" : s.players,
          size: text(s.size, "—"),
          mtime: num(s.mtime, 0)
        };
      });
    }
    if (status.players !== undefined) state.players = num(status.players, 0);
    if (status.next_auto_backup !== undefined) state.nextAutoBackup = text(status.next_auto_backup);
    if (Array.isArray(status.user_edited_keys)) state.userEditedKeys = status.user_edited_keys.map(text);
    if (status.autobackup) state.autoBackup = autobackupFromStatus(status);

    if (status.legacy && typeof status.legacy === "object") state.legacy = status.legacy;

  /** 等插件处理完这条指令：读配置直到 editor_status.updated_at 变新。 */
  async function waitForStatus(tries) {
    // 写操作的响应里已经带了最新状态：直接用，不用再等一轮
    if (pendingStatus) {
      var ready = pendingStatus;
      pendingStatus = null;
      return ready;
    }
    // NaN/undefined 一律当 0：否则第一次动作会白等满 6 秒才放弃
    var base = num(lastStatus && lastStatus.updated_at, 0);
    var rounds = tries || 10;   // 写入是同步的，这里只兜底极端情况
    for (var i = 0; i < rounds; i++) {
      await sleep(600);
      try {
        var raw = await fetchRawConfig();
        var status = parseEditorStatus(raw);
        if (status && num(status.updated_at, 0) > base) {
          lastStatus = status;
          return status;
        }
      } catch (e) {
        // 读失败就再等一轮（刚上传完，配置可能正被插件重写）
      }
    }
    return null;
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

      reloadAll(true);
    }, delay || 2000);

  }
