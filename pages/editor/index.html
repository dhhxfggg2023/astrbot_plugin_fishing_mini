  var TAB_BY_ID = {};
  TABS.forEach(function (t) { TAB_BY_ID[t.id] = t; });

  /* ===========================================================================
     5. 状态
     =========================================================================== */
  var state = {
    tab: (function () {
      // 支持 #hash 直达某个标签页
      var h = (location.hash || "").replace(/^#/, "");
      return TAB_BY_ID[h] ? h : "fish";
    })(),
    query: "",
    filter: "",
    sort: "default",
    selected: [],          // 选中行的索引
    editing: null,         // { index, key }
    pendingConfirm: null,  // { scope:"row"|"card"|"batch", index, action }
    data: {},              // tabId -> rows
    originals: {},         // tabId -> { idValue: serialized }
    snapshots: [],
    autoBackup: { enable: true, dailyHour: 4, intervalHours: 6, keepDaily: 30, keepInterval: 20 },
    savedAt: null,
    loading: true,
    loadError: "",         // 读取插件配置失败时的原因（页面顶部显示，不白屏）
    loadNotes: [],         // 解析时的小提示（比如某张表有几行没认出来）
    players: undefined,    // 玩家数（来自 editor_status）
    nextAutoBackup: ""     // 下次自动存档时间（来自 editor_status）
  };

  /* ===========================================================================
     6. 小工具
     =========================================================================== */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function deepClone(v) { return JSON.parse(JSON.stringify(v)); }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtNum(v) {
    var n = Number(v);
    if (!isFinite(n)) return String(v);
    if (Math.abs(n) >= 1000) return n.toLocaleString("zh-CN");
    return String(n);
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function nowText() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function toast(kind, title, text) {
    var box = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast " + (kind || "info");
    var icon = { ok: "✅", warn: "⚠️", err: "⛔", info: "ℹ️" }[kind || "info"] || "ℹ️";
    el.innerHTML =
      '<span class="toast-icon">' + icon + "</span>" +
      '<div class="toast-body"><div class="toast-title">' + esc(title) + "</div>" +
      (text ? '<div class="toast-text">' + esc(text) + "</div>" : "") + "</div>";
    box.appendChild(el);
    setTimeout(function () {
      el.classList.add("is-out");
      setTimeout(function () { el.remove(); }, 220);
    }, 2500);
  }

  /* 把分布字符串解析成标签数组： "lake:1.0,*:0.15" → [{loc,weight,star,bad}] */
  function parseDist(raw, knownLocs) {
    var out = [];
    String(raw || "").split(",").forEach(function (piece) {
      var p = piece.trim();
      if (!p) return;
      var idx = p.lastIndexOf(":");
      var loc = idx >= 0 ? p.slice(0, idx).trim() : p;
      var wRaw = idx >= 0 ? p.slice(idx + 1).trim() : "";
      var w = wRaw === "" ? 1 : Number(wRaw);
      var star = loc === "*";
      var bad = !star && knownLocs.indexOf(loc) < 0;
      out.push({ loc: loc, weight: isFinite(w) ? w : 0, star: star, bad: bad, badWeight: wRaw !== "" && !isFinite(w) });
    });
    return out;
  }

  /** 当前标签下所有已知钓点 id + 名称（用于分布与需要鱼竿的校验） */
  function knownLocationKeys() {
    var rows = state.data.locations || [];
    var list = [];
    rows.forEach(function (r) {
      if (r.id) list.push(String(r.id));
      if (r.name) list.push(String(r.name));
    });
    return list;
  }

  function rowKey(tab, row) {
    // 有的表（按钮）没有天然唯一的 id，就按「场景+文案+指令」组合成键
    var fields = tab.keyFields || [tab.keyField || "id"];
    var parts = [];
    for (var i = 0; i < fields.length; i++) {
      parts.push(String((row && row[fields[i]]) || ""));
    }
    return parts.join(KEY_SEP);
  }


  /* 计算某个标签页的改动情况：{ dirtyRows:Set<index>, added, removed, total } */
  function diffTab(tabId) {
    var tab = TAB_BY_ID[tabId];
    var rows = state.data[tabId] || [];
    var orig = state.originals[tabId] || {};
    var dirty = {};
    var seen = {};
    var added = 0;
    var changed = 0;

    rows.forEach(function (row, i) {
      var k = rowKey(tab, row);
      seen[k] = true;
      if (!k || !(k in orig)) { dirty[i] = true; added++; return; }
      if (JSON.stringify(row) !== orig[k]) { dirty[i] = true; changed++; }
    });

    var removed = 0;
    Object.keys(orig).forEach(function (k) { if (!seen[k]) removed++; });

    return { dirty: dirty, added: added, changed: changed, removed: removed, total: rows.length,
             count: added + changed + removed };
  }

  function dirtyTotal() {
    var n = 0;
    TABS.forEach(function (t) {
      if (t.kind === "snapshots") return;
      n += diffTab(t.id).count;
    });
    return n;
  }

  /* 校验一行，返回 { key: "错误说明" } */
  function validateRow(tab, row) {
    var errs = {};
    var locs = knownLocationKeys();
    var rodIds = (state.data.rods || []).map(function (r) { return String(r.id); });

    (tab.columns || []).forEach(function (col) {
      var v = row[col.key];

      if (col.type === "number") {
        if (v === "" || v === null || v === undefined || !isFinite(Number(v))) {
          errs[col.key] = "需要是数字";
        }
      }

      if (col.key === "rarity" && RARITIES.indexOf(String(v)) < 0) {
        errs[col.key] = "只能是：" + RARITIES.join(" / ");
      }

      if (col.type === "dist") {
        var parts = parseDist(v, locs);
        if (!parts.length) errs[col.key] = "至少写一个钓点，例如 lake:1.0";
        else if (parts.some(function (p) { return p.bad; })) errs[col.key] = "有钓点不存在";
        else if (parts.some(function (p) { return p.badWeight; })) errs[col.key] = "权重需要是数字";
      }

      if (tab.id === "fish" && col.key === "id" && !String(v || "").trim()) {
        errs[col.key] = "id 不能为空";
      }

      if (tab.id === "baits" && col.key === "required_rod" && String(v || "").trim()) {
        if (rodIds.indexOf(String(v).trim()) < 0) errs[col.key] = "鱼竿 id 不存在";
      }

      if (tab.id === "buttons") {
        var raw = String(v === undefined || v === null ? "" : v).trim();
        if (col.key === "scene" && BUTTON_SCENES.indexOf(raw.toLowerCase()) < 0) {
          errs[col.key] = "只能是：" + BUTTON_SCENES.join(" / ");
        }
        if (col.key === "label" && !raw) {
          errs[col.key] = "按钮文案不能为空";
        }
        if (col.key === "data" && (!raw || raw.indexOf("/钓鱼") !== 0)) {
          errs[col.key] = "要写本插件指令，例如 /钓鱼 背包";
        }
        if (col.key === "style" && !isButtonStyle(raw)) {
          errs[col.key] = "写 default / primary，或 0-255 的数字";
        }
      }
    });

    return errs;
  }

  function tabHasError(tabId) {
    var tab = TAB_BY_ID[tabId];
    if (!tab.columns) return false;
    var rows = state.data[tabId] || [];
    for (var i = 0; i < rows.length; i++) {
      if (Object.keys(validateRow(tab, rows[i])).length) return true;
    }
    return false;
  }
  /* ===========================================================================
     7. 过滤 / 排序
     =========================================================================== */
  function visibleRows(tab) {
    var rows = state.data[tab.id] || [];
    var q = state.query.trim().toLowerCase();
    var list = rows.map(function (row, index) { return { row: row, index: index }; });

    if (q) {
      list = list.filter(function (it) {
        return String(it.row.id || "").toLowerCase().indexOf(q) >= 0 ||
               String(it.row.name || it.row.label || "").toLowerCase().indexOf(q) >= 0 ||
               String(it.row.desc || it.row.flavor || "").toLowerCase().indexOf(q) >= 0;
      });
    }

    if (state.filter && tab.filterKey) {
      list = list.filter(function (it) {
        return String(it.row[tab.filterKey]) === state.filter;
      });
    }

    var rarityRank = {};
    RARITIES.forEach(function (r, i) { rarityRank[r] = i; });

    var sorters = {
      name: function (a, b) { return String(a.row.name || "").localeCompare(String(b.row.name || ""), "zh-CN"); },
      valueAsc: function (a, b) { return numOf(a.row, tab) - numOf(b.row, tab); },
      valueDesc: function (a, b) { return numOf(b.row, tab) - numOf(a.row, tab); },
      weightDesc: function (a, b) { return Number(b.row.weight || 0) - Number(a.row.weight || 0); },
      multDesc: function (a, b) { return Number(b.row.value_mult || 0) - Number(a.row.value_mult || 0); },
      level: function (a, b) { return Number(a.row.level_gate || 0) - Number(b.row.level_gate || 0); },
      scene: function (a, b) { return String(a.row.scene || "").localeCompare(String(b.row.scene || ""), "zh-CN"); },
      labelAsc: function (a, b) { return String(a.row.label || "").localeCompare(String(b.row.label || ""), "zh-CN"); },
      rarity: function (a, b) { return (rarityRank[a.row.rarity] || 0) - (rarityRank[b.row.rarity] || 0); }
    };
    if (state.sort !== "default" && sorters[state.sort]) list.sort(sorters[state.sort]);

    return list;
  }

  function numOf(row, tab) {
    var col = (tab.columns || []).filter(function (c) { return c.valueKey; })[0];
    return Number(row[(col && col.key) || "value"] || 0);
  }

  /* ===========================================================================
     8. 渲染：标签页
     =========================================================================== */
  function renderTabs() {
    var nav = document.getElementById("tabs");
    var html = TABS.map(function (t) {
      var d = t.kind === "snapshots" ? { count: 0 } : diffTab(t.id);
      var n = t.kind === "snapshots" ? (state.snapshots || []).length : d.total;
      return '<button class="tab' + (state.tab === t.id ? " is-active" : "") + (d.count ? " has-dirty" : "") +
        '" role="tab" data-act="tab" data-tab="' + t.id + '" title="' + esc(t.title) + '">' +
        "<span>" + esc(t.label) + "</span>" +
        '<span class="tab-count">' + n + "</span>" +
        '<span class="tab-dirty" title="这个标签有 ' + d.count + ' 处未保存的修改"></span>' +
        "</button>";
    }).join("");
    nav.innerHTML = html;
  }

  /* ===========================================================================
     9. 渲染：表格类标签页
     =========================================================================== */
  function renderToolbar(tab, list, d) {
    var html = '<div class="toolbar">';

    html += '<label class="field search"><span class="field-icon">🔍</span>' +
      '<input type="search" id="searchBox" placeholder="搜索名称或 id…" value="' + esc(state.query) + '" /></label>';

    if (tab.filterOptions) {
      html += '<label class="field"><span class="field-icon">🎚️</span><select data-act="filter">';
      html += '<option value="">' + esc(tab.filterLabel || "全部筛选") + "</option>";
      tab.filterOptions.forEach(function (opt) {
        var label = opt === "" ? "（无）" : opt;
        html += '<option value="' + esc(opt) + '"' + (state.filter === String(opt) ? " selected" : "") + ">" + esc(label) + "</option>";
      });
      html += "</select></label>";
    }

    if (tab.sortOptions) {
      html += '<label class="field"><span class="field-icon">↕️</span><select data-act="sort">';
      tab.sortOptions.forEach(function (pair) {
        html += '<option value="' + esc(pair[0]) + '"' + (state.sort === pair[0] ? " selected" : "") + ">" + esc(pair[1]) + "</option>";
      });
      html += "</select></label>";
    }

    html += '<span class="divider"></span>';
    html += '<span class="stat-chip">共 <b>' + d.total + "</b> 条" +
      (list.length !== d.total ? '（筛出 <b>' + list.length + "</b>）" : "") + "</span>";
    html += '<span class="stat-chip' + (d.count ? " is-dirty" : "") + '">已改 <b>' + d.count + "</b></span>";

    html += '<span class="spacer" style="margin-left:auto"></span>';

    var sel = state.selected.length;
    html += '<span class="stat-chip">已选 <b>' + sel + "</b></span>";
    html += '<button class="btn btn-sm" data-act="batch:price" ' + (sel ? "" : "disabled") + ">价格 ×倍数</button>";
    html += '<button class="btn btn-sm" data-act="batch:rarity" ' + (sel ? "" : "disabled") + ">改稀有度</button>";
    html += '<button class="btn btn-sm" data-act="batch:dist" ' + (sel ? "" : "disabled") + ">改钓点</button>";
    html += '<button class="btn btn-sm btn-danger" data-act="batch:delete" ' + (sel ? "" : "disabled") + ">批量删除</button>";

    html += "</div>";

    if (state.batchAction) html += renderBatchStrip(tab);
    return html;
  }

  function renderBatchStrip(tab) {
    var a = state.batchAction;
    var html = '<div class="toolbar" style="background:var(--primary-soft);border-bottom-color:var(--primary)">';
    if (a === "price") {
      html += "<span class='nowrap'>把选中行的<select class='cell-input mono' style='width:120px;display:inline-block' data-act='batchField'>" +
        ['value', 'price'].map(function (k) {
          return "<option value='" + k + "'" + (state.batchField === k ? " selected" : "") + ">" + (k === "value" ? "基准价/价值" : "价格") + "</option>";
        }).join("") +
        "</select> 乘以</span>" +
        "<input class='cell-input mono' style='width:90px' data-act='batchValue' value='" + esc(state.batchValue) + "' />";
    } else if (a === "rarity") {
      html += "<span class='nowrap'>把选中行的稀有度改成</span><select class='cell-input' style='width:120px' data-act='batchValue'>" +
        RARITIES.map(function (r) { return "<option value='" + r + "'" + (state.batchValue === r ? " selected" : "") + ">" + r + "</option>"; }).join("") +
        "</select>";
    } else if (a === "dist") {
      html += "<span class='nowrap'>把选中行的分布整体改成</span>" +
        "<input class='cell-input mono' style='width:240px' data-act='batchValue' placeholder='lake:1.0,sea:0.6' value='" + esc(state.batchValue) + "' />";
    } else if (a === "delete") {
      html += "<span class='nowrap'>确定删除选中的 <b>" + state.selected.length + "</b> 行？此操作不可撤销。</span>";
    }
    html += '<button class="btn btn-sm btn-primary" data-act="batch:apply">应用</button>';
    html += '<button class="btn btn-sm" data-act="batch:cancel">取消</button>';
    html += "</div>";
    return html;
  }

  function cellHtml(tab, col, row, index) {
    var v = row[col.key];
    var editing = state.editing && state.editing.index === index && state.editing.key === col.key;
    var errs = validateRow(tab, row);
    var bad = !!errs[col.key];
    var titleAttr = errs[col.key] ? ' title="' + esc(errs[col.key]) + '"' : "";

    if (editing && col.type !== "readonly") {
      var inputType = col.type === "number" ? "number" : "text";
      var step = col.step !== undefined ? ' step="' + col.step + '"' : "";
      var cls = "cell-input" + (col.mono || col.type === "number" || col.type === "dist" ? " mono" : "") + (bad ? " is-bad" : "");
      return '<input class="' + cls + '" data-act="cell" data-index="' + index + '" data-key="' + col.key + '" type="' + inputType + '"' + step +
        ' value="' + esc(v === undefined || v === null ? "" : v) + '" />';
    }

    if (col.type === "readonly") {
      return '<span class="' + (col.mono ? "mono faint" : "muted") + (col.key === "desc" ? " cut" : "") +
        (bad ? " cell-bad" : "") + '"' + titleAttr + ">" + esc(v) + "</span>";
    }

    if (col.type === "rarity") {
      var cls2 = RARITY_CLASS[String(v)] || "rar-common";
      return '<span class="pill ' + cls2 + '" data-act="edit" data-index="' + index + '" data-key="' + col.key + '"' + titleAttr + ">" +
        esc(RARITY_EMOJI[String(v)] || "") + " " + esc(v) + "</span>";
    }

    if (col.type === "emoji") {
      return '<span class="cell-emoji" data-act="edit" data-index="' + index + '" data-key="' + col.key + '">' + esc(v || "·") + "</span>";
    }

    if (col.type === "dist") {
      var parts = parseDist(v, knownLocationKeys());
      var inner = parts.length
        ? parts.map(function (p) {
            var cls3 = "tag" + (p.star ? " is-star" : "") + (p.bad || p.badWeight ? " is-bad" : "");
            return '<span class="' + cls3 + '">' + esc(p.star ? "全部钓点" : p.loc) + " <b>" + esc(p.weight) + "</b></span>";
          }).join("")
        : '<span class="dist-empty">未配置</span>';
      return '<div class="dist' + (bad ? " cell-bad" : "") + '" data-act="edit" data-index="' + index + '" data-key="' + col.key + '"' + titleAttr + ">" + inner + "</div>";
    }

    var text = col.type === "number" ? fmtNum(v) : (v === undefined || v === null || v === "" ? "—" : String(v));
    var extra = col.pct && isFinite(Number(v)) ? ' <span class="faint">(' + (Number(v) * 100).toFixed(0) + "%)</span>" : "";
    return '<span data-act="edit" data-index="' + index + '" data-key="' + col.key + '" class="' +
      (col.mono ? "mono " : "") + (col.key === "desc" || col.key === "flavor" ? "cut " : "") + (bad ? "cell-bad" : "") + '"' + titleAttr + ">" +
      esc(text) + extra + "</span>";
  }

  function renderTableBody(tab, list) {
    if (!list.length) {
      return '<tr><td colspan="' + (tab.columns.length + 2) + '">' +
        '<div class="empty"><span class="empty-icon">🫧</span>' +
        '<div class="empty-title">这里还没有内容</div>' +
        '<div class="empty-sub">' + (state.query || state.filter ? "换个搜索词或清掉筛选试试" : "点下面的「＋ 新增一行」开始添加") + "</div>" +
        "</div></td></tr>";
    }

    return list.map(function (it) {
      var row = it.row, index = it.index;
      var errs = validateRow(tab, row);
      var invalid = Object.keys(errs).length > 0;
      var isSel = state.selected.indexOf(index) >= 0;
      var isDirty = !!(state.originals[tab.id] && (function () {
        var k = rowKey(tab, row);
        var o = state.originals[tab.id][k];
        return !o || o !== JSON.stringify(row);
      })());

      var tds = tab.columns.map(function (col) {
        var cls = [];
        if (col.num || col.type === "number") cls.push("num");
        if (col.key === "id" || col.key === "key") cls.push("id-cell");
        if (col.w) return '<td class="' + cls.join(" ") + '" style="width:' + col.w + '">' + cellHtml(tab, col, row, index) + "</td>";
        return '<td class="' + cls.join(" ") + '">' + cellHtml(tab, col, row, index) + "</td>";
      }).join("");

      var confirming = state.pendingConfirm && state.pendingConfirm.scope === "row" && state.pendingConfirm.index === index;
      var actions = confirming
        ? '<div class="confirm-strip"><span class="q">删除？</span>' +
          '<button class="btn btn-sm btn-danger" data-act="row:delYes" data-index="' + index + '">确认</button>' +
          '<button class="btn btn-sm" data-act="confirm:cancel">取消</button></div>'
        : '<button class="btn btn-sm btn-icon btn-ghost" data-act="row:copy" data-index="' + index + '" title="复制这一行">⧉</button>' +
          '<button class="btn btn-sm btn-icon btn-ghost" data-act="row:del" data-index="' + index + '" title="删除这一行">🗑</button>';

      return '<tr class="' + (isSel ? "is-selected " : "") + (isDirty ? "is-dirty " : "") + (invalid ? "is-invalid " : "") +
        (state.editing && state.editing.index === index ? "is-editing" : "") + '">' +
        '<td style="width:34px"><input type="checkbox" data-act="row:select" data-index="' + index + '"' + (isSel ? " checked" : "") + " /></td>" +
        tds +
        '<td class="actions">' + actions + "</td>" +
        "</tr>";
    }).join("");
  }

  function renderTableTab(tab) {
    var list = visibleRows(tab);
    var d = diffTab(tab.id);
    var html = '<section class="card">';

    html += '<div class="card-head"><h2>' + esc(tab.label) + " " + esc(tab.title) + "</h2>" +
      '<span class="hint">' + esc(tab.hint || "") + "</span>" +
      '<span class="spacer"></span>' +
      '<span class="hint">点单元格即可编辑 · Tab 跳到下一格</span></div>';

    if (tab.notice) {
      html += '<div class="notice"><span class="notice-icon">💡</span><div>' + esc(tab.notice) + "</div></div>";
    }

    html += renderToolbar(tab, list, d);

    html += '<div class="table-wrap"><table class="grid"' + (tab.tableMinWidth ? ' style="min-width:' + tab.tableMinWidth + '"' : "") + ">";
    html += "<thead><tr>";
    html += '<th style="width:34px"><input type="checkbox" data-act="selectAll" title="全选/取消" /></th>';
    html += tab.columns.map(function (col) {
      return '<th class="' + (col.num || col.type === "number" ? "num" : "") + '"' + (col.w ? ' style="width:' + col.w + '"' : "") + ">" +
        esc(col.label) + (col.hint ? ' <span class="col-hint">（' + esc(col.hint) + "）</span>" : "") + "</th>";
    }).join("");
    html += '<th style="width:74px"></th>';
    html += "</tr></thead>";
    html += "<tbody>" + renderTableBody(tab, list) + "</tbody>";
    html += "</table></div>";

    html += '<div class="table-foot">';
    if (tab.makeRow) {
      html += '<button class="btn btn-sm" data-act="row:add">＋ 新增一行</button>';
    }
    html += '<span class="hint faint">' + (tab.makeRow ? "新行会加在表格末尾" : "此页为只读说明列，仅「当前值」可改") + "</span>";
    html += '<span class="spacer"></span>';
    html += '<span class="hint faint">共 ' + d.total + " 条 · 新增 " + d.added + " · 修改 " + d.changed + " · 删除 " + d.removed + "</span>";
    html += "</div>";

    html += "</section>";
    return html;
  }

  /* ===========================================================================
     10. 渲染：存档页（卡片 + 表单）
     =========================================================================== */
  function renderSnapshotsTab(tab) {
    var ab = state.autoBackup;
    var html = "";

    // 新建存档：输入框 + 按钮同行，按钮只占内容宽度
    html += '<section class="card">';
    html += '<div class="card-head"><h2>💾 ' + esc(tab.title) + "</h2>" +
      '<span class="hint">' + esc(tab.hint) + "</span></div>";
    if (ENV.online) {
      html += '<div class="notice"><span class="notice-icon">ℹ️</span><div>' +
        "这里的动作会直接调用插件注册的接口并同步生效（新建 / 恢复 / 删除 / 改名都会在服务端立刻执行）。" +
        (state.players === undefined ? "" : "　当前玩家数：<b>" + esc(state.players) + "</b>") +
        (state.nextAutoBackup ? "　下次自动存档：<b>" + esc(state.nextAutoBackup) + "</b>" : "") +
        "</div></div>";
    }
    html += '<div class="new-snap">';
    html += '<div class="form-row grow"><label>存档名字（备注）</label>' +
      '<span class="field"><input type="text" id="newSnapNote" placeholder="例如：改物价前 / 版本升级前" /></span></div>';
    html += '<button class="btn btn-primary" data-act="snap:new">＋ 新建存档</button>';
    html += '<div class="form-note new-snap-hint">新建会立刻保存一份当前全部玩家数据，随时可以恢复。</div>';
    html += "</div>";

    // 自动备份设置
    html += '<div class="card-head" style="border-top:1px solid var(--border)">' +
      '<h2>⏱️ 自动备份</h2><span class="hint">下面这些是插件配置，改完一并保存生效</span></div>';
    html += '<div class="form-grid">';
    html += '<div class="form-row"><label>总开关</label>' +
      '<label class="switch"><input type="checkbox" data-act="auto:enable"' + (ab.enable ? " checked" : "") + " />" +
      '<span class="track"></span><span class="switch-label">' + (ab.enable ? "已开启" : "已关闭") + "</span></label></div>";
    html += '<div class="form-row"><label>每日存档时间点（0-23 点）</label>' +
      '<span class="field"><input type="number" min="0" max="23" data-act="auto:dailyHour" value="' + esc(ab.dailyHour) + '" /></span></div>';
    html += '<div class="form-row"><label>按时存档间隔（小时，0=关闭）</label>' +
      '<span class="field"><input type="number" min="0" max="72" data-act="auto:intervalHours" value="' + esc(ab.intervalHours) + '" /></span></div>';
    html += '<div class="form-row"><label>每日存档保留天数（0=永久）</label>' +
      '<span class="field"><input type="number" min="0" max="3650" data-act="auto:keepDaily" value="' + esc(ab.keepDaily) + '" /></span></div>';
    html += '<div class="form-row"><label>按时存档保留份数（0=永久）</label>' +
      '<span class="field"><input type="number" min="0" max="9999" data-act="auto:keepInterval" value="' + esc(ab.keepInterval) + '" /></span></div>';
    html += '<div class="form-row"><label>手动存档保留份数（0=永久）</label>' +
      '<span class="field"><input type="number" min="0" max="10000" data-act="auto:keepManual" value="' + esc(ab.keepManual) + '" /></span></div>';
    html += "</div>";
    html += "</section>";

    // 存档列表
    var list = state.snapshots || [];
    html += '<section class="card">';
    html += '<div class="card-head"><h2>🗂️ 已有存档</h2>' +
      '<span class="hint">共 ' + list.length + " 份 · 按时间倒序</span>" +
      '<span class="spacer"></span><button class="btn btn-sm" data-act="snap:reload">↻ 刷新列表</button></div>';

    if (!list.length) {
      html += '<div class="empty"><span class="empty-icon">📦</span><div class="empty-title">还没有任何存档</div>' +
        '<div class="empty-sub">点上面的「＋ 新建存档」存第一份</div></div>';
    } else {
      html += '<div class="snap-grid">' + list.map(function (s, i) { return renderSnapCard(s, i); }).join("") + "</div>";
    }
    html += "</section>";
    return html;
  }

  function renderSnapCard(s, i) {
    var confirming = state.pendingConfirm && state.pendingConfirm.scope === "card" && state.pendingConfirm.index === i;
    var renaming = state.editing && state.editing.scope === "snapNote" && state.editing.index === i;
    var busy = state.pendingConfirm && state.pendingConfirm.index === i;
    var cls = "snap-card" + (busy && state.pendingConfirm.action === "restore" ? " is-restoring" : "") +
      (busy && state.pendingConfirm.action === "delete" ? " is-deleting" : "");

    var note = renaming
      ? '<input class="cell-input" data-act="snapNote:input" data-index="' + i + '" value="' + esc(s.note || "") + '" placeholder="给这份存档起个名字…" />'
      : '<div class="snap-note" data-act="snapNote:edit" data-index="' + i + '" title="点一下改名">' +
        (s.note ? esc(s.note) : '<span class="placeholder">未命名（点这里改名）</span>') + "</div>";

    var actions;
    if (confirming) {
      var word = state.pendingConfirm.action === "restore" ? "恢复" : "删除";
      actions = '<div class="confirm-strip"><span class="q">确认' + word + "？</span>" +
        '<button class="btn btn-sm ' + (word === "删除" ? "btn-danger" : "btn-primary") + '" data-act="snap:' +
        (word === "删除" ? "delYes" : "restoreYes") + '" data-index="' + i + '">确认' + word + "</button>" +
        '<button class="btn btn-sm" data-act="confirm:cancel">取消</button></div>';
    } else {
      actions =
        '<button class="btn btn-sm" data-act="snap:restore" data-index="' + i + '" title="把这批玩家数据恢复到这份存档">↩ 恢复</button>' +
        '<button class="btn btn-sm" data-act="snap:download" data-index="' + i + '" title="下载这份存档的信息（名字/时间/玩家数），不是玩家数据本体">⬇ 下载信息</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm btn-danger" data-act="snap:delete" data-index="' + i + '" title="删除这份存档（删前会自动存一份）">🗑 删除</button>';
    }

    return '<article class="' + cls + '">' +
      '<div class="snap-top">' +
      '<span class="kind kind-' + esc(s.kind) + '">' + (KIND_ICON[s.kind] || "") + " " + (KIND_LABEL[s.kind] || s.kind) + "</span>" +
      '<span class="snap-time">' + esc(s.time) + "</span>" +
      "</div>" +
      note +
      '<div class="snap-meta">' +
      "<span>👥 " + esc(s.players) + " 名玩家</span>" +
      "<span>💽 " + esc(s.size) + "</span>" +
      (s.name ? "<span class=\"mono\" title=\"存档文件名（恢复/删除都用它）\">📄 " + esc(s.name) + "</span>" : "") +
      "</div>" +
      '<div class="snap-actions">' + actions + "</div>" +
      "</article>";
  }

  /* ===========================================================================
     11. 渲染：总入口 + 状态栏
     =========================================================================== */
  function render() {
    renderTabs();
    var tab = TAB_BY_ID[state.tab];
    var panel = document.getElementById("panel");
    var banner = renderBanner();

    if (state.loading) {
      panel.innerHTML = banner + '<section class="card"><div class="empty">' +
        '<span class="empty-icon">🎣</span><div class="empty-title">正在载入数据…</div>' +
        '<div class="empty-sub">离线预览会直接使用演示数据</div></div></section>';
    } else if (tab.kind === "snapshots") {
      panel.innerHTML = banner + renderSnapshotsTab(tab);
    } else {
      panel.innerHTML = banner + renderTableTab(tab);
    }

    renderStatusBar();
  }

  /** 顶部提示条：读取失败 / 有行没解析出来都要说清楚，不静默。 */
  function renderBanner() {
    var html = "";
    if (state.loadError) {
      html += '<div class="notice notice-danger"><span class="notice-icon">⛔</span><div>' +
        '<b>读取插件配置失败</b>　' + esc(state.loadError) +
        "<br />下面是演示数据，改动不会保存；点右上角「↻ 重新载入」重试。" +
        "</div></div>";
    }
    (state.loadNotes || []).forEach(function (note) {
      html += '<div class="notice"><span class="notice-icon">⚠️</span><div>' +
        esc(note) + "</div></div>";
    });
    return html;
  }

  function renderStatusBar() {
    var total = dirtyTotal();
    var abDirty = state.autoBackupDirty ? 1 : 0;
    var n = total + abDirty;
    var info = document.getElementById("dirtyInfo");
    if (n > 0) {
      info.innerHTML = '<i class="dot is-dirty"></i>有未保存的修改（' + n + " 处）";
    } else {
      info.innerHTML = '<i class="dot is-clean"></i>已同步';
    }
    document.getElementById("savedInfo").textContent = state.savedAt ? "上次保存 " + state.savedAt : "尚未保存";

    var tab = TAB_BY_ID[state.tab];
    var cnt = tab.kind === "snapshots" ? (state.snapshots || []).length : (state.data[tab.id] || []).length;
    document.getElementById("tabInfo").textContent = tab.title + " · " + cnt + " 条";

    var badge = document.getElementById("connBadge");
    var text = document.getElementById("connText");
    if (ENV.online) {
      badge.className = "badge is-online";
      text.textContent = "已连接 AstrBot";
    } else {
      badge.className = "badge is-offline";
      text.textContent = "离线预览";
    }
  }

  /* ===========================================================================
     12. 行内编辑
     =========================================================================== */
  function startEdit(index, key, scope) {
    var tab = TAB_BY_ID[state.tab];
    // 正在编辑别的单元格：值已经实时写入，直接收起旧的输入框
    if (state.editing && state.editing.scope === "cell") {
      state.editing = null;
      state.editBackup = null;
    }
    if (scope === "snapNote") {
      var snap = state.snapshots[index] || {};
      state.editBackup = { scope: "snapNote", index: index, note: snap.note || "" };
      state.editing = { scope: "snapNote", index: index };
      render();
      var el = $('[data-act="snapNote:input"]');
      if (el) { el.focus(); el.select(); }
      return;
    }
    if (tab.columns) {
      var col = tab.columns.filter(function (c) { return c.key === key; })[0];
      if (!col || col.type === "readonly") return;
    }
    var row = (state.data[tab.id] || [])[index];
    if (!row) return;
    state.editBackup = { index: index, key: key, value: row[key] };
    state.editing = { scope: "cell", index: index, key: key };
    render();
    var input = $('.cell-input[data-index="' + index + '"][data-key="' + key + '"]');
    if (input) { input.focus(); input.select(); }
  }

  function commitEdit() {
    var wasSnapNote = state.editing && state.editing.scope === "snapNote";
    var backup = state.editBackup;
    state.editing = null;
    state.editBackup = null;
    render();
    // 存档改名：面板上只是「改个名字」，实际是给快照文件里的 note 字段赋值
    if (wasSnapNote && backup) {
      var snap = state.snapshots[backup.index];
      if (!snap) return;
      var next = String(snap.note || "");
      if (next === String(backup.note || "")) return;
      renameSnapshot(snap, next, backup.note || "");
    }
  }

  /** 把改名指令发给插件（失败就把界面上的名字改回去，别骗人）。 */
  async function renameSnapshot(snap, next, previous) {
    var res = await runSnapshotAction("rename", { name: snap.name || snap.rel, note: next });
    if (res.ok) {
      toast("ok", "备注已提交", res.message || (previous + " → " + next));
    } else {
      snap.note = previous;
      toast("warn", "改名没成功", res.message || "插件没有回写结果");
      render();
    }
  }

  function cancelEdit() {
    if (state.editBackup) {
      var b = state.editBackup;
      if (b.scope === "snapNote") {
        var snap = state.snapshots[b.index];
        if (snap) snap.note = b.note;
      } else {
        var row = (state.data[state.tab] || [])[b.index];
        if (row) row[b.key] = b.value;
      }
    }
    state.editing = null;
    state.editBackup = null;
    render();
  }

  function onCellInput(el) {
    var index = Number(el.getAttribute("data-index"));
    var key = el.getAttribute("data-key");
    var tab = TAB_BY_ID[state.tab];
    var row = (state.data[tab.id] || [])[index];
    if (!row) return;
    var col = (tab.columns || []).filter(function (c) { return c.key === key; })[0] || {};
    var v = el.value;
    row[key] = col.type === "number" ? (v === "" ? "" : Number(v)) : v;

    // 即时校验：只更新本行样式与状态栏，避免输入时整表重绘导致失焦
    var errs = validateRow(tab, row);
    el.classList.toggle("is-bad", !!errs[key]);
    if (errs[key]) el.title = errs[key]; else el.removeAttribute("title");
    renderStatusBar();
    renderTabs();
  }

  /* ===========================================================================
     13. 批量操作
     =========================================================================== */
  function applyBatch() {
    var tab = TAB_BY_ID[state.tab];
    var a = state.batchAction;
    var rows = state.selected.map(function (i) { return (state.data[tab.id] || [])[i]; }).filter(Boolean);
    if (!rows.length) { toast("warn", "没有选中行", "先勾选要改的行"); return; }

    if (a === "price") {
      var mult = Number(state.batchValue);
      if (!isFinite(mult) || mult <= 0) { toast("err", "倍数不合法", "填一个大于 0 的数字"); return; }
      var field = state.batchField || "value";
      var n = 0;
      rows.forEach(function (r) {
        if (r[field] !== undefined) { r[field] = Math.round(Number(r[field]) * mult * 100) / 100; n++; }
      });
      toast("ok", "已应用", n + " 行的 " + field + " ×" + mult);
    } else if (a === "rarity") {
      rows.forEach(function (r) { r.rarity = state.batchValue; });
      toast("ok", "已应用", rows.length + " 行改为 " + state.batchValue);
    } else if (a === "dist") {
      var dist = String(state.batchValue || "").trim();
      if (!dist) { toast("err", "分布不能为空", "例如 lake:1.0,sea:0.6"); return; }
      rows.forEach(function (r) { r.dist = dist; });
      toast("ok", "已应用", rows.length + " 行分布改为 " + dist);
    } else if (a === "delete") {
      var idx = state.selected.slice().sort(function (x, y) { return y - x; });
      idx.forEach(function (i) { (state.data[tab.id] || []).splice(i, 1); });
      toast("ok", "已删除", idx.length + " 行（保存后生效）");
      state.selected = [];
    }

    state.batchAction = null;
    state.batchValue = "";
    render();
  }

  /* ===========================================================================
     14. 存档动作
     =========================================================================== */

  /** 存档卡片上的「下载」：先把这份存档的想法说清楚，别让人以为拿到了数据。 */
  function downloadSnapshot(s) {
    var payload = {
      kind: s.kind, kind_name: s.kind_name, note: s.note, time: s.time,
      players: s.players, size: s.size, file: s.name || s.rel,
      note_text: ENV.online
        ? "这是页面上的存档信息，不是玩家数据本体；要拿完整数据请到" +
          "「插件配置 → 导出存档文件」下载，或直接取 backups/ 目录里的同名文件。"
        : "离线预览数据，仅用于看排版。"
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "snapshot_" + String(s.name || s.time || "").replace(/[^\w.-]/g, "_") + ".info.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("ok", "已开始下载", s.note || s.name || s.time || "");
  }

  async function snapshotAction(kind, i) {
    var s = state.snapshots[i];
    if (!s) return;

    if (kind === "download") {
      downloadSnapshot(s);
      return;
    }

    var res = await runSnapshotAction(kind, {
      name: s.name || s.rel || "",
      id: s.name || s.rel || "",
      note: s.note
    });
    if (res.ok) {
      toast("ok", "已提交", res.message || "");
    } else {
      toast("warn", kind === "restore" ? "恢复未执行" : kind === "delete" ? "删除未执行" : "操作未执行", res.message || "");
    }
    state.pendingConfirm = null;
    render();
  }

  /* ===========================================================================
     15. 保存 / 导出 / 导入 / 重新载入
     =========================================================================== */
  function buildPayload() {
    var payload = {};
    TABS.forEach(function (t) {
      if (t.kind === "snapshots") return;
      payload[t.id] = state.data[t.id] || [];
    });
    payload.autoBackup = state.autoBackup;
    return payload;
  }

  function markSaved() {
    TABS.forEach(function (t) {
      if (t.kind === "snapshots") return;
      var map = {};
      (state.data[t.id] || []).forEach(function (row) {
        var k = rowKey(t, row);
        if (k) map[k] = JSON.stringify(row);
      });
      state.originals[t.id] = map;
    });
    state.autoBackupDirty = false;
    state.savedAt = nowText();
  }

  async function doSave() {
    var badTabs = TABS.filter(function (t) { return t.columns && tabHasError(t.id); })
      .map(function (t) { return t.title; });
    if (badTabs.length) {
      toast("err", "有内容没填对", badTabs.join("、") + " 里有标红的单元格，先改好再保存");
      return;
    }
    var btn = document.getElementById("btnSave");
    btn.disabled = true;
    btn.textContent = "⏳ 保存中…";
    try {
      var res = await saveConfig(buildPayload());
      if (res && res.ok) {
        markSaved();
        toast("ok", "已保存并生效", res.message || "配置已写入插件");
      } else {
        toast("warn", "没有真正写入", (res && res.message) || "保存通道未接入");
      }
    } catch (e) {
      toast("err", "保存失败", String(e && e.message || e));
    } finally {
      btn.disabled = false;
      btn.innerHTML = "💾 保存并生效";
      render();
    }
  }

  function doExport() {
    var blob = new Blob([JSON.stringify(buildPayload(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fishing_data_" + nowText().replace(/[^\d]/g, "") + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("ok", "已导出", "文件已开始下载");
  }

  function doImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(String(reader.result));
        var n = 0;
        TABS.forEach(function (t) {
          if (t.kind === "snapshots") return;
          if (Array.isArray(obj[t.id])) { state.data[t.id] = obj[t.id]; n++; }
        });
        if (obj.autoBackup) { state.autoBackup = obj.autoBackup; state.autoBackupDirty = true; }
        if (!n) { toast("err", "文件里没有可用数据", "至少要有 fish / locations 等数组字段"); return; }
        state.selected = [];
        toast("ok", "已导入", n + " 张表被替换，记得点保存");
        render();
      } catch (e) {
        toast("err", "JSON 解析失败", String(e && e.message || e));
      }
    };
    reader.readAsText(file);
  }

  async function reloadAll(silent) {
    state.loading = true;
    state.selected = [];
    state.editing = null;
    state.pendingConfirm = null;
    state.query = "";
    state.filter = "";
    state.sort = "default";
    state.loadError = "";
    state.loadNotes = [];
    skipped = {};
    render();

    var cfg = null;
    try {
      cfg = await loadConfig();
    } catch (e) {
      // 读配置失败：不白屏，把原因写在页面上，并退回演示数据让界面还能用
      state.loadError = String((e && e.message) || e);
      cfg = deepClone(DEMO.config);
    }
    TABS.forEach(function (t) {
      if (t.kind === "snapshots") return;
      state.data[t.id] = deepClone(cfg[t.id] || []);
    });
    if (cfg.autoBackup) state.autoBackup = deepClone(cfg.autoBackup);
    state.loadNotes = (cfg._notes || []).slice();

    var snaps = null;
    try {
      snaps = await loadSnapshots();
    } catch (e) {
      state.loadError = state.loadError || String((e && e.message) || e);
      snaps = { snapshots: [], autoBackup: null };
    }
    state.snapshots = deepClone((snaps && snaps.snapshots) || []);
    if (snaps && snaps.autoBackup) state.autoBackup = deepClone(snaps.autoBackup);
    state.players = snaps ? snaps.players : undefined;
    state.nextAutoBackup = snaps ? snaps.nextAutoBackup : "";

    markSaved();
    state.savedAt = null;
    state.loading = false;
    render();

    if (state.loadError) {
      toast("err", ENV.online ? "读取插件配置失败" : "离线预览模式", state.loadError);
      return;
    }
    if (!silent) {
      toast(
        "info",
        ENV.online ? "已重新载入" : "离线预览模式",
        ENV.online
          ? "已丢弃未保存的修改" + (state.loadNotes.length ? "；注意：" + state.loadNotes[0] : "")
          : "检测不到 AstrBot 桥接：用内置演示数据渲染，保存不会真正生效"
      );
    } else if (ENV.online && state.loadNotes.length) {
      toast("warn", "有内容没解析出来", state.loadNotes[0]);
    }
  }

  /* ===========================================================================
     16. 事件绑定（全部走委托，重绘不会丢监听）
     =========================================================================== */
  function switchTab(id) {
    if (id === state.tab) return;
    var prev = TAB_BY_ID[state.tab];
    if (prev && prev.columns && diffTab(prev.id).count) {
      toast("info", "切到「" + TAB_BY_ID[id].title + "」", "「" + prev.title + "」还有未保存的修改，别忘了保存");
    }
    state.tab = id;
    state.selected = [];
    state.editing = null;
    state.pendingConfirm = null;
    state.batchAction = null;
    state.query = "";
    state.filter = "";
    state.sort = "default";
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* file:// 下可能受限，忽略 */ }
    render();
  }

  document.addEventListener("click", function (ev) {
    var target = ev.target;
    if (!target || typeof target.closest !== "function") return;
    var el = target.closest("[data-act]");
    if (!el) {
      // 点空白处：退出行内编辑（值已经实时写入，这里只是收起输入框）
      if (state.editing && state.editing.scope === "cell" && !target.closest(".cell-input")) commitEdit();
      return;
    }
    var act = el.getAttribute("data-act");
    var index = Number(el.getAttribute("data-index"));
    var key = el.getAttribute("data-key");
    var tab = TAB_BY_ID[state.tab];

    switch (act) {
      case "tab": switchTab(el.getAttribute("data-tab")); break;

      case "edit": startEdit(index, key); break;
      case "cell": break; // 输入框自身

      case "row:select": {
        ev.stopPropagation();
        var at = state.selected.indexOf(index);
        if (at >= 0) state.selected.splice(at, 1); else state.selected.push(index);
        render();
        break;
      }
      case "selectAll": {
        var list = visibleRows(tab);
        var allSelected = list.length > 0 && list.every(function (it) { return state.selected.indexOf(it.index) >= 0; });
        state.selected = allSelected ? [] : list.map(function (it) { return it.index; });
        render();
        break;
      }
      case "row:add": {
        if (!tab.makeRow) break;
        state.data[tab.id].push(tab.makeRow());
        state.selected = [];
        toast("ok", "已新增一行", "改好后点保存生效");
        render();
        break;
      }
      case "row:copy": {
        var src = (state.data[tab.id] || [])[index];
        if (!src) break;
        var copy = deepClone(src);
        if (copy[tab.keyField || "id"]) copy[tab.keyField || "id"] = String(copy[tab.keyField || "id"]) + "_copy";
        (state.data[tab.id] || []).splice(index + 1, 0, copy);
        toast("ok", "已复制", "新行的 id 加了 _copy 后缀，记得改掉");
        render();
        break;
      }
      case "row:del":
        state.pendingConfirm = { scope: "row", index: index, action: "delete" };
        render();
        break;
      case "row:delYes":
        (state.data[tab.id] || []).splice(index, 1);
        state.pendingConfirm = null;
        state.selected = [];
        toast("ok", "已删除该行", "保存后生效");
        render();
        break;
      case "confirm:cancel":
        state.pendingConfirm = null;
        render();
        break;

      case "batch:price":
        state.batchAction = "price"; state.batchValue = "1.2"; state.batchField = (tab.columns.filter(function (c) { return c.valueKey; })[0] || {}).key || "value";
        render();
        break;
      case "batch:rarity": state.batchAction = "rarity"; state.batchValue = "常见"; render(); break;
      case "batch:dist": state.batchAction = "dist"; state.batchValue = "novice:1.0"; render(); break;
      case "batch:delete": state.batchAction = "delete"; render(); break;
      case "batch:apply": applyBatch(); break;
      case "batch:cancel": state.batchAction = null; render(); break;

      case "snapNote:edit": startEdit(index, null, "snapNote"); break;
      case "snap:new": {
        var noteEl = document.getElementById("newSnapNote");
        var note = noteEl ? noteEl.value.trim() : "";
        runSnapshotAction("create", { note: note }).then(function (res) {
          if (res.ok) {
            toast("ok", "已提交新建存档", res.message || (note || "手动存档"));
            if (noteEl) noteEl.value = "";
            refreshSnapshots();
          } else {
            toast("warn", "未真正创建", res.message || "");
            render();
          }
        });
        break;
      }
      case "snap:reload": refreshSnapshots(true); break;
      case "snap:restore": state.pendingConfirm = { scope: "card", index: index, action: "restore" }; render(); break;
      case "snap:restoreYes": snapshotAction("restore", index); break;
      case "snap:delete": state.pendingConfirm = { scope: "card", index: index, action: "delete" }; render(); break;
      case "snap:delYes": snapshotAction("delete", index); break;
      case "snap:download": snapshotAction("download", index); break;
    }
  });

  /** 重新拉一次存档列表（新建/删除/改名之后保证显示的是真实状态）。 */
  async function refreshSnapshots(showToast) {
    try {
      var snaps = await loadSnapshots();
      state.snapshots = deepClone((snaps && snaps.snapshots) || []);
      if (snaps && snaps.autoBackup) state.autoBackup = deepClone(snaps.autoBackup);
      state.players = snaps ? snaps.players : state.players;
      state.nextAutoBackup = snaps ? snaps.nextAutoBackup : state.nextAutoBackup;
      if (showToast) toast("info", "已刷新存档列表", "共 " + state.snapshots.length + " 份");
    } catch (e) {
      if (showToast) toast("err", "刷新失败", String((e && e.message) || e));
    }
    render();
  }

  // 输入事件（行内编辑、批量参数、存档改名、自动备份表单）
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;

    if (el.classList && el.classList.contains("cell-input") && el.getAttribute("data-act") === "cell") {
      onCellInput(el);
      return;
    }
    var act = el.getAttribute("data-act");
    if (act === "batchValue") { state.batchValue = el.value; return; }
    if (act === "snapNote:input") {
      var s = state.snapshots[Number(el.getAttribute("data-index"))];
      if (s) s.note = el.value;
      return;
    }
    if (act === "batchField") { state.batchField = el.value; return; }
    if (act && act.indexOf("auto:") === 0) {
      var field = act.split(":")[1];
      state.autoBackup[field] = el.type === "checkbox" ? el.checked : Number(el.value);
      state.autoBackupDirty = true;
      renderStatusBar();
      renderTabs();
    }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    var act = el.getAttribute && el.getAttribute("data-act");
    if (!act) return;
    if (act === "filter") { state.filter = el.value; state.selected = []; render(); }
    else if (act === "sort") { state.sort = el.value; render(); }
    else if (act === "auto:enable") {
      state.autoBackup.enable = el.checked;
      state.autoBackupDirty = true;
      render();
    }
  });

  // 搜索框（用 input 事件，但它是动态渲染的，单独委托）
  document.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "searchBox") {
      state.query = ev.target.value;
      var panel = document.getElementById("panel");
      var tab = TAB_BY_ID[state.tab];
      if (tab.columns) {
        // 只重绘表格部分，保持搜索框焦点
        var wrap = panel.querySelector(".table-wrap");
        var foot = panel.querySelector(".table-foot");
        var list = visibleRows(tab);
        if (wrap) wrap.innerHTML = '<table class="grid"><thead>' +
          panel.querySelector("table.grid thead").innerHTML + "</thead><tbody>" +
          renderTableBody(tab, list) + "</tbody></table>";
        if (foot) foot.innerHTML = '<button class="btn btn-sm" data-act="row:add"' + (tab.makeRow ? "" : " disabled") + ">＋ 新增一行</button>" +
          '<span class="hint faint">' + (tab.makeRow ? "新行会加在表格末尾" : "此页为只读说明列，仅「当前值」可改") + "</span>" +
          '<span class="spacer"></span><span class="hint faint">筛出 ' + list.length + " 条</span>";
        var chip = panel.querySelector(".stat-chip");
        if (chip) chip.innerHTML = "共 <b>" + (state.data[tab.id] || []).length + "</b> 条（筛出 <b>" + list.length + "</b>）";
      }
    }
  });

  // 行内编辑键盘：Enter 提交、Esc 取消、Tab 跳下一个单元格
  document.addEventListener("keydown", function (ev) {
    var el = ev.target;
    if (el && el.classList && el.classList.contains("cell-input")) {
      if (ev.key === "Enter") { ev.preventDefault(); commitEdit(); return; }
      if (ev.key === "Escape") { ev.preventDefault(); cancelEdit(); return; }
      if (ev.key === "Tab" && state.editing && state.editing.scope === "cell") {
        ev.preventDefault();
        var tab2 = TAB_BY_ID[state.tab];
        var cols = (tab2.columns || []).filter(function (c) { return c.type !== "readonly"; });
        var keys = cols.map(function (c) { return c.key; });
        var at = keys.indexOf(state.editing.key);
        var nextIndex = state.editing.index;
        var nextKey = keys[(at + (ev.shiftKey ? -1 : 1) + keys.length) % keys.length];
        commitEdit();
        startEdit(nextIndex, nextKey);
        return;
      }
      return;
    }
    if (ev.target && ev.target.id === "snapNote:input" && ev.key === "Enter") { commitEdit(); return; }

    // 全局快捷键
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "s" || ev.key === "S")) {
      ev.preventDefault();
      doSave();
      return;
    }
    if (ev.key === "Escape") {
      if (state.batchAction) { state.batchAction = null; render(); return; }
      if (state.pendingConfirm) { state.pendingConfirm = null; render(); return; }
      if (state.editing) { cancelEdit(); return; }
    }
    if (ev.key === "/" && !ev.ctrlKey && !ev.metaKey) {
      var box = document.getElementById("searchBox");
      if (box && document.activeElement !== box) { ev.preventDefault(); box.focus(); box.select(); }
    }
  });

  // 顶部按钮
  document.getElementById("btnSave").addEventListener("click", doSave);
  document.getElementById("btnReload").addEventListener("click", function () {
    if (dirtyTotal() > 0 && !state.pendingConfirm) {
      state.pendingConfirm = { scope: "global", action: "reload" };
      toast("warn", "有未保存的修改", "再点一次「重新载入」会丢弃它们");
      setTimeout(function () { state.pendingConfirm = null; }, 3000);
      return;
    }
    state.pendingConfirm = null;
    reloadAll();
  });
  document.getElementById("btnExport").addEventListener("click", doExport);
  document.getElementById("btnImport").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (f) doImportFile(f);
    ev.target.value = "";
  });

  window.addEventListener("beforeunload", function (ev) {
    if (dirtyTotal() > 0) {
      ev.preventDefault();
      ev.returnValue = "";
      return "";
    }
  });

  // AstrBot 会推送主题变化等上下文（上下文是异步来的，这里同时负责「迟到补写」）
  if (sdk && typeof sdk.onContext === "function") {
    try {
      sdk.onContext(function (next) {
        if (next && next.isDark !== undefined && next.isDark !== ENV.isDark) {
          applyTheme(next.isDark);
        }
        mergeContext(next);
        paintIdentity();
        render();
      });
    } catch (e) { /* 忽略：老版本 SDK 没有 onContext */ }
  }

  /* ===========================================================================
     17. 启动
     =========================================================================== */
  async function boot() {
    // 等 SDK 把上下文灌进来，再决定用哪个 pluginName 去读配置
    await waitForContext();
    mergeContext(readContext());
    ENV.online = !!sdk;
    paintIdentity();
    try {
      await reloadAll(true);
    } catch (e) {
      // reloadAll 自己已经兜住大部分错误，这里只处理意料之外的
      state.loading = false;
      state.loadError = String((e && e.message) || e);
      render();
      toast("err", "载入失败", state.loadError);
    }
    if (!ENV.online) {
      toast(
        "warn",
        "离线预览：不会真正保存",
        "检测不到 AstrBotPluginPage（桥接 SDK），当前用内置演示数据渲染；" +
        "保存与存档动作只会提示、不会真正执行。"
      );
      return;
    }
    toast("info", "已连接 AstrBot", "保存会直接写回插件配置（同步生效）");
  }

  boot();
})();
</script>
</body>
</html>
