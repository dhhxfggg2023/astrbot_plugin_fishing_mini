      readonly: false,          // 端点半读不到时退回「config 里的 button_defs 只读展示」
      source: "",               // demo / plugin-api / config
      groups: [],               // [{id,label,desc,scenes:[...]}]
      scenes: [],               // 拍平后的场景列表（卡片与总览都按这个顺序）
      perRowDefault: 3,         // 插件给的全局「每行几个」
      perRowMax: 5,             // 插件给的一行上限（buttons_per_row_max）
      buttonStyles: [],         // [{value,label}] 样式下拉的选项（全局属性）
      defaultStyle: "default",  // 新加按钮用的默认样式，也是插件端的兜底样式
      styleModes: [],           // [{value,label}] 样式策略选项（按按钮表 / 统一）
      styleMode: "按按钮表",    // 当前策略（全局属性，保存进配置）
      styleCfgTouched: false,   // 全局样式设置改了还没保存
      emptyScenes: "",          // 「明确不要按钮」的场景（逗号分隔，配置里的原文）
      emptyScenesDraft: "",     // 上面那项的草稿
      originalStyle: { mode: "按按钮表", style: "default", empty: "" },  // 已保存的样式设置
      view: "cards",            // cards = 场景卡片 / overview = 按钮总览
      focus: "",                // 当前聚焦的场景（预览面板跟着它）
      previewOpen: true,        // 预览面板是否展开（常驻 + 可折叠）
      chatMode: "group",        // 预览的群聊 / 单聊
      query: "",                // 卡片视图的搜索词（154 个场景不筛一下没法用）
      collapsed: {},            // 分组 id -> true（收起）
      drafts: {},               // 场景 id -> { text, buttons, perRow, textTouched, buttonsTouched, layoutTouched }
      picker: "",               // 「＋ 加按钮」选择器开在哪个场景上（空 = 都没开，v1.18.16）
      newBtn: null,             // 选择器的草稿 { label, data, style, labelMode, dataMode }
      sel: {},                  // 按钮总览里勾选的行（key = 场景#序号）
      batch: null,              // 总览里的批量操作：style / prefix / delete
      batchValue: "",
      layoutAllDraft: "",       // 全局每行几个的草稿
      layoutAllTouched: false,
      original: { button_defs: "", text_overrides: "", button_layout: "" },
      originalLines: [],        // 原始 button_defs 的行（合并时原样保留）
      originalOverrides: {},    // 原始 text_overrides（解析后）
      originalLayout: {},       // 原始 button_layout（解析后）
      sceneRow: {}              // 插件给每个场景的 per_row（只用于显示兜底，不写回配置）
    }
  };

  /* ===========================================================================
     6. 小工具
     =========================================================================== */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function deepClone(v) { return JSON.parse(JSON.stringify(v)); }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmtNum(v) {
    var n = Number(v);
    if (!isFinite(n)) return String(v);
    if (Math.abs(n) >= 1000) return n.toLocaleString("zh-CN");
    return String(n);
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function nowText() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /**
   * 弹提示。``action`` 可选：``{label, fn}`` —— 给「去看第一处」这类跳转留个按钮；
   * 带动作的提示不自动消失（点掉或点按钮才走），免得站长还没看清就没了。
   */
  function toast(kind, title, text, action) {
    var box = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast " + (kind || "info") + (action ? " has-act" : "");
    var icon = { ok: "✅", warn: "⚠️", err: "⛔", info: "ℹ️" }[kind || "info"] || "ℹ️";
    el.innerHTML =
      '<span class="toast-icon">' + icon + "</span>" +
      '<div class="toast-body"><div class="toast-title">' + esc(title) + "</div>" +
      (text ? '<div class="toast-text">' + esc(text) + "</div>" : "") +
      (action ? '<button class="btn btn-sm toast-act" type="button">' + esc(action.label) + "</button>" : "") +
      "</div>";
    box.appendChild(el);
    if (action) {
      var act = el.querySelector(".toast-act");
      if (act && act.addEventListener) {
        act.addEventListener("click", function () {
          el.remove();
          action.fn();
        });
      }
    }
    setTimeout(function () {
      el.classList.add("is-out");
      setTimeout(function () { el.remove(); }, 220);
    }, action ? 9000 : 2500);
  }

  /* 把分布字符串解析成标签数组： "lake:1.0,*:0.15" → [{loc,weight,star,bad}] */
  function parseDist(raw, knownLocs) {
    var out = [];
    String(raw || "").split(",").forEach(function (piece) {
      var p = piece.trim();
      if (!p) return;
      var idx = p.lastIndexOf(":");
      var loc = idx >= 0 ? p.slice(0, idx).trim() : p;
      var wRaw = idx >= 0 ? p.slice(idx + 1).trim() : "";
      var w = wRaw === "" ? 1 : Number(wRaw);
      var star = loc === "*";
      var bad = !star && knownLocs.indexOf(loc) < 0;
      out.push({ loc: loc, weight: isFinite(w) ? w : 0, star: star, bad: bad, badWeight: wRaw !== "" && !isFinite(w) });
    });
    return out;
  }

  /** 当前标签下所有已知钓点 id + 名称（用于分布与需要鱼竿的校验） */
  function knownLocationKeys() {
    var rows = state.data.locations || [];
    var list = [];
    rows.forEach(function (r) {
      if (r.id) list.push(String(r.id));
      if (r.name) list.push(String(r.name));
    });
    return list;
  }

  function rowKey(tab, row) {
    // 有的表（按钮）没有天然唯一的 id，就按「场景+文案+指令」组合成键
    var fields = tab.keyFields || [tab.keyField || "id"];
    var parts = [];
    for (var i = 0; i < fields.length; i++) {
      parts.push(String((row && row[fields[i]]) || ""));
    }
    return parts.join(KEY_SEP);
  }


  /* 计算某个标签页的改动情况：{ dirtyRows:Set<index>, added, removed, total } */
  function diffTab(tabId) {
    var tab = TAB_BY_ID[tabId];
    var rows = state.data[tabId] || [];
    var orig = state.originals[tabId] || {};
    var dirty = {};
    var seen = {};
    var added = 0;
    var changed = 0;

    rows.forEach(function (row, i) {
      var k = rowKey(tab, row);
      seen[k] = true;
      if (!k || !(k in orig)) { dirty[i] = true; added++; return; }
      if (JSON.stringify(row) !== orig[k]) { dirty[i] = true; changed++; }
    });

    var removed = 0;
    Object.keys(orig).forEach(function (k) { if (!seen[k]) removed++; });

    return { dirty: dirty, added: added, changed: changed, removed: removed, total: rows.length,
             count: added + changed + removed };
  }

  function dirtyTotal() {
    var n = 0;
    TABS.forEach(function (t) {
      if (t.kind) return;   // 存档页 / 玩家页不是「表格类」标签，不参与未保存统计
      n += diffTab(t.id).count;
    });
    n += replyDirtyCount();  // 💬 回复页的草稿（文案 / 按钮 / 每行几个）
    return n;
  }

  /* 校验一行，返回 { key: "错误说明" } */
  function validateRow(tab, row) {
    var errs = {};
    // 入口行（在别的页改 / 插件面板只读）没有可填的值，不参与校验
    if (row && (row.entry || row.writable === false)) return errs;
    var locs = knownLocationKeys();
    var rodIds = (state.data.rods || []).map(function (r) { return String(r.id); });

    (tab.columns || []).forEach(function (col) {
      var v = row[col.key];

      if (col.type === "number" && !row.text) {
        var missing = v === "" || v === null || v === undefined;
        // 可省略的列（老行没有这一段）：插件那边省略 = 用默认值，所以不算错
        if (missing && !col.optional) {
          errs[col.key] = "需要是数字";
        } else if (!missing && !isFinite(Number(v))) {
          errs[col.key] = "需要是数字";
        }
      }

      if (col.key === "rarity" && RARITIES.indexOf(String(v)) < 0) {
        errs[col.key] = "只能是：" + RARITIES.join(" / ");
      }

      if (col.type === "dist") {
        var parts = parseDist(v, locs);
        if (!parts.length) errs[col.key] = "至少写一个钓点，例如 lake:1.0";
        else if (parts.some(function (p) { return p.bad; })) errs[col.key] = "有钓点不存在";
        else if (parts.some(function (p) { return p.badWeight; })) errs[col.key] = "权重需要是数字";
      }

      if (tab.id === "fish" && col.key === "id" && !String(v || "").trim()) {
        errs[col.key] = "id 不能为空";
      }

      if (tab.id === "baits" && col.key === "required_rod" && String(v || "").trim()) {
        if (rodIds.indexOf(String(v).trim()) < 0) errs[col.key] = "鱼竿 id 不存在";
      }

      // 咬钩率（外挂列）：留空 = 不动这一项；填了就要是 0~1 或 1~100 的百分数
      if (tab.id === "baits" && col.key === "hook") {
        var hv = String(v === null || v === undefined ? "" : v).trim();
        if (hv) {
          var hn = Number(hv);
          if (!isFinite(hn)) errs[col.key] = "需要是数字（0.7 或 70）";
          else if (hn < 0 || hn > 100) errs[col.key] = "只能是 0~1 或 1~100（百分数）";
        }
      }

      if (tab.id === "buttons") {
        var raw = String(v === undefined || v === null ? "" : v).trim();
        if (col.key === "scene") {
          // 场景表拿到才校验；场景写错插件会静默跳过这排按钮，所以这里值得报，但用词要说清原因
          var ids = buttonSceneIds();
          if (ids && ids.indexOf(raw.toLowerCase()) < 0) {
            errs[col.key] = "插件没有这个场景（当前可选 " + ids.length + " 个，去「💬 回复」页挑）";
          }
        }
        if (col.key === "label" && !raw) {
          errs[col.key] = "按钮文案不能为空";
        }
        if (col.key === "data" && (!raw || raw.indexOf("/钓鱼") !== 0)) {
          errs[col.key] = "要写本插件指令，例如 /钓鱼 背包";
        }
        if (col.key === "style" && !isButtonStyle(raw)) {
          errs[col.key] = "写 default / primary，或 0-255 的数字";
        }
      }

      /* 命令别名：目标必须是插件认识的规范子命令（写错会被插件跳过） */
      if (tab.id === "aliases") {
        var ali = String(v === undefined || v === null ? "" : v).trim();
        if (col.key === "canonical" && canonicalCommands().indexOf(ali) < 0) {
          errs[col.key] = "只能是：" + canonicalCommands().join(" / ");
        }
        if (col.key === "aliases" && !ali) {
          errs[col.key] = "至少要写一个别名，例如 仓库,行囊";
        }
        if (col.key === "aliases" && /[|\r\n]/.test(ali)) {
          errs[col.key] = "别名里不能出现竖线（它是字段分隔符）";
        }
      }

      /* 道具：效果串只认 _parse_effects 里的键，写错的键插件会直接忽略（不报错，静默失效） */
      if (tab.id === "items" && col.key === "effects") {
        var rawEff = String(v === undefined || v === null ? "" : v).trim();
        var pairs = rawEff ? rawEff.split(";") : [];
        var badKeys = [];
        for (var pi = 0; pi < pairs.length; pi++) {
          var pair = pairs[pi].trim();
          if (!pair) continue;
          var eq = pair.indexOf("=");
          if (eq < 0) { errs[col.key] = "每一项都要写成 key=值，例如 meat=2"; break; }
          var ekey = pair.slice(0, eq).trim();
          var eval_ = pair.slice(eq + 1).trim();
          if (ITEM_EFFECT_KEY_NAMES.indexOf(ekey) < 0) badKeys.push(ekey);
          else if (eval_ === "" || !isFinite(Number(eval_))) {
            errs[col.key] = ekey + " 的值需要是数字";
            break;
          }
        }
        if (!errs[col.key] && badKeys.length) {
          errs[col.key] = "插件不认识的效果键：" + badKeys.join(" / ") + "（可用：" + ITEM_EFFECT_KEY_NAMES.join(" / ") + "）";
        }
      }

      /* 彩蛋：效果串只认 _parse_easter_egg_defs 的 4 个键（gold / luck / note / heal_bait），
         写错同样是静默失效（插件那边 `key in ("gold","luck")` 之外一律不认）。
         容错按解析器逐字对齐：
         * 分隔符除了 `;` 还认全角 `；`，等号除了 `=` 还认全角 `：`
         * 缺等号时 key = 整段、值 = 空 —— 这正是 `str.partition("=")` 的行为，
           所以 `note`（不带）也算开关打开，不该标红；而 `gold`（不带）插件会取 0，该标红
         * 数字型的值允许千分位逗号（`_defs_num` 会先剥掉） */
      if (tab.id === "easter_eggs" && col.key === "effects") {
        var rawEgg = String(v === undefined || v === null ? "" : v).trim();
        var eggBad = [];
        var eggPairs = rawEgg ? rawEgg.replace(/；/g, ";").split(";") : [];
        for (var gi = 0; gi < eggPairs.length; gi++) {
          var ep = eggPairs[gi].trim();
          if (!ep) continue;
          var norm = ep.replace(/：/g, "=");
          var gEq = norm.indexOf("=");
          var gKey = (gEq < 0 ? norm : norm.slice(0, gEq)).trim();
          var gVal = (gEq < 0 ? "" : norm.slice(gEq + 1)).trim();
          if (EGG_EFFECT_KEY_NAMES.indexOf(gKey) < 0) { eggBad.push(gKey); continue; }
          if (EGG_EFFECT_FLAG_KEYS.indexOf(gKey) >= 0) continue;   // 开关型：值不校验
          if (gVal === "" || !isFinite(Number(gVal.replace(/[,，]/g, "")))) {
            errs[col.key] = gKey + " 的值需要是数字";
            break;
          }
        }
        if (!errs[col.key] && eggBad.length) {
          errs[col.key] = "插件不认识的彩蛋效果键：" + eggBad.join(" / ") + "（可用：" + EGG_EFFECT_KEY_NAMES.join(" / ") + "）";
        }
      }

      /* 自定义命令：名字不能撞内置写法；动作只认 发送 / 执行 */
      if (tab.id === "custom") {
        var cus = String(v === undefined || v === null ? "" : v).trim();
        if (col.key === "name") {
          if (!cus) errs[col.key] = "命令名不能为空";
          else if (canonicalCommands().indexOf(cus) >= 0) {
            errs[col.key] = "和内置子命令重名（内置永远优先，这条不会生效）";
          } else if (/\s|\//.test(cus)) {
            errs[col.key] = "命令名不能有空格或斜杠";
          }
        }
        if (col.key === "action" && ["发送", "执行", "send", "run"].indexOf(cus.toLowerCase()) < 0) {
          errs[col.key] = "只能写 发送 或 执行";
        }
        if (col.key === "body" && !cus) {
          errs[col.key] = "内容不能为空";
        }
      }
    });

    return errs;
  }

  /**
   * 整表体检：这张表里**有没有**填错的行（不分是不是这次改的）。
   * 注意：v1.12.1 起 doSave 不再拿它当闸门了 —— 历史遗留的红格子不该拦新保存，
   * 保存只看 problemsInTab(id, true)（这次改过的行）。
   */
  function tabHasError(tabId) {
    var tab = TAB_BY_ID[tabId];
    if (!tab.columns) return false;
    var rows = state.data[tabId] || [];
    for (var i = 0; i < rows.length; i++) {
      if (Object.keys(validateRow(tab, rows[i])).length) return true;
    }
    return false;
  }

  /**
   * 某张表里填错的地方，每条 = {tabId,index,key,message}。
   * onlyDirty=true 时只看「这次真的改过」的行——历史遗留的红格子不该拦新保存。
   */
  function problemsInTab(tabId, onlyDirty) {
    var tab = TAB_BY_ID[tabId];
    if (!tab || !tab.columns) return [];
    var dirty = onlyDirty ? diffTab(tabId).dirty : null;
    var out = [];
    (state.data[tabId] || []).forEach(function (row, i) {
      if (dirty && !dirty[i]) return;
      var errs = validateRow(tab, row);
      Object.keys(errs).forEach(function (key) {
        out.push({ tabId: tabId, index: i, key: key, message: errs[key] });
      });
    });
    return out;
  }

  /** 把一处问题说成人话：「『回复按钮』第 13 行『cast.miss_none』的『场景』：……」 */
  function problemWhere(p) {
    var tab = TAB_BY_ID[p.tabId] || { title: p.tabId, columns: [] };
    var row = (state.data[p.tabId] || [])[p.index] || {};
    var name = rowKey(tab, row).split(KEY_SEP).filter(Boolean)[0] || "";
    var col = (tab.columns || []).filter(function (c) { return c.key === p.key; })[0] || {};
    return "「" + tab.title + "」第 " + (p.index + 1) + " 行" +
      (name ? "「" + name + "」" : "") + "的「" + (col.label || p.key) + "」：" + p.message;
  }

  /** 跳到出问题的那一格：切页 → 清掉搜索/筛选 → 展开输入框 → 滚动到眼前并选中 */
  function gotoProblem(p) {
    if (!p || !TAB_BY_ID[p.tabId]) return false;
    state.query = "";
    state.filter = "";
    state.sort = "default";
    state.selected = [];
    if (state.tab !== p.tabId) switchTab(p.tabId);   // switchTab 会清掉 editing，所以它先跑
    state.editing = { scope: "cell", index: p.index, key: p.key };
    render();
    setTimeout(function () {
      var el = $('[data-act="cell"][data-index="' + p.index + '"][data-key="' + p.key + '"]') ||
               $('[data-index="' + p.index + '"]');
      if (!el) return;
      if (el.scrollIntoView) el.scrollIntoView({ block: "center" });
      if (el.focus) el.focus();
      if (el.select) el.select();
    }, 50);
    return true;
  }
  /* ===========================================================================
     7. 过滤 / 排序
     =========================================================================== */
  function visibleRows(tab) {
    var rows = state.data[tab.id] || [];
    var q = state.query.trim().toLowerCase();
    var list = rows.map(function (row, index) { return { row: row, index: index }; });

    if (q) {
      list = list.filter(function (it) {
        return String(it.row.id || "").toLowerCase().indexOf(q) >= 0 ||
               String(it.row.key || "").toLowerCase().indexOf(q) >= 0 ||
               String(it.row.name || it.row.label || "").toLowerCase().indexOf(q) >= 0 ||
               String(it.row.desc || it.row.flavor || "").toLowerCase().indexOf(q) >= 0;
      });
    }

    if (state.filter && tab.filterKey) {
      list = list.filter(function (it) {
        return String(it.row[tab.filterKey]) === state.filter;
      });
    }

    var rarityRank = {};
    RARITIES.forEach(function (r, i) { rarityRank[r] = i; });

    var sorters = {
      name: function (a, b) { return String(a.row.name || "").localeCompare(String(b.row.name || ""), "zh-CN"); },
      valueAsc: function (a, b) { return numOf(a.row, tab) - numOf(b.row, tab); },
      valueDesc: function (a, b) { return numOf(b.row, tab) - numOf(a.row, tab); },
      weightDesc: function (a, b) { return Number(b.row.weight || 0) - Number(a.row.weight || 0); },
      multDesc: function (a, b) { return Number(b.row.value_mult || 0) - Number(a.row.value_mult || 0); },
      level: function (a, b) { return Number(a.row.level_gate || 0) - Number(b.row.level_gate || 0); },
      scene: function (a, b) { return String(a.row.scene || "").localeCompare(String(b.row.scene || ""), "zh-CN"); },
      labelAsc: function (a, b) { return String(a.row.label || "").localeCompare(String(b.row.label || ""), "zh-CN"); },
      rarity: function (a, b) { return (rarityRank[a.row.rarity] || 0) - (rarityRank[b.row.rarity] || 0); }
    };
    if (state.sort !== "default" && sorters[state.sort]) list.sort(sorters[state.sort]);

    return list;
  }

  function numOf(row, tab) {
    var col = (tab.columns || []).filter(function (c) { return c.valueKey; })[0];
    return Number(row[(col && col.key) || "value"] || 0);
  }

  /* ===========================================================================
     8. 渲染：标签页
     =========================================================================== */
  /**
   * 标签页健康度：``bad`` = 这次改过的行里有错（点保存会被拦），
   * ``stale`` = 没动过的行里的历史错误（只提醒、不拦）。一次 diffTab 通吃，别在渲染里
   * 反复调用（renderTabs 每敲一个字都会跑）。
   */
  function tabHealth(tabIds) {
    var out = { bad: 0, stale: 0 };
    (tabIds || []).forEach(function (id) {
      var tab = TAB_BY_ID[id];
      if (!tab || !tab.columns) return;
      var dirty = diffTab(id).dirty;
      (state.data[id] || []).forEach(function (row, i) {
        var n = Object.keys(validateRow(tab, row)).length;
        if (!n) return;
        if (dirty[i]) out.bad += n; else out.stale += n;
      });
    });
    return out;
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    /* 同一个 navGroup（例：命令别名 / 自定义命令）合并成一个入口按钮：
       点它进第一张表，两张表在标签页内部用「小切换条」来回切。 */
    var groups = [];
    var byGroup = {};
    TABS.forEach(function (t) {
      var gid = t.navGroup || t.id;
      if (!byGroup[gid]) {
        byGroup[gid] = { id: gid, tabs: [], label: t.label, title: t.title };
        groups.push(byGroup[gid]);
      }
      byGroup[gid].tabs.push(t);
    });

    var html = groups.map(function (g) {
      var d = { count: 0 };
      var n = 0;
      if (g.tabs.length > 1) {
        // 命令组：两张表合成一个入口，计数与未保存数都累加
        g.tabs.forEach(function (t) {
          var dd = diffTab(t.id);
          d.count += dd.count;
          n += dd.total;
        });
        g.label = g.tabs[0].label;                 // 「⌨️ 命令」
        g.title = g.tabs.map(function (t) { return t.title; }).join(" / ");
      } else {
        var t0 = g.tabs[0];
        if (t0.kind === "snapshots") { n = (state.snapshots || []).length; }
        else if (t0.kind === "players") { n = (state.playersList || []).length; }
        else if (t0.kind === "replies") { n = (state.replies.scenes || []).length; d = { count: replyDirtyCount() }; }
        else if (t0.kind === "keys") { n = configKeyCoverageNow().counts.total; }
        else { d = diffTab(t0.id); n = d.total; }
      }
      var activeId = g.tabs.length > 1 ? g.tabs[0].id : g.tabs[0].id;
      var isActive = g.tabs.some(function (t) { return state.tab === t.id; });
      var health = tabHealth(g.tabs.map(function (t) { return t.id; }));
      var badHtml = health.bad
        ? '<span class="tab-bad is-block" title="你改过的 ' + health.bad + ' 处填错了，点保存会被拦下">⛔</span>'
        : (health.stale
          ? '<span class="tab-bad is-stale" title="没动过的行里有 ' + health.stale + ' 处历史问题（不拦保存）">⚠</span>'
          : '<span class="tab-bad"></span>');
      return '<button class="tab' + (isActive ? " is-active" : "") + (d.count ? " has-dirty" : "") +
        '" role="tab" data-act="tab" data-tab="' + esc(activeId) + '" title="' + esc(g.title) + '">' +
        "<span>" + esc(g.label) + "</span>" +
        '<span class="tab-count">' + n + "</span>" +
        badHtml +
        '<span class="tab-dirty" title="这个标签有 ' + d.count + ' 处未保存的修改"></span>' +
        "</button>";
    }).join("");
    nav.innerHTML = html;
  }

  /* ===========================================================================
     9. 渲染：表格类标签页
     =========================================================================== */
  function renderToolbar(tab, list, d) {
    var html = '<div class="toolbar">';

    html += '<label class="field search"><span class="field-icon">🔍</span>' +
      '<input type="search" id="searchBox" placeholder="搜索名称或 id…" value="' + esc(state.query) + '" /></label>';

    if (tab.filterOptions) {
      html += '<label class="field"><span class="field-icon">🎚️</span><select data-act="filter">';
      html += '<option value="">' + esc(tab.filterLabel || "全部筛选") + "</option>";
      tab.filterOptions.forEach(function (opt) {
        var label = opt === "" ? "（无）" : opt;
        html += '<option value="' + esc(opt) + '"' + (state.filter === String(opt) ? " selected" : "") + ">" + esc(label) + "</option>";
      });
      html += "</select></label>";
    }

    if (tab.sortOptions) {
      html += '<label class="field"><span class="field-icon">↕️</span><select data-act="sort">';
      tab.sortOptions.forEach(function (pair) {
        html += '<option value="' + esc(pair[0]) + '"' + (state.sort === pair[0] ? " selected" : "") + ">" + esc(pair[1]) + "</option>";
      });
      html += "</select></label>";
    }

    html += '<span class="divider"></span>';
    html += '<span class="stat-chip">共 <b>' + d.total + "</b> 条" +
      (list.length !== d.total ? '（筛出 <b>' + list.length + "</b>）" : "") + "</span>";
    html += '<span class="stat-chip' + (d.count ? " is-dirty" : "") + '">已改 <b>' + d.count + "</b></span>";

    html += '<span class="spacer" style="margin-left:auto"></span>';

    var sel = state.selected.length;
    html += '<span class="stat-chip">已选 <b>' + sel + "</b></span>";
    html += '<button class="btn btn-sm" data-act="batch:price" ' + (sel ? "" : "disabled") + ">价格 ×倍数</button>";
    html += '<button class="btn btn-sm" data-act="batch:rarity" ' + (sel ? "" : "disabled") + ">改稀有度</button>";
    html += '<button class="btn btn-sm" data-act="batch:dist" ' + (sel ? "" : "disabled") + ">改钓点</button>";
    html += '<button class="btn btn-sm btn-danger" data-act="batch:delete" ' + (sel ? "" : "disabled") + ">批量删除</button>";

    html += "</div>";

    if (state.batchAction) html += renderBatchStrip(tab);
    return html;
  }

  function renderBatchStrip(tab) {
    var a = state.batchAction;
    var html = '<div class="toolbar" style="background:var(--primary-soft);border-bottom-color:var(--primary)">';
    if (a === "price") {
      html += "<span class='nowrap'>把选中行的<select class='cell-input mono' style='width:120px;display:inline-block' data-act='batchField'>" +
        ['value', 'price'].map(function (k) {
          return "<option value='" + k + "'" + (state.batchField === k ? " selected" : "") + ">" + (k === "value" ? "基准价/价值" : "价格") + "</option>";
        }).join("") +
        "</select> 乘以</span>" +
        "<input class='cell-input mono' style='width:90px' data-act='batchValue' value='" + esc(state.batchValue) + "' />";
    } else if (a === "rarity") {
      html += "<span class='nowrap'>把选中行的稀有度改成</span><select class='cell-input' style='width:120px' data-act='batchValue'>" +
        RARITIES.map(function (r) { return "<option value='" + r + "'" + (state.batchValue === r ? " selected" : "") + ">" + r + "</option>"; }).join("") +
        "</select>";
    } else if (a === "dist") {
      html += "<span class='nowrap'>把选中行的分布整体改成</span>" +
        "<input class='cell-input mono' style='width:240px' data-act='batchValue' placeholder='lake:1.0,sea:0.6' value='" + esc(state.batchValue) + "' />";
    } else if (a === "delete") {
      html += "<span class='nowrap'>确定删除选中的 <b>" + state.selected.length + "</b> 行？此操作不可撤销。</span>";
    }
    html += '<button class="btn btn-sm btn-primary" data-act="batch:apply">应用</button>';
    html += '<button class="btn btn-sm" data-act="batch:cancel">取消</button>';
    html += "</div>";
    return html;
  }

  /** 把「逗号分隔的长文本」拆成条目（空值/坏值都安全）。 */
  function splitListItems(text) {
    return String(text === undefined || text === null ? "" : text)
      .replace(/，/g, ",")
      .split(",")
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x !== ""; });
  }

  /* ===========================================================================
     数值页的「算给你看」：几个光看名字猜不出该填多少的数值，直接按当前值
     把结果算出来写在说明下面（含推荐值），省得站长瞎填。
     =========================================================================== */

  /** 取数值页某一行当前的输入值（含还没保存的改动）。 */
  function numberRowValue(key) {
    var row = (state.data.numbers || []).filter(function (r) { return r.key === key; })[0];
    if (!row) return NaN;
    var v = Number(row.value);
    return isFinite(v) ? v : NaN;
  }

  /** 和插件侧 _level_threshold() 同一套公式：base×(ratio^(L-1)−1)/(ratio−1) + growth×(L-1)² */
  function levelThresholdAt(level, base, ratio, growth) {
    var n = Math.max(0, Number(level) - 1);
    if (!(n > 0)) return 0;
    var geometric = Math.abs(ratio - 1) < 1e-9 ? base * n : base * (Math.pow(ratio, n) - 1) / (ratio - 1);
    return Math.round(geometric + growth * n * n);
  }

  var LEVEL_HINT_LEVELS = [10, 20, 30, 45];

  function levelCurveHint(row) {
    var base = numberRowValue("level_xp_base");
    var ratio = numberRowValue("level_xp_ratio");
    var growth = numberRowValue("level_xp_growth");
    if (!(base > 0) || !(ratio >= 1) || !(growth >= 0)) return "";
    var line = LEVEL_HINT_LEVELS.map(function (lv) {
      return lv + " 级 <b>" + fmtNum(levelThresholdAt(lv, base, ratio, growth)) + "</b> 条";
    }).join("　·　");
    var out = '<div class="num-hint">📈 当前这组数（base ' + base + " / ratio " + ratio +
      " / growth " + growth + "）算出来：升到 " + line + "</div>";
    if (row.key !== "level_xp_growth") return out;

    // 只有二次项这一项：把推荐值和「填了会变成多少」摆出来，别让人猜
    var cur30 = levelThresholdAt(30, base, ratio, growth);
    function tryGrowth(g) {
      return levelThresholdAt(30, base, ratio, g);
    }
    out += '<div class="num-hint">✅ 推荐：<b>0</b>（出厂值，纯指数曲线，平衡就是照它调的）；' +
      "想再卡一下后期就填 <b>0.5</b>（30 级 " + fmtNum(cur30) + " → <b>" + fmtNum(tryGrowth(0.5)) +
      "</b> 条）或 <b>2</b>（→ <b>" + fmtNum(tryGrowth(2)) + "</b> 条）；" +
      "填太大（比如 10 以上）前期也会变慢，容易劝退新人。</div>";
    out += '<div class="num-hint">🧮 它只加在<b>平方</b>那一项上：第 L 级多加 growth×(L−1)² 条 —— ' +
      "10 级 +" + fmtNum(Math.round(growth * 81)) + " 条、30 级 +" + fmtNum(Math.round(growth * 841)) +
      " 条；填 0 就是不启用。</div>";
    return out;
  }

  /** 数值页某一行的额外提示（没有就返回空串）。 */
  function numberLiveHint(row) {
    if (!row) return "";
    if (row.key === "level_xp_base" || row.key === "level_xp_ratio" || row.key === "level_xp_growth") {
      return levelCurveHint(row);
    }
    if (row.key === "quality_myth_chance" || row.key === "reroll_daily_limit") {
      return mythChanceHint(row);
    }
    return "";
  }

  /**
   * 洗髓丹那一组数值「算给你看」：一次重掷的概率 → 一颗丹 → 每天每条鱼 →
   * 攒到「大概率出一条神品」需要多少颗 / 多少天（站长最想知道的就是这个）。
   */
  function mythChanceHint(row) {
    var chance = numberRowValue("quality_myth_chance");
    var cap = numberRowValue("reroll_daily_limit");
    if (!(chance >= 0) || !(cap >= 0)) return "";
    var rolls = 3;                       // 一颗丹默认重掷 3 次（道具表里可改）
    var perPill = 1 - Math.pow(1 - chance, rolls);
    var perDay = cap > 0 ? 1 - Math.pow(1 - perPill, cap) : NaN;
    function pct(x) { return (x * 100).toFixed(x * 100 >= 10 ? 0 : 2) + "%"; }
    var out = '<div class="num-hint">🎲 一次重掷 <b>' + pct(chance) + "</b>　·　" +
      "一颗丹（重掷 " + rolls + " 次）<b>" + pct(perPill) + "</b>";
    if (cap > 0) {
      out += "　·　一条鱼一天吃满 " + cap + " 颗 <b>" + pct(perDay) + "</b>";
      var days = perDay > 0 ? Math.ceil(Math.log(0.5) / Math.log(1 - perDay)) : Infinity;
      var pills = perPill > 0 ? Math.ceil(Math.log(0.5) / Math.log(1 - perPill)) : Infinity;
      out += '<div class="num-hint">📅 期望值：大约 <b>' + fmtNum(pills) + "</b> 颗丹 / <b>" +
        (isFinite(days) ? fmtNum(days) : "∞") + "</b> 天（同一条鱼每天喂满）能有一半概率洗出一条神品" +
        (chance === 0 ? "　—— 现在是 0，永远洗不出神品" : "") + "</div>";
    } else {
      out += '<div class="num-hint">📅 现在「每日上限」是 0 = 不限；填个 3 就能看到「一天最多几颗、大概多久出一条神品」</div>';
    }
    return out;
  }

  /**
   * 数值页「当前值」列：**入口行**（在别的页面改 / 插件面板只读）不放输入框 ——
   * 给一个假的输入框比不给更糟：站长填了半天，保存时被插件白名单静静丢掉。
   */
  function numberEntryCellHtml(row) {
    var entry = toText(row.entry);
    if (entry.indexOf("tab:") === 0) {
      var tid = entry.slice(4);
      var tab = TAB_BY_ID[tid] || {};
      return '<button class="btn btn-sm btn-jump" data-act="num:jump" data-tab="' + esc(tid) +
        '" data-key="' + esc(row.key) + '" title="这个键在别的标签页里有可视化编辑，点一下跳过去">→ 到「' +
        esc(tab.label || tid) + "」页改</button>";
    }
    if (entry === "panel") {
      return '<span class="ro-value mono">' + esc(shortValueText(row.value)) + "</span>" +
        '<span class="ro-chip" title="' + esc(row.desc || "") + '">插件面板项 · 页面只读</span>';
    }
    // 入口写着「本页可改」，但插件这次没把它放进可写白名单：照样只读，并写清原因
    return '<span class="ro-value mono">' + esc(shortValueText(row.value)) + "</span>" +
      '<span class="ro-chip is-warn" title="' + esc(row.readonlyWhy || "") + '">只读</span>';
  }

  /** 只读展示用的短值（`editor_status` 这种几 KB 的 JSON 不能整段铺在表格里）。 */
  function shortValueText(v, max) {
    var s = toText(v);
    var top = Number(max) > 0 ? Number(max) : 90;
    if (s.length <= top) return s === "" ? "—" : s;
    return s.slice(0, top) + "…（共 " + s.length + " 字）";
  }

  function cellHtml(tab, col, row, index) {
    var v = row[col.key];
    var editing = state.editing && state.editing.index === index && state.editing.key === col.key;
    var errs = validateRow(tab, row);
    var bad = !!errs[col.key];
    var titleAttr = errs[col.key] ? ' title="' + esc(errs[col.key]) + '"' : "";
    // 文本行（例如「各钓点咬钩系数」16 个钓点、单条鱼改价）：值很长，
    // 一行摆不下就会把整张表撑出去，所以显示成可换行的小方块、编辑时用多行输入框
    var isTextRow = !!(row && row.text);
    var items = isTextRow ? splitListItems(v) : [];
    var longText = isTextRow && (items.length > 3 || String(v || "").length > 24);

    // 入口行（在别的标签页 / 插件面板里改的键）：当前值那一格换成跳转按钮或只读值
    if (col.key === "value" && row && row.entry) {
      return numberEntryCellHtml(row);
    }
    if (col.key === "value" && row && row.writable === false) {
      return numberEntryCellHtml(row);
    }

    if (editing && col.type !== "readonly") {
      // row.text = 这一行的值是**文本**（例如各钓点咬钩系数），别当数字处理
      var cellType = isTextRow ? "text" : col.type;
      var cls = "cell-input" + (col.mono || cellType === "number" || col.type === "dist" ? " mono" : "") + (bad ? " is-bad" : "");
      var common = ' data-act="cell" data-index="' + index + '" data-key="' + col.key + '"' + titleAttr;
      if (longText) {
        // 一行一条（插件侧逗号和换行都当分隔符），别让人在一行里数 16 个逗号
        var lines = items.length ? items.join("\n") : String(v === undefined || v === null ? "" : v);
        return '<textarea class="' + cls + ' is-multiline" rows="' + Math.min(10, Math.max(3, items.length || 3)) +
          '" spellcheck="false"' + common + ">" + esc(lines) + "</textarea>";
      }
      return '<input class="' + cls + '"' + common + ' type="' + (cellType === "number" ? "number" : "text") + '"' +
        (col.step !== undefined ? ' step="' + col.step + '"' : "") +
        ' value="' + esc(v === undefined || v === null ? "" : v) + '" />';
    }

    if (col.type === "readonly") {
      var roText = '<span class="' + (col.mono ? "mono faint" : "muted") + (col.key === "desc" ? " cut" : "") +
        (bad ? " cell-bad" : "") + '"' + titleAttr + ">" + esc(v) + "</span>";
      // 数值页的说明列：把「算给你看」的实时小提示接在下面
      if (col.key === "desc" && tab.id === "numbers") {
        roText += numberLiveHint(row);
      }
      return roText;
    }

    if (col.type === "rarity") {
      var cls2 = RARITY_CLASS[String(v)] || "rar-common";
      return '<span class="pill ' + cls2 + '" data-act="edit" data-index="' + index + '" data-key="' + col.key + '"' + titleAttr + ">" +
        esc(RARITY_EMOJI[String(v)] || "") + " " + esc(v) + "</span>";
    }

    if (col.type === "emoji") {
      return '<span class="cell-emoji" data-act="edit" data-index="' + index + '" data-key="' + col.key + '">' + esc(v || "·") + "</span>";
    }

    if (col.type === "dist") {
      var parts = parseDist(v, knownLocationKeys());
      var inner = parts.length
        ? parts.map(function (p) {
            var cls3 = "tag" + (p.star ? " is-star" : "") + (p.bad || p.badWeight ? " is-bad" : "");
            return '<span class="' + cls3 + '">' + esc(p.star ? "全部钓点" : p.loc) + " <b>" + esc(p.weight) + "</b></span>";
          }).join("")
        : '<span class="dist-empty">未配置</span>';
      return '<div class="dist' + (bad ? " cell-bad" : "") + '" data-act="edit" data-index="' + index + '" data-key="' + col.key + '"' + titleAttr + ">" + inner + "</div>";
    }

    if (longText) {
      // 长列表：换行铺开的小方块（点一下进编辑），不再是一行拉到底
      var shown = items.slice(0, 24);
      var chips = shown.map(function (x) {
        return '<span class="tag">' + esc(x) + "</span>";
      }).join("");
      if (items.length > shown.length) {
        chips += '<span class="tag is-more">…还有 ' + (items.length - shown.length) + " 项</span>";
      }
      return '<div class="kv-chips' + (bad ? " cell-bad" : "") + '" data-act="edit" data-index="' + index +
        '" data-key="' + col.key + '"' + titleAttr + ">" + chips + "</div>";
    }

    var text = (col.type === "number" && !isTextRow)
      ? fmtNum(v)
      : (v === undefined || v === null || v === "" ? "—" : String(v));
    var extra = col.pct && isFinite(Number(v)) ? ' <span class="faint">(' + (Number(v) * 100).toFixed(0) + "%)</span>" : "";
    return '<span data-act="edit" data-index="' + index + '" data-key="' + col.key + '" class="' +
      (col.mono ? "mono " : "") + (col.key === "desc" || col.key === "flavor" ? "cut " : "") + (bad ? "cell-bad" : "") + '"' + titleAttr + ">" +
      esc(text) + extra + "</span>";
  }

  function renderTableBody(tab, list) {
    if (!list.length) {
      return '<tr><td colspan="' + (tab.columns.length + 2) + '">' +
        '<div class="empty"><span class="empty-icon">🫧</span>' +
        '<div class="empty-title">这里还没有内容</div>' +
        '<div class="empty-sub">' + (state.query || state.filter ? "换个搜索词或清掉筛选试试" : "点下面的「＋ 新增一行」开始添加") + "</div>" +
        "</div></td></tr>";
    }

    // 数值页按「组」分节显示（组名来自 NUMBER_KEYS 第 6 位）：
    // 只在默认顺序下插分节标题 —— 按数值/名称排序时顺序被打乱，插标题反而看不懂
    var grouped = tab.id === "numbers" && state.sort === "default";
    var lastGroup = null;

    return list.map(function (it) {
      var row = it.row, index = it.index;
      var head = "";
      if (grouped) {
        var g = toText(row.group) || "其他";
        if (g !== lastGroup) {
          lastGroup = g;
          head = '<tr class="group-row"><td data-label="" colspan="' + (tab.columns.length + 2) + '">' +
            esc(g) + "</td></tr>";
        }
      }
      var errs = validateRow(tab, row);
      var invalid = Object.keys(errs).length > 0;
      var isSel = state.selected.indexOf(index) >= 0;
      var isDirty = !!(state.originals[tab.id] && (function () {
        var k = rowKey(tab, row);
        var o = state.originals[tab.id][k];
        return !o || o !== JSON.stringify(row);
      })());

      var tds = tab.columns.map(function (col) {
        var cls = [];
        var isEntry = !!(row.entry || row.writable === false);
        if ((col.num || col.type === "number") && !row.text && !isEntry) cls.push("num");
        if (col.key === "id" || col.key === "key") cls.push("id-cell");
        // 入口行（跳转 / 只读）：这一格是按钮或只读文本，让它自然换行
        if (col.key === "value" && isEntry) cls.push("entry-cell");
        // 长文本列（说明/风味）在卡片模式下占满一行，别挤在标签右边
        if (col.key === "desc" || col.key === "flavor" || col.key === "notice") cls.push("cell-wide");
        // data-label：窄窗口把表格拆成「一行一张卡」时，用它当每格的标签
        var labelAttr = ' data-label="' + esc(col.label) + '"';
        if (col.w) return '<td class="' + cls.join(" ") + '"' + labelAttr + ' style="width:' + col.w + '">' + cellHtml(tab, col, row, index) + "</td>";
        return '<td class="' + cls.join(" ") + '"' + labelAttr + ">" + cellHtml(tab, col, row, index) + "</td>";
      }).join("");

      var confirming = state.pendingConfirm && state.pendingConfirm.scope === "row" && state.pendingConfirm.index === index;
      var actions = confirming
        ? '<div class="confirm-strip"><span class="q">删除？</span>' +
          '<button class="btn btn-sm btn-danger" data-act="row:delYes" data-index="' + index + '">确认</button>' +
          '<button class="btn btn-sm" data-act="confirm:cancel">取消</button></div>'
        : '<button class="btn btn-sm btn-icon btn-ghost" data-act="row:copy" data-index="' + index + '" title="复制这一行">⧉</button>' +
          '<button class="btn btn-sm btn-icon btn-ghost" data-act="row:del" data-index="' + index + '" title="删除这一行">🗑</button>';

      return head + '<tr class="' + (isSel ? "is-selected " : "") + (isDirty ? "is-dirty " : "") + (invalid ? "is-invalid " : "") +
        (state.editing && state.editing.index === index ? "is-editing" : "") + '">' +
        '<td data-label="" style="width:34px"><input type="checkbox" data-act="row:select" data-index="' + index + '"' + (isSel ? " checked" : "") + " /></td>" +
        tds +
        '<td class="actions" data-label="操作">' + actions + "</td>" +
        "</tr>";
    }).join("");
  }

  function renderTableTab(tab) {
    var list = visibleRows(tab);
    var d = diffTab(tab.id);
    var html = '<section class="card">';

    html += '<div class="card-head"><h2>' + esc(tab.label) + " " + esc(tab.title) + "</h2>" +

      '<span class="spacer"></span>' +
      '<span class="hint">点单元格即可编辑 · Tab 跳到下一格 · 长列表（各钓点系数、品质权重这类）显示成小方块，点开是<b>一行一条</b>，回车换行、Ctrl+回车提交</span></div>';

    // 站长最烦「更新一次就要重改一遍配置」：这里明确告诉他哪些项已经归他了
    var keeps = (state.userEditedKeys || []);
    if (tab.id === "numbers" && keeps.length) {
      html += '<div class="notice"><span class="notice-icon">🔒</span><div>' +
        "你自己改过的 <b>" + keeps.length + "</b> 项不会被升级覆盖：" +
        '<span class="mono">' + esc(keeps.slice(0, 6).join("、")) +
        (keeps.length > 6 ? "…" : "") + "</span>" +
        '<div class="hint faint">新钓点、新品质档位这类「新增内容」仍会自动补进配置；' +
        "想让全部数值回到出厂值，就把「默认值同步」设成 all。</div></div></div>";
    }

    html += renderToolbar(tab, list, d);

    html += '<div class="table-wrap is-stack"><table class="grid stack' + (tab.wrapCells ? " wrap-cells" : "") + '"' + (tab.tableMinWidth ? ' style="min-width:' + tab.tableMinWidth + '"' : "") + ">";
    html += "<thead><tr>";
    html += '<th style="width:34px"><input type="checkbox" data-act="selectAll" title="全选/取消" /></th>';

      return '<th class="' + (col.num || col.type === "number" ? "num" : "") + '"' + (col.w ? ' style="width:' + col.w + '"' : "") +
        (col.title ? ' title="' + esc(col.title) + '"' : "") + ">" +
        esc(col.label) + (col.hint ? ' <span class="col-hint">（' + esc(col.hint) + "）</span>" : "") + "</th>";
    }).join("");
    html += '<th style="width:74px"></th>';
    html += "</tr></thead>";
    html += "<tbody>" + renderTableBody(tab, list) + "</tbody>";
    html += "</table></div>";

    html += '<div class="table-foot">';
    if (tab.makeRow) {
      html += '<button class="btn btn-sm" data-act="row:add">＋ 新增一行</button>';
    }

    html += '<span class="hint faint">共 ' + d.total + " 条 · 新增 " + d.added + " · 修改 " + d.changed + " · 删除 " + d.removed + "</span>";
    html += "</div>";

    html += "</section>";
    return html;
  }

  /* ===========================================================================
     10a2. 渲染：🔎 全部配置键（v1.18.16）
     ---------------------------------------------------------------------------
     站长那句「凡是插件配置里存在的键，页面上都要能改」的**检查视图**：
     每个键一行，写清「干什么用的」「在哪儿改」；插件下发了页面不认识的键
     （新版本加了配置项）会在这里红着脸列出来 —— 正常情况下这个列表是空的。
     =========================================================================== */

  /** 全部配置键的行：页面清单的顺序 + 数值页当前值 + 「插件有、页面不认识」的红行。 */
  function keyOverviewRows() {
    var values = {};
    (state.data.numbers || []).forEach(function (r) { values[toText(r && r.key)] = r; });
    var rows = NUMBER_KEYS.map(function (item) {
      var key = toText(item[0]);
      var row = values[key] || numberRowFromItem(item, undefined);
      row.entryTab = toText(row.entry).indexOf("tab:") === 0 ? toText(row.entry).slice(4) : "";
      row.known = true;
      return row;
    });
    var seen = {};
    rows.forEach(function (r) { seen[r.key] = true; });
    configKeyCoverageNow().missing.forEach(function (key) {
      if (seen[key]) return;
      seen[key] = true;
      rows.push({
        key: key, label: key, unit: "", value: "", text: false, group: "未登记",
        desc: "插件下发了这个键，但页面还没有它的编辑入口 —— 这是页面漏项，请把这一行补进 NUMBER_KEYS。",
        entry: "missing", entryLabel: "没有入口", known: false, entryTab: ""
      });
    });
    return rows;
  }

  /** 按键名 / 中文名 / 说明 / 分组 / 入口筛（搜不到就是空，页面会说清是筛没的）。 */
  function keysFilteredRows() {
    var rows = keyOverviewRows();
    var q = toText(state.keysQuery).trim().toLowerCase();
    if (!q) return rows;
    return rows.filter(function (r) {
      return (toText(r.key) + " " + toText(r.label) + " " + toText(r.desc) + " " +
        toText(r.group) + " " + toText(r.entryLabel)).toLowerCase().indexOf(q) >= 0;
    });
  }

  /** 配置键表格（每格都带 data-label：窄屏拆卡片时靠它认格）。 */
  function renderKeysTable(rows) {
    var cov = configKeyCoverageNow();
    // 搜索结果的计数放在表格这一块里：搜的时候只重绘这里，输入框不会失焦
    var head = '<div class="toolbar" style="border-radius:0">' +
      '<span class="hint">筛出 <b>' + rows.length + "</b> / 共 " + cov.counts.total + " 个键" +
      (toText(state.keysQuery) ? "（搜索词：<b>" + esc(state.keysQuery) + "</b>）" : "") +
      "</span></div>";
    if (!rows.length) {
      return head + '<div class="empty"><span class="empty-icon">🔎</span>' +
        '<div class="empty-title">没有匹配的配置键</div>' +
        '<div class="empty-sub">换个搜索词试试（可以搜键名、中文名、说明、分组）</div></div>';
    }
    var html = head + '<div class="table-wrap is-stack"><table class="grid stack wrap-cells" style="min-width:680px">';
    html += "<thead><tr>" +
      '<th style="width:190px">配置键</th><th style="width:150px">中文名</th>' +
      '<th>作用说明</th><th style="width:80px">分组</th>' +
      '<th style="width:150px">在哪儿改</th><th style="width:180px">操作</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var bad = r.known === false;
      var jump = r.entryTab
        ? '<button class="btn btn-sm btn-primary btn-jump" data-act="key:jump" data-tab="' + esc(r.entryTab) +
          '" data-key="' + esc(r.key) + '">→ 去改</button>'
        : "";
      var toNumbers = (!r.entry || r.entry === "numbers")
        ? '<button class="btn btn-sm btn-jump" data-act="key:goto" data-tab="numbers" data-key="' + esc(r.key) +
          '">⚙️ 数值页这一行</button>'
        : "";
      html += "<tr" + (bad ? ' class="is-invalid"' : "") + ">" +
        '<td class="id-cell" data-label="配置键">' + esc(r.key) + "</td>" +
        '<td data-label="中文名">' + esc(r.label) + "</td>" +
        '<td class="cut" data-label="作用说明">' + esc(r.desc) + "</td>" +
        '<td class="faint" data-label="分组">' + esc(r.group) + "</td>" +
        '<td data-label="在哪儿改">' + esc(r.entryLabel) + "</td>" +
        '<td class="actions" data-label="操作" style="width:auto;text-align:left">' +
        jump + toNumbers +
        '<button class="btn btn-sm btn-ghost" data-act="key:copy" data-key="' + esc(r.key) +
        '" title="复制这个配置键的名字">⧉ 键名</button>' +
        "</td></tr>";
    });
    return html + "</tbody></table></div>";
  }

  /** 汇总条：一眼看出覆盖情况（「没有入口」必须是 0）。 */
  function renderKeysSummary(cov) {
    var c = cov.counts;
    var html = '<div class="toolbar">' +
      '<label class="field search"><span class="field-icon">🔍</span>' +
      '<input type="search" data-act="key:query" placeholder="搜配置键 / 中文名 / 说明 / 分组…" value="' +
      esc(state.keysQuery) + '" /></label>' +
      '<span class="stat-chip">共 <b>' + c.total + "</b> 个键</span>" +
      '<span class="stat-chip">数值页能改 <b>' + c.numbers + "</b></span>" +
      '<span class="stat-chip">其它页能改 <b>' + c.tab + "</b></span>" +
      '<span class="stat-chip' + (c.panel ? " is-dirty" : "") + '">插件面板只读 <b>' + c.panel + "</b></span>" +
      '<span class="stat-chip' + (c.missing ? " is-dirty" : "") + '">没有入口 <b>' + c.missing + "</b></span>" +
      '<span class="spacer" style="margin-left:auto"></span>' +
      '<span class="hint faint">搜一下键名，就能看到它在哪儿改</span>' +
      "</div>";
    return html;
  }

  function renderKeysTab(tab) {
    var cov = configKeyCoverageNow();
    var rows = keysFilteredRows();
    var html = '<section class="card">';
    html += '<div class="card-head"><h2>🔎 全部配置键</h2>' +
      '<span class="hint">插件配置里的每一个键都在这里：能搜、能看到「它是干什么的、在哪儿改」</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm" data-act="reload" title="重新从插件读一遍配置">↻ 重读配置</button></div>';
    html += '<div id="keysSummary">' + renderKeysSummary(cov) + "</div>";

    if (cov.badEntry.length) {
      html += '<div class="notice notice-danger"><span class="notice-icon">⛔</span><div>' +
        "<b>有 " + cov.badEntry.length + " 个键的入口写错了</b>（指向不存在的标签页）：" +
        '<span class="mono">' + esc(cov.badEntry.join("、")) + "</span></div></div>";
    }
    if (cov.missing.length) {
      html += '<div class="notice notice-danger"><span class="notice-icon">⛔</span><div>' +
        "<b>插件下发了 " + cov.missing.length + " 个页面还不认识的配置键</b>：" +
        '<span class="mono">' + esc(cov.missing.slice(0, 12).join("、")) +
        (cov.missing.length > 12 ? "…" : "") + "</span>" +
        "<div class=\"hint\">说明插件加了新配置项、页面还没跟上 —— 这些键现在没法在页面上改。" +
        "（正常情况这里应该是 0 个。）</div></div></div>";
    } else {
      html += '<div class="notice"><span class="notice-icon">✅</span><div>' +
        "插件这次下发的 <b>" + cov.counts.total + "</b> 个配置键，页面上<b>一个都不缺</b>：" +
        "数值页直接能改 " + cov.counts.numbers + " 个，另外 " + cov.counts.tab +
        " 个在各自的标签页里可视化编辑，剩下 " + cov.counts.panel +
        " 个是插件配置面板自己的项（页面只读，下面单列）。</div></div>";
    }

    html += '<div id="keysMain">' + renderKeysTable(rows) + "</div>";

    var panelRows = keyOverviewRows().filter(function (r) { return r.entry === "panel"; });
    if (panelRows.length) {
      html += '<div class="card-head" style="border-top:1px solid var(--border)">' +
        '<h2>🔒 插件配置面板项（页面只读）</h2>' +
        '<span class="hint">' + panelRows.length + " 个</span></div>";
      html += '<div class="form-note" style="padding:0 12px 6px">' +
        "这几个键是插件自己配置面板里的数据项 / 通道字段，编辑器的写入白名单不收它们" +
        "（插件侧把 <span class=\"mono\">data_*</span> / <span class=\"mono\">backup_*</span> / " +
        "<span class=\"mono\">editor_*</span> 前缀挡住了）。页面这边已经把说明、当前值和只读标记都摆好了：" +
        "<b>Python 侧一放开白名单，这些行会自动变成可编辑</b>，" +
        "只有 <span class=\"mono\">editor_status</span>（页面自己的状态通道）与 " +
        "<span class=\"mono\">data_status</span>（插件回写的运行状态）例外，它们永远只读。</div>";
      html += '<div class="chip-wrap" style="padding:0 12px 12px">' +
        panelRows.map(function (r) {
          return '<span class="rp-src" title="' + esc(r.desc) + '">' + esc(r.key) + "</span>";
        }).join("") + "</div>";
    }
    html += "</section>";
    return html;
  }

  /** 搜索键名时只换表格那一块（不整页重绘：输入框不失焦、滚动条也不跳）。 */
  function refreshKeysMain() {
    var box = document.getElementById("keysMain");
    if (!box) return;
    var wrap = box.querySelector(".table-wrap");
    var top = wrap ? wrap.scrollTop : 0;
    // ⚠️ 只换 #keysMain：搜索框在 #keysSummary 里，重绘它 = 打字打到一半被踢出输入框
    box.innerHTML = renderKeysTable(keysFilteredRows());
    var next = box.querySelector(".table-wrap");
    if (next && top) next.scrollTop = top;
  }

  /** 跳到某个键的编辑入口：能定位就顺手把那张表筛成这一行。 */
  function gotoConfigKey(tabId, key) {
    var tab = TAB_BY_ID[toText(tabId)];
    if (!tab) {
      toast("warn", "这个入口打不开", "页面没有标签页「" + toText(tabId) + "」");
      return;
    }
    state.tab = tab.id;
    // 表格类标签页支持搜索框：直接把那一行筛出来，站长不用再翻
    state.query = (key && tab.columns) ? toText(key) : "";
    state.filter = "";
    state.sort = "default";
    state.selected = [];
    state.editing = null;
    render(false);
  }

  /** 复制键名（没剪贴板权限就退化成把键名显示出来，照样能选中复制）。 */
  function copyKeyName(key) {
    var text = toText(key);
    try {
      if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        toast("ok", "已复制键名", text);
        return true;
      }
    } catch (e) { /* 没权限就退回下面的提示 */ }
    toast("info", "配置键：" + text, "选中这串键名自己复制一下（浏览器没给页面剪贴板权限）");
    return false;
  }

  /* ===========================================================================
     10. 渲染：存档页（卡片 + 表单）
     =========================================================================== */
  function renderSnapshotsTab(tab) {
    var ab = state.autoBackup;

    // 新建存档：输入框 + 按钮同行，按钮只占内容宽度
    html += '<section class="card">';
    html += '<div class="card-head"><h2>💾 ' + esc(tab.title) + "</h2>" +
      '<span class="hint">' + esc(tab.hint) + "</span></div>";
    if (ENV.online) {
      html += '<div class="notice"><span class="notice-icon">ℹ️</span><div>' +
        "这里的动作会直接调用插件注册的接口并同步生效（新建 / 恢复 / 删除 / 改名都会在服务端立刻执行）。" +
        (state.players === undefined ? "" : "　当前玩家数：<b>" + esc(state.players) + "</b>") +
        (state.nextAutoBackup ? "　下次自动存档：<b>" + esc(state.nextAutoBackup) + "</b>" : "") +
        "</div></div>";
    }
    html += '<div class="new-snap">';
    html += '<div class="form-row grow"><label>存档名字（备注）</label>' +
      '<span class="field"><input type="text" id="newSnapNote" placeholder="例如：改物价前 / 版本升级前" /></span></div>';
    html += '<button class="btn btn-primary" data-act="snap:new">＋ 新建存档</button>';
    html += '<div class="form-note new-snap-hint">新建会立刻保存一份当前全部玩家数据，随时可以恢复。</div>';
    html += "</div>";

    // 自动备份设置
    html += '<div class="card-head" style="border-top:1px solid var(--border)">' +
      '<h2>⏱️ 自动备份</h2><span class="hint">下面这些是插件配置，改完一并保存生效</span></div>';
    html += '<div class="form-grid">';
    html += '<div class="form-row"><label>总开关</label>' +
      '<label class="switch"><input type="checkbox" data-act="auto:enable"' + (ab.enable ? " checked" : "") + " />" +
      '<span class="track"></span><span class="switch-label">' + (ab.enable ? "已开启" : "已关闭") + "</span></label></div>";
    html += '<div class="form-row"><label>每日存档时间点（0-23 点）</label>' +
      '<span class="field"><input type="number" min="0" max="23" data-act="auto:dailyHour" value="' + esc(ab.dailyHour) + '" /></span></div>';
    html += '<div class="form-row"><label>按时存档间隔（小时，0=关闭）</label>' +
      '<span class="field"><input type="number" min="0" max="72" data-act="auto:intervalHours" value="' + esc(ab.intervalHours) + '" /></span></div>';
    html += '<div class="form-row"><label>每日存档保留天数（0=永久）</label>' +
      '<span class="field"><input type="number" min="0" max="3650" data-act="auto:keepDaily" value="' + esc(ab.keepDaily) + '" /></span></div>';
    html += '<div class="form-row"><label>按时存档保留份数（0=永久）</label>' +
      '<span class="field"><input type="number" min="0" max="9999" data-act="auto:keepInterval" value="' + esc(ab.keepInterval) + '" /></span></div>';
    html += '<div class="form-row"><label>手动存档保留份数（0=永久）</label>' +
      '<span class="field"><input type="number" min="0" max="10000" data-act="auto:keepManual" value="' + esc(ab.keepManual) + '" /></span></div>';
    html += "</div>";
    html += "</section>";

    // 存档列表
    var list = state.snapshots || [];
    html += '<section class="card">';
    html += '<div class="card-head"><h2>🗂️ 已有存档</h2>' +
      '<span class="hint">共 ' + list.length + " 份 · 按时间倒序</span>" +
      '<span class="spacer"></span><button class="btn btn-sm" data-act="snap:reload">↻ 刷新列表</button></div>';

    if (!list.length) {
      html += '<div class="empty"><span class="empty-icon">📦</span><div class="empty-title">还没有任何存档</div>' +
        '<div class="empty-sub">点上面的「＋ 新建存档」存第一份</div></div>';
    } else {
      html += '<div class="snap-grid">' + list.map(function (s, i) { return renderSnapCard(s, i); }).join("") + "</div>";
    }
    html += "</section>";
    return html;
  }

  function renderSnapCard(s, i) {
    var confirming = state.pendingConfirm && state.pendingConfirm.scope === "card" && state.pendingConfirm.index === i;
    var renaming = state.editing && state.editing.scope === "snapNote" && state.editing.index === i;
    var busy = state.pendingConfirm && state.pendingConfirm.index === i;
    var cls = "snap-card" + (busy && state.pendingConfirm.action === "restore" ? " is-restoring" : "") +
      (busy && state.pendingConfirm.action === "delete" ? " is-deleting" : "");

    var note = renaming
      ? '<input class="cell-input" data-act="snapNote:input" data-index="' + i + '" value="' + esc(s.note || "") + '" placeholder="给这份存档起个名字…" />'
      : '<div class="snap-note" data-act="snapNote:edit" data-index="' + i + '" title="点一下改名">' +
        (s.note ? esc(s.note) : '<span class="placeholder">未命名（点这里改名）</span>') + "</div>";

    var actions;
    if (confirming) {
      var word = state.pendingConfirm.action === "restore" ? "恢复" : "删除";
      actions = '<div class="confirm-strip"><span class="q">确认' + word + "？</span>" +
        '<button class="btn btn-sm ' + (word === "删除" ? "btn-danger" : "btn-primary") + '" data-act="snap:' +
        (word === "删除" ? "delYes" : "restoreYes") + '" data-index="' + i + '">确认' + word + "</button>" +
        '<button class="btn btn-sm" data-act="confirm:cancel">取消</button></div>';
    } else {
      actions =
        '<button class="btn btn-sm" data-act="snap:restore" data-index="' + i + '" title="把这批玩家数据恢复到这份存档">↩ 恢复</button>' +

        '<button class="btn btn-sm" data-act="snap:download" data-index="' + i + '" title="下载这份存档的信息（名字/时间/玩家数），不是玩家数据本体">⬇ 下载信息</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm btn-danger" data-act="snap:delete" data-index="' + i + '" title="删除这份存档（删前会自动存一份）">🗑 删除</button>';

    return '<article class="' + cls + '">' +
      '<div class="snap-top">' +
      '<span class="kind kind-' + esc(s.kind) + '">' + (KIND_ICON[s.kind] || "") + " " + (KIND_LABEL[s.kind] || s.kind) + "</span>" +

  /* ===========================================================================
     10b. 渲染：玩家页（改金币）

  /** 页面认识的「规范子命令」：在线以插件回写的清单为准，离线用演示清单。 */
  function canonicalCommands() {
    var list = (lastStatus && lastStatus.subcommands) || DEMO.subcommands || [];
    return list.map(function (x) { return String(x); });
  }

  function normalizePlayerRow(r) {
    return {
      user_id: text(r && r.user_id),
      name: text(r && r.name),
      gold: num(r && r.gold, 0),
      level: num(r && r.level, 1),
      caught: num(r && r.caught, 0),
      sold: num(r && r.sold, 0),
      fish: num(r && r.fish, 0),
      aquarium: num(r && r.aquarium, 0),
      saved_text: text(r && r.saved_text)
    };
  }

  /** 拉实时玩家列表；失败时把原因写进 state.playersError（页面会显示）。 */
  async function fetchPlayers(showToast) {
    if (!ENV.online) {
      state.playersList = (DEMO.players || []).map(normalizePlayerRow);
      state.playersTotal = state.playersList.length;
      state.playersError = "";
      return true;
    }
    state.playersLoading = true;
    try {
      var res = await bridgeRequest("post", "players", {
        action: "list", query: state.playersQuery || ""
      });
      state.playersList = ((res && res.players) || []).map(normalizePlayerRow);
      state.playersTotal = num(res && res.total, state.playersList.length);
      state.playersGoldMax = num(res && res.gold_max, state.playersGoldMax);
      state.playersScanLimit = num(res && res.scan_limit, state.playersScanLimit);
      state.playersError = "";
      if (showToast) toast("info", "已刷新玩家列表", "共 " + state.playersList.length + " 行");
      return true;
    } catch (e) {
      state.playersError = describeError(e, "players");
      state.playersList = [];
      if (showToast) toast("err", "读取玩家列表失败", state.playersError);
      return false;
    } finally {
      state.playersLoading = false;
    }
  }

  /** 拉某份存档里的玩家列表（改存档内金币用）。 */
  async function fetchSnapshotPlayers(name, showToast) {
    var wanted = text(name || state.snapshotPick);
    state.snapshotPick = wanted;
    if (!wanted) {
      state.snapshotPlayers = [];
      state.snapshotPlayersError = "先选一份存档";
      return false;
    }
    if (!ENV.online) {
      // 离线演示：拿当前演示玩家假装是存档里的玩家
      state.snapshotPlayers = (DEMO.players || []).map(normalizePlayerRow);
      state.snapshotPlayersError = "";
      return true;
    }
    try {
      var res = await bridgeRequest("post", "players", { action: "snapshot_list", name: wanted });
      if (res && res.status === "error") {
        state.snapshotPlayers = [];
        state.snapshotPlayersError = text(res.message, "读不出这份存档");
      } else {
        state.snapshotPlayers = ((res && res.players) || []).map(normalizePlayerRow);
        state.snapshotPlayersError = "";
        state.playersGoldMax = num(res && res.gold_max, state.playersGoldMax);
      }
      if (showToast) toast("info", "已载入存档内玩家", wanted + " · " + state.snapshotPlayers.length + " 名");
      return !state.snapshotPlayersError;
    } catch (e) {
      state.snapshotPlayers = [];
      state.snapshotPlayersError = describeError(e, "players");
      if (showToast) toast("err", "读取存档内玩家失败", state.snapshotPlayersError);
      return false;
    }
  }

  /** 玩家接口（相对路径 players）：列表 / 存档内列表 / 改金币。 */
  async function playersCommand(body) {
    if (!ENV.online) {
      return { accepted: false, message: "离线预览：不会真正执行玩家操作" };
    }
    try {
      var res = await bridgeRequest("post", "players", body || {});
      if (res && typeof res === "object" && typeof res.editor_status === "string") {
        try {
          var fresh = parseEditorStatus({ editor_status: res.editor_status });
          if (fresh) { pendingStatus = fresh; lastStatus = fresh; }
        } catch (e) { /* 状态解析失败不影响结果 */ }
      }
      var message = (res && typeof res === "object" && res.message)
        ? String(res.message)
        : "已执行玩家操作";
      var okFlag = !(res && typeof res === "object" && res.ok === false);
      return { accepted: okFlag, message: message, detail: res };
    } catch (e) {
      return { accepted: false, message: describeError(e, "players") };
    }
  }

  /** 改金币（实时玩家 / 存档内玩家）。confirm 由调用方在二次确认后传 true。 */
  async function savePlayerGold(mode, userId, gold, snapshotName) {
    if (!ENV.online) {
      return { ok: false, message: "离线预览：不会真正改玩家数据" };
    }
    var body = mode === "snapshot"
      ? { action: "snapshot_gold", name: text(snapshotName || state.snapshotPick),
          user_id: text(userId), gold: num(gold, 0), confirm: true }
      : { action: "set_gold", user_id: text(userId), gold: num(gold, 0), confirm: true };
    var res = await playersCommand(body);
    return { ok: !!res.accepted, message: res.message, detail: res.detail };
  }

  /**
   * 收起「找回旧数据」面板：清掉页面上的结果/提示，并让插件忘掉缓存的扫描结果
   * （否则刷新一次页面它又冒出来）。**一个字节的玩家数据都不动。**
   */
  async function closeLegacyPanel() {
    state.legacy = null;
    state.legacyMsg = "";
    state.legacyConfirm = false;
    state.legacyBusy = false;
    render();
    var res = await sendCommand("legacy_clear", {});
    return {
      ok: !!(res && res.accepted),
      message: (res && res.message) || ""
    };
  }

  function playerRowsNow() {
    return state.playersMode === "snapshot" ? (state.snapshotPlayers || []) : (state.playersList || []);
  }

  /**
   * 「找回旧数据」：`legacy_scan` 只读扫一遍主库，`legacy_import` 把当前作用域缺的
   * 玩家补进来（插件会先自动存一份档）。两条都走 config 通道。
   */
  async function runLegacyAction(action) {
    if (state.legacyBusy) return { ok: false, message: "正在处理，稍等" };
    if (!ENV.online) return { ok: false, message: "离线预览：不会去读主库" };
    var importing = action === "legacy_import";
    state.legacyBusy = true;
    state.legacyConfirm = false;
    state.legacyMsg = importing ? "正在导入（先自动存一份档）…" : "正在扫描主库里的旧作用域…";
    render();
    var res = await sendCommand(action, {});
    var status = null;
    if (res.accepted) {
      status = await waitForStatus();
      if (status) applyStatus(status);
    }
    state.legacyBusy = false;
    state.legacyMsg = text((status && status.last_result) || res.message);
    if (res.accepted && importing) {
      // 导入后玩家列表变了：刷新一下实时列表（存档列表也跟着多了一份快照）
      await fetchPlayers(false);
      if (status) applyStatus(status);
    }
    render();
    return { ok: res.accepted, message: state.legacyMsg };
  }
