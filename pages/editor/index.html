    html += "</section>";

    html += '<div class="rp-split"><div class="rp-main" id="rpMain">' + renderReplyMain() +
      "</div>" + renderReplyPreviewPanel() + "</div>";
    // 已有文案 / 已有指令 / 数字样式的下拉数据（一份 datalist，154 个场景共用）
    html += renderReplyDatalists();
    return html;
  }

  /** 工具栏上的计数（搜索结果会跟着变，所以单独抽出来局部刷新）。 */
  function replyStatsHtml() {
    var r = state.replies;
    var shown = replyFilterScenes(r.scenes, r.query).length;
    var dirty = replyDirtyCount();
    return '<span class="stat-chip">场景 <b>' + shown + "</b>" +
      (shown !== r.scenes.length ? " / " + r.scenes.length : "") + "</span>" +
      '<span class="stat-chip">按钮 <b>' + replyOverviewRows().length + "</b></span>" +
      '<span class="stat-chip' + (dirty ? " is-dirty" : "") + '">未保存 <b>' + dirty + "</b></span>" +
      '<span class="hint faint">每行几个：全局 <b>' + esc(String(replyGlobalPerRow() || r.perRowDefault || 3)) +
      "</b> 个</span>";
  }

  /** 卡片视图 / 总览视图的主体（局部刷新只重画这一块）。 */
  function renderReplyMain() {
    var r = state.replies;
    if (r.view === "overview") return renderReplyOverview();
    if (!r.groups.length) {
      return '<section class="card"><div class="empty"><span class="empty-icon">🫧</span>' +
        '<div class="empty-title">没有读到任何回复场景</div>' +
        '<div class="empty-sub">插件端还没上线 scenes 接口的话，可以先在「🔘 按钮（原始文本）」页里改</div>' +
        "</div></section>";
    }
    var vis = replyVisibleGroups();
    if (!vis.length) {
      return '<section class="card"><div class="empty"><span class="empty-icon">🔍</span>' +
        '<div class="empty-title">没有匹配「' + esc(r.query) + '」的场景</div>' +
        '<div class="empty-sub">换个关键词，或清空搜索框看全部 ' + r.scenes.length + " 个场景</div>" +
        "</div></section>";
    }
    return vis.map(function (item) {
      var g = item.group;
      var open = !r.collapsed[g.id];
      var scenes = open ? item.scenes : [];
      var withButtons = item.scenes.filter(function (s) {
        return replySceneDraft(s.id).buttons.length > 0;
      }).length;
      var html = '<section class="rp-group"><div class="rp-group-head">' +
        '<button class="btn btn-sm btn-icon btn-ghost" data-act="rp:group" data-group="' + esc(g.id) +
        '" title="' + (open ? "收起这一组" : "展开这一组") + '">' + (open ? "▾" : "▸") + "</button>" +
        "<h3>" + esc(g.label) + "</h3>" +
        '<span class="hint">' + esc(g.desc || "") + "</span>" +
        '<span class="spacer" style="margin-left:auto"></span>' +
        '<span class="hint faint">' + item.scenes.length + " 个场景 · " + withButtons + " 个有按钮</span></div>";
      scenes.forEach(function (scene) { html += renderReplyCard(scene); });
      return html + "</section>";
    }).join("");
  }

  /** 只重画主体 + 计数（搜索、折叠分组时用，输入框不会失焦）。 */
  function refreshReplyMain() {
    var box = document.getElementById("rpMain");
    if (box) box.innerHTML = renderReplyMain();
    var stats = document.getElementById("rpStats");
    if (stats) stats.innerHTML = replyStatsHtml();
    renderStatusBar();
    renderTabs();
  }

  /** 打字时只刷新预览与警告，不整体重绘（否则输入框会失焦）。 */
  function refreshReplyLive(sceneId) {
    var scene = replySceneById(sceneId);
    if (!scene) return;
    var body = document.getElementById("rpPreviewBody");
    if (body && state.replies.focus === sceneId) {
      body.innerHTML = renderReplyPreview(previewModelFor(scene));
    }
    var warn = document.getElementById("rpWarn-" + sceneId);
    if (warn) {
      warn.innerHTML = replyWarnHtml(templateWarnings(replySceneDraft(sceneId).text, scene), false);
    }
    var pw = document.getElementById("rpPreviewWarn");
    if (pw && state.replies.focus === sceneId) {
      pw.innerHTML = replyWarnHtml(templateWarnings(replySceneDraft(sceneId).text, scene), true);
    }
    renderStatusBar();
    renderTabs();
  }

  /* ===========================================================================
     11. 渲染：总入口 + 状态栏
     =========================================================================== */
  /* ===========================================================================
     滚动位置：整页重绘（render）时保住滚动条 ——
     不然点一个项再点另一个，页面咻地跳回最上面，长表格根本没法连着改。
     三个地方要记住：窗口、表格容器、回复页的预览边栏。
     =========================================================================== */
  var SCROLL_AREAS = [".table-wrap", ".rp-table-wrap", ".rp-side"];

  function scrollAreas() {
    var areas = [];
    var doc = document.scrollingElement || document.documentElement;
    if (doc) areas.push(doc);
    SCROLL_AREAS.forEach(function (sel) {
      var list = document.querySelectorAll(sel);
      for (var i = 0; i < list.length; i++) areas.push(list[i]);
    });
    return areas;
  }

  /** 记下当前所有滚动容器的位置（下标就是 scrollAreas() 的顺序）。 */
  function snapshotScroll() {
    return scrollAreas().map(function (el) {
      return { top: el.scrollTop || 0, left: el.scrollLeft || 0 };
    });
  }

  /** 把位置写回去；DOM 变短了就按浏览器自己能到的最大值。 */
  function restoreScroll(snap) {
    if (!snap || !snap.length) return;
    var areas = scrollAreas();
    for (var i = 0; i < areas.length && i < snap.length; i++) {
      if (snap[i].top) areas[i].scrollTop = snap[i].top;
      if (snap[i].left) areas[i].scrollLeft = snap[i].left;
    }
  }

  function render(keepScroll) {
    // keepScroll === false：明确要求回到顶部（切标签页、切视图时用）
    var snap = keepScroll === false ? null : snapshotScroll();
    renderTabs();
    var tab = TAB_BY_ID[state.tab];
    var panel = document.getElementById("panel");
    var banner = renderBanner();

    if (state.loading) {
      panel.innerHTML = banner + '<section class="card"><div class="empty">' +
        '<span class="empty-icon">🎣</span><div class="empty-title">正在载入数据…</div>' +
        '<div class="empty-sub">离线预览会直接使用演示数据</div></div></section>';
    } else if (tab.kind === "snapshots") {
      panel.innerHTML = banner + renderSnapshotsTab(tab);
    } else if (tab.kind === "players") {
      panel.innerHTML = banner + renderPlayersTab(tab);
    } else if (tab.kind === "replies") {
      panel.innerHTML = banner + renderRepliesTab(tab);
    } else if (tab.kind === "keys") {
      // 🔎 全部配置键：不重绘整页搜索（保住滚动位置 + 不失焦），走局部刷新
      panel.innerHTML = banner + renderKeysTab(tab);
    } else if (tab.navGroup) {
      // 「⌨️ 命令」这一组里有两张表：上面一条小切换条，下面渲染当前这张
      panel.innerHTML = banner + renderSubTabs(tab.navGroup, tab.id) + renderTableTab(tab);
    } else {
      panel.innerHTML = banner + renderTableTab(tab);
    }

    restoreScroll(snap);
    renderStatusBar();
  }

  /** 同组标签页之间的小切换条（命令别名 / 自定义命令）。 */
  function renderSubTabs(group, activeId) {
    var items = TABS.filter(function (t) { return t.navGroup === group; });
    if (items.length < 2) return "";
    var html = '<div class="toolbar" style="border-radius:12px 12px 0 0">';
    items.forEach(function (t) {
      var d = diffTab(t.id);
      html += '<button class="btn btn-sm' + (t.id === activeId ? " btn-primary" : "") +
        '" data-act="tab" data-tab="' + esc(t.id) + '">' + esc(t.title) +
        (d.count ? "（" + d.count + " 处未保存）" : "") + "</button>";
    });
    html += '<span class="spacer" style="margin-left:auto"></span>' +
      '<span class="hint faint">两张表都在这一页：改完记得点右上角「保存并生效」</span>';
    html += "</div>";
    return html;
  }

  /** 顶部提示条：读取失败 / 有行没解析出来都要说清楚，不静默。 */
  function renderBanner() {
    var html = "";
    if (state.loadError) {
      html += '<div class="notice notice-danger"><span class="notice-icon">⛔</span><div>' +
        '<b>读取插件配置失败</b>　' + esc(state.loadError) +
        "<br />下面是演示数据，改动不会保存；点右上角「↻ 重新载入」重试。" +
        "</div></div>";
    }
    (state.loadNotes || []).forEach(function (note) {
      html += '<div class="notice"><span class="notice-icon">⚠️</span><div>' +
        esc(note) + "</div></div>";
    });
    return html;
  }

  function renderStatusBar() {
    var total = dirtyTotal();
    var abDirty = state.autoBackupDirty ? 1 : 0;
    var n = total + abDirty;
    var info = document.getElementById("dirtyInfo");
    if (n > 0) {
      info.innerHTML = '<i class="dot is-dirty"></i>有未保存的修改（' + n + " 处）";
    } else {
      info.innerHTML = '<i class="dot is-clean"></i>已同步';
    }
    document.getElementById("savedInfo").textContent = state.savedAt ? "上次保存 " + state.savedAt : "尚未保存";

    var tab = TAB_BY_ID[state.tab];
    var cnt;
    if (tab.kind === "snapshots") cnt = (state.snapshots || []).length;
    else if (tab.kind === "players") cnt = playerRowsNow().length;
    else if (tab.kind === "replies") cnt = (state.replies.scenes || []).length;
    else if (tab.kind === "keys") cnt = configKeyCoverageNow().counts.total;
    else cnt = (state.data[tab.id] || []).length;
    document.getElementById("tabInfo").textContent = tab.title + " · " + cnt + " 条";

    var badge = document.getElementById("connBadge");
    var text = document.getElementById("connText");
    if (ENV.online) {
      badge.className = "badge is-online";
      text.textContent = "已连接 AstrBot";
    } else {
      badge.className = "badge is-offline";
      text.textContent = "离线预览";
    }
  }

  /* ===========================================================================
     12. 行内编辑
     =========================================================================== */
  function startEdit(index, key, scope) {
    var tab = TAB_BY_ID[state.tab];
    // 正在编辑别的单元格：值已经实时写入，直接收起旧的输入框
    if (state.editing && state.editing.scope === "cell") {
      state.editing = null;
      state.editBackup = null;
    }
    if (scope === "snapNote") {
      var snap = state.snapshots[index] || {};
      state.editBackup = { scope: "snapNote", index: index, note: snap.note || "" };
      state.editing = { scope: "snapNote", index: index };
      render();
      var el = $('[data-act="snapNote:input"]');
      if (el) { el.focus(); el.select(); }
      return;
    }
    if (tab.columns) {
      var col = tab.columns.filter(function (c) { return c.key === key; })[0];
      if (!col || col.type === "readonly") return;
    }
    var row = (state.data[tab.id] || [])[index];
    if (!row) return;
    // 入口行（在别的页改 / 插件面板只读）没有可编辑的值
    if (row.entry || row.writable === false) return;
    state.editBackup = { index: index, key: key, value: row[key] };
    state.editing = { scope: "cell", index: index, key: key };
    render();
    var input = $('.cell-input[data-index="' + index + '"][data-key="' + key + '"]');
    if (input) { input.focus(); input.select(); }
  }

  function commitEdit() {
    var wasSnapNote = state.editing && state.editing.scope === "snapNote";
    var backup = state.editBackup;
    state.editing = null;
    state.editBackup = null;
    render();
    // 存档改名：面板上只是「改个名字」，实际是给快照文件里的 note 字段赋值
    if (wasSnapNote && backup) {
      var snap = state.snapshots[backup.index];
      if (!snap) return;
      var next = String(snap.note || "");
      if (next === String(backup.note || "")) return;
      renameSnapshot(snap, next, backup.note || "");
    }
  }

  /** 把改名指令发给插件（失败就把界面上的名字改回去，别骗人）。 */
  async function renameSnapshot(snap, next, previous) {
    var res = await runSnapshotAction("rename", { name: snap.name || snap.rel, note: next });
    if (res.ok) {
      toast("ok", "备注已提交", res.message || (previous + " → " + next));
    } else {
      snap.note = previous;
      toast("warn", "改名没成功", res.message || "插件没有回写结果");
      render();
    }
  }

  function cancelEdit() {
    if (state.editBackup) {
      var b = state.editBackup;
      if (b.scope === "snapNote") {
        var snap = state.snapshots[b.index];
        if (snap) snap.note = b.note;
      } else {
        var row = (state.data[state.tab] || [])[b.index];
        if (row) row[b.key] = b.value;
      }
    }
    state.editing = null;
    state.editBackup = null;
    render();
  }

  function onCellInput(el) {
    var index = Number(el.getAttribute("data-index"));
    var key = el.getAttribute("data-key");
    var tab = TAB_BY_ID[state.tab];
    var row = (state.data[tab.id] || [])[index];
    if (!row) return;
    var col = (tab.columns || []).filter(function (c) { return c.key === key; })[0] || {};
    var v = el.value;
    row[key] = (col.type === "number" && !row.text) ? (v === "" ? "" : Number(v)) : v;

    // 即时校验：只更新本行样式与状态栏，避免输入时整表重绘导致失焦
    var errs = validateRow(tab, row);
    el.classList.toggle("is-bad", !!errs[key]);
    if (errs[key]) el.title = errs[key]; else el.removeAttribute("title");
    renderStatusBar();
    renderTabs();
  }

  /* ===========================================================================
     13. 批量操作
     =========================================================================== */
  function applyBatch() {
    var tab = TAB_BY_ID[state.tab];
    var a = state.batchAction;
    var rows = state.selected.map(function (i) { return (state.data[tab.id] || [])[i]; }).filter(Boolean);
    if (!rows.length) { toast("warn", "没有选中行", "先勾选要改的行"); return; }

    if (a === "price") {
      var mult = Number(state.batchValue);
      if (!isFinite(mult) || mult <= 0) { toast("err", "倍数不合法", "填一个大于 0 的数字"); return; }
      var field = state.batchField || "value";
      var n = 0;
      rows.forEach(function (r) {
        if (r[field] !== undefined) { r[field] = Math.round(Number(r[field]) * mult * 100) / 100; n++; }
      });
      toast("ok", "已应用", n + " 行的 " + field + " ×" + mult);
    } else if (a === "rarity") {
      rows.forEach(function (r) { r.rarity = state.batchValue; });
      toast("ok", "已应用", rows.length + " 行改为 " + state.batchValue);
    } else if (a === "dist") {
      var dist = String(state.batchValue || "").trim();
      if (!dist) { toast("err", "分布不能为空", "例如 lake:1.0,sea:0.6"); return; }
      rows.forEach(function (r) { r.dist = dist; });
      toast("ok", "已应用", rows.length + " 行分布改为 " + dist);
    } else if (a === "delete") {
      var idx = state.selected.slice().sort(function (x, y) { return y - x; });
      idx.forEach(function (i) { (state.data[tab.id] || []).splice(i, 1); });
      toast("ok", "已删除", idx.length + " 行（保存后生效）");
      state.selected = [];
    }

    state.batchAction = null;
    state.batchValue = "";
    render();
  }

  /* ===========================================================================
     14. 存档动作
     =========================================================================== */

  /** 存档卡片上的「下载」：先把这份存档的想法说清楚，别让人以为拿到了数据。 */
  function downloadSnapshot(s) {
    var payload = {
      kind: s.kind, kind_name: s.kind_name, note: s.note, time: s.time,
      players: s.players, size: s.size, file: s.name || s.rel,
      note_text: ENV.online
        ? "这是页面上的存档信息，不是玩家数据本体；要拿完整数据请到" +
          "「插件配置 → 导出存档文件」下载，或直接取 backups/ 目录里的同名文件。"
        : "离线预览数据，仅用于看排版。"
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "snapshot_" + String(s.name || s.time || "").replace(/[^\w.-]/g, "_") + ".info.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("ok", "已开始下载", s.note || s.name || s.time || "");
  }

  async function snapshotAction(kind, i) {
    var s = state.snapshots[i];
    if (!s) return;

    if (kind === "download") {
      downloadSnapshot(s);
      return;
    }

    var res = await runSnapshotAction(kind, {
      name: s.name || s.rel || "",
      id: s.name || s.rel || "",
      note: s.note
    });
    if (res.ok) {
      toast("ok", "已提交", res.message || "");
    } else {
      toast("warn", kind === "restore" ? "恢复未执行" : kind === "delete" ? "删除未执行" : "操作未执行", res.message || "");
    }
    state.pendingConfirm = null;
    render();
  }

  /* ===========================================================================
     15. 保存 / 导出 / 导入 / 重新载入
     =========================================================================== */
  function buildPayload() {
    var payload = {};
    TABS.forEach(function (t) {
      if (t.kind) return;   // 存档页 / 玩家页的数据不走「内容表」载荷
      payload[t.id] = state.data[t.id] || [];
    });
    payload.autoBackup = state.autoBackup;
    return payload;
  }

  function markSaved() {
    TABS.forEach(function (t) {
      if (t.kind) return;
      var map = {};
      (state.data[t.id] || []).forEach(function (row) {
        var k = rowKey(t, row);
        if (k) map[k] = JSON.stringify(row);
      });
      state.originals[t.id] = map;
    });
    state.autoBackupDirty = false;
    state.savedAt = nowText();
  }

  async function doSave() {
    /* 只拦「这次真的改过、而且改错了」的地方。
       以前是任何一张表里有红格子就整页拒收：站长在「💬 回复」页给新场景加过按钮，
       那几行的场景键被老白名单误判成红的，于是他改好的命令别名永远存不进去
       （点了保存只弹一句「有内容没填对」，还不说哪一行）。 */
    var dirtyTabs = TABS.filter(function (t) { return t.columns && diffTab(t.id).count > 0; });
    var blocking = [];
    dirtyTabs.forEach(function (t) {
      blocking = blocking.concat(problemsInTab(t.id, true));
    });
    if (blocking.length) {
      gotoProblem(blocking[0]);
      var first = problemWhere(blocking[0]);
      toast("err", "这次要改的内容里有填错的",
        first + (blocking.length > 1
          ? "；另外还有 " + (blocking.length - 1) + " 处，先把这一处改好再点保存"
          : ""),
        { label: "跳到这一格", fn: function () { gotoProblem(blocking[0]); } });
      return;
    }
    /* 没动过的表里的历史红格子：不拦保存，但要说一声（点一下能跳过去看） */
    var stale = [];
    TABS.forEach(function (t) {
      if (!t.columns || dirtyTabs.indexOf(t) >= 0) return;
      var list = problemsInTab(t.id, false);
      if (list.length) stale.push({ tabId: t.id, count: list.length, first: list[0] });
    });
    var btn = document.getElementById("btnSave");
    btn.disabled = true;
    btn.textContent = "⏳ 保存中…";
    var replyDirty = state.replies.loaded && !state.replies.readonly && replyDirtyCount() > 0;
    try {
      /* 💬 回复页改过按钮：先把合并后的 button_defs 同步进原始表格，
         否则 save_content 会把刚改的按钮又写回旧值（两条通道打架）。 */
      if (replyDirty) applyButtonsTextToTable(replyTextsNow().texts.button_defs);
      var res = await saveConfig(buildPayload());
      var replyRes = replyDirty ? await saveReplies(null) : null;

      if (!replyDirty) {
        if (res && res.ok) {
          markSaved();
          toast("ok", "已保存并生效", res.message || "配置已写入插件");
        } else {
          toast("warn", "没有真正写入", (res && res.message) || "保存通道未接入");
        }
      } else if (res && res.ok && replyRes && replyRes.ok) {
        markSaved();
        toast("ok", "已保存并生效", (res.message || "") + "；回复配置：" + replyRes.message);
      } else if (res && res.ok && replyRes) {
        // 内容表写进去了，回复配置没写进去：别说「全部成功」
        markSaved();
        toast("warn", "回复配置没保存成功", replyRes.message);
      } else if (replyRes && replyRes.ok) {
        toast("warn", "内容表没保存成功，回复配置已写入",
          (res && res.message) || "保存通道未接入");
      } else {
        toast("warn", "没有真正写入", replyRes ? replyRes.message : ((res && res.message) || "保存通道未接入"));
      }
    } catch (e) {
      toast("err", "保存失败", String(e && e.message || e));
    } finally {
      btn.disabled = false;
      btn.innerHTML = "💾 保存并生效";
      render();
      if (stale.length) {
        var staleTotal = stale.reduce(function (a, s) { return a + s.count; }, 0);
        var firstStale = stale[0].first;
        toast("info", "另有 " + staleTotal + " 处历史问题（没动过，不拦保存）",
          problemWhere(firstStale) + "；这些行这次没改，等你去改它们时才会拦保存",
          { label: "去看第一处", fn: function () { gotoProblem(firstStale); } });
      }
    }
  }

  function doExport() {
    var blob = new Blob([JSON.stringify(buildPayload(), null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fishing_data_" + nowText().replace(/[^\d]/g, "") + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("ok", "已导出", "文件已开始下载");
  }

  function doImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var obj = JSON.parse(String(reader.result));
        var n = 0;
        TABS.forEach(function (t) {
          if (t.kind) return;
          if (Array.isArray(obj[t.id])) { state.data[t.id] = obj[t.id]; n++; }
        });
        if (obj.autoBackup) { state.autoBackup = obj.autoBackup; state.autoBackupDirty = true; }
        if (!n) { toast("err", "文件里没有可用数据", "至少要有 fish / locations 等数组字段"); return; }
        state.selected = [];
        toast("ok", "已导入", n + " 张表被替换，记得点保存");
        render();
      } catch (e) {
        toast("err", "JSON 解析失败", String(e && e.message || e));
      }
    };
    reader.readAsText(file);
  }

  async function reloadAll(silent) {
    state.loading = true;
    state.selected = [];
    state.editing = null;
    state.pendingConfirm = null;
    state.query = "";
    state.filter = "";
    state.sort = "default";
    state.loadError = "";
    state.loadNotes = [];
    skipped = {};
    render();

    var cfg = null;
    try {
      cfg = await loadConfig();
    } catch (e) {
      // 读配置失败：不白屏，把原因写在页面上，并退回演示数据让界面还能用
      state.loadError = String((e && e.message) || e);
      cfg = demoConfig();
    }
    TABS.forEach(function (t) {
      if (t.kind) return;
      state.data[t.id] = deepClone(cfg[t.id] || []);
    });
    if (cfg.autoBackup) state.autoBackup = deepClone(cfg.autoBackup);
    state.loadNotes = (cfg._notes || []).slice();
    /* 玩家页：清掉上一轮的编辑/确认态，并拉一次列表（离线用演示数据） */
    state.goldEdit = null;
    state.goldConfirm = null;
    state.playersError = "";
    await fetchPlayers(false);

    var snaps = null;
    try {
      snaps = await loadSnapshots();
    } catch (e) {
      state.loadError = state.loadError || String((e && e.message) || e);
      snaps = { snapshots: [], autoBackup: null };
    }
    state.snapshots = deepClone((snaps && snaps.snapshots) || []);
    if (snaps && snaps.autoBackup) state.autoBackup = deepClone(snaps.autoBackup);
    state.players = snaps ? snaps.players : undefined;
    state.nextAutoBackup = snaps ? snaps.nextAutoBackup : "";

    /* 💬 回复页：读场景列表（端点半读不到会自己退回只读展示，不会抛出来） */
    try {
      await loadReplies();
    } catch (e) {
      state.replies.loading = false;
      state.replies.error = state.replies.error || String((e && e.message) || e);
      state.replies.scenes = state.replies.scenes || [];
      state.replies.groups = state.replies.groups || [];
      state.replies.loaded = true;
    }

    markSaved();
    state.savedAt = null;
    state.loading = false;
    render();

    if (state.loadError) {
      toast("err", ENV.online ? "读取插件配置失败" : "离线预览模式", state.loadError);
      return;
    }
    if (!silent) {
      toast(
        "info",
        ENV.online ? "已重新载入" : "离线预览模式",
        ENV.online
          ? "已丢弃未保存的修改" + (state.loadNotes.length ? "；注意：" + state.loadNotes[0] : "")
          : "检测不到 AstrBot 桥接：用内置演示数据渲染，保存不会真正生效"
      );
    } else if (ENV.online && state.loadNotes.length) {
      toast("warn", "有内容没解析出来", state.loadNotes[0]);
    }
  }

  /* ===========================================================================
     16. 事件绑定（全部走委托，重绘不会丢监听）
     =========================================================================== */
  function switchTab(id) {
    if (id === state.tab) return;
    var prev = TAB_BY_ID[state.tab];
    if (prev && prev.columns && diffTab(prev.id).count) {
      toast("info", "切到「" + TAB_BY_ID[id].title + "」", "「" + prev.title + "」还有未保存的修改，别忘了保存");
    }
    state.tab = id;
    state.selected = [];
    state.editing = null;
    state.pendingConfirm = null;
    state.batchAction = null;
    state.query = "";
    state.filter = "";
    state.sort = "default";
    state.keysQuery = "";      // 🔎 全部配置键的搜索词也跟着清（换页就是重新看）
    state.replies.picker = ""; // 💬 回复页的「加按钮」选择器也收起来（离开这一页了）
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* file:// 下可能受限，忽略 */ }
    // 换标签页从顶上开始看（不保留滚动位置）
    render(false);
  }

  document.addEventListener("click", function (ev) {
    var target = ev.target;
    if (!target || typeof target.closest !== "function") return;
    var el = target.closest("[data-act]");
    if (!el) {
      // 点空白处：退出行内编辑（值已经实时写入，这里只是收起输入框）
      if (state.editing && state.editing.scope === "cell" && !target.closest(".cell-input")) commitEdit();
      return;
    }
    var act = el.getAttribute("data-act");
    var index = Number(el.getAttribute("data-index"));
    var key = el.getAttribute("data-key");
    var tab = TAB_BY_ID[state.tab];

    switch (act) {
      case "tab": switchTab(el.getAttribute("data-tab")); break;
      /* 数值页的「→ 到 XX 页改」/「全部配置键」页的跳转：去那个键真正的编辑入口 */
      case "num:jump":
      case "key:jump":
      case "key:goto": {
        gotoConfigKey(el.getAttribute("data-tab"), el.getAttribute("data-key"));
        break;
      }
      case "key:copy": {
        copyKeyName(el.getAttribute("data-key"));
        break;
      }
      case "key:reload":
      case "reload": {
        reloadAll(false);
        break;
      }

      case "edit": startEdit(index, key); break;
      case "cell": break; // 输入框自身

      case "row:select": {
        ev.stopPropagation();
        var at = state.selected.indexOf(index);
        if (at >= 0) state.selected.splice(at, 1); else state.selected.push(index);
        render();
        break;
      }
      case "selectAll": {
        var list = visibleRows(tab);
        var allSelected = list.length > 0 && list.every(function (it) { return state.selected.indexOf(it.index) >= 0; });
        state.selected = allSelected ? [] : list.map(function (it) { return it.index; });
        render();
        break;
      }
      case "row:add": {
        if (!tab.makeRow) break;
        state.data[tab.id].push(tab.makeRow());
        state.selected = [];
        toast("ok", "已新增一行", "改好后点保存生效");
        render();
        break;
      }
      case "row:copy": {
        var src = (state.data[tab.id] || [])[index];
        if (!src) break;
        var copy = deepClone(src);
        if (copy[tab.keyField || "id"]) copy[tab.keyField || "id"] = String(copy[tab.keyField || "id"]) + "_copy";
        (state.data[tab.id] || []).splice(index + 1, 0, copy);
        toast("ok", "已复制", "新行的 id 加了 _copy 后缀，记得改掉");
        render();
        break;
      }
      case "row:del":
        state.pendingConfirm = { scope: "row", index: index, action: "delete" };
        render();
        break;
      case "row:delYes":
        (state.data[tab.id] || []).splice(index, 1);
        state.pendingConfirm = null;
        state.selected = [];
        toast("ok", "已删除该行", "保存后生效");
        render();
        break;
      case "confirm:cancel":
        state.pendingConfirm = null;
        render();
        break;

      case "batch:price":
        state.batchAction = "price"; state.batchValue = "1.2"; state.batchField = (tab.columns.filter(function (c) { return c.valueKey; })[0] || {}).key || "value";
        render();
        break;
      case "batch:rarity": state.batchAction = "rarity"; state.batchValue = "常见"; render(); break;
      case "batch:dist": state.batchAction = "dist"; state.batchValue = "novice:1.0"; render(); break;
      case "batch:delete": state.batchAction = "delete"; render(); break;
      case "batch:apply": applyBatch(); break;
      case "batch:cancel": state.batchAction = null; render(); break;

      case "snapNote:edit": startEdit(index, null, "snapNote"); break;
      case "snap:new": {
        var noteEl = document.getElementById("newSnapNote");
        var note = noteEl ? noteEl.value.trim() : "";
        runSnapshotAction("create", { note: note }).then(function (res) {
          if (res.ok) {
            toast("ok", "已提交新建存档", res.message || (note || "手动存档"));
            if (noteEl) noteEl.value = "";
            refreshSnapshots();
          } else {
            toast("warn", "未真正创建", res.message || "");
            render();
          }
        });
        break;
      }
      case "snap:reload": refreshSnapshots(true); break;
      case "snap:restore": state.pendingConfirm = { scope: "card", index: index, action: "restore" }; render(); break;
      case "snap:restoreYes": snapshotAction("restore", index); break;
      case "snap:delete": state.pendingConfirm = { scope: "card", index: index, action: "delete" }; render(); break;
      case "snap:delYes": snapshotAction("delete", index); break;
      case "snap:download": snapshotAction("download", index); break;
      case "snap:players": {
        // 存档卡片上的快捷入口：切到玩家页的「存档内玩家」模式并选中这份存档
        var target = (state.snapshots || [])[index];
        state.playersMode = "snapshot";
        state.snapshotPick = target ? text(target.name) : "";
        state.goldEdit = null;
        state.goldConfirm = null;
        state.tab = "players";
        try { history.replaceState(null, "", "#players"); } catch (e) { /* 忽略 */ }
        render();
        fetchSnapshotPlayers(state.snapshotPick, true);
        break;
      }

      /* ---- 玩家页（改金币）---- */
      case "p:mode": {
        var mode = el.getAttribute("data-mode") === "snapshot" ? "snapshot" : "live";
        state.playersMode = mode;
        state.goldEdit = null;
        state.goldConfirm = null;
        render();
        if (mode === "snapshot" && state.snapshotPick) fetchSnapshotPlayers(state.snapshotPick, false);
        break;
      }
      case "p:reload":
        if (state.playersMode === "snapshot") fetchSnapshotPlayers(state.snapshotPick, true).then(function () { render(); });
        else fetchPlayers(true).then(function () { render(); });
        break;
      case "p:legacyScan": {
        runLegacyAction("legacy_scan").then(function (r) {
          if (r && !r.ok) toast("warn", "扫描没成功", r.message || "");
          else if (r) toast("ok", "扫描完成", r.message || "");
        });
        break;
      }
      case "p:legacyImport":
        // 写玩家数据，先让站长确认一下（页面内确认，不用浏览器弹窗）
        state.legacyConfirm = true;
        render();
        break;
      case "p:legacyImportNo":
        state.legacyConfirm = false;
        render();
        break;
      case "p:legacyImportYes":
        state.legacyConfirm = false;
        runLegacyAction("legacy_import").then(function (r) {
          if (r && r.ok) toast("ok", "导入完成", r.message || "");
          else toast("err", "导入没成功", (r && r.message) || "");
        });
        break;
      case "p:legacyClose":
        // 收起整块「找回旧数据」（含结果、提示、导入确认）；数据一行都不动
        closeLegacyPanel().then(function (r) {
          if (r && r.ok) toast("ok", "已收起面板", r.message || "老数据一行都没动");
          else toast("warn", "面板已收起", ((r && r.message) || "") + "（刷新后可能还会出现）");
        });
        break;
      case "p:gold": {
        var row = playerRowsNow().filter(function (r) { return r.user_id === el.getAttribute("data-uid"); })[0];
        if (!row) break;
        state.goldConfirm = null;
        state.goldEdit = { user_id: row.user_id, value: row.gold };
        render();
        break;
      }
      case "p:goldInput": break;   // 输入框自身
      case "p:goldApply": {
        var uid = el.getAttribute("data-uid");
        var input = document.querySelector('[data-act="p:goldInput"]');
        var raw = input ? String(input.value).trim() : "";
        var value = Number(raw);
        if (raw === "" || !isFinite(value) || value < 0 || Math.floor(value) !== value) {
          toast("err", "金币要填 0 或正整数", raw || "（空）");
          break;
        }
        if (value > state.playersGoldMax) {
          toast("err", "超出金币上限", "最多 " + fmtNum(state.playersGoldMax));
          break;
        }
        var before = playerRowsNow().filter(function (r) { return r.user_id === uid; })[0];
        state.goldEdit = null;
        state.goldConfirm = {
          user_id: uid, value: value, mode: state.playersMode,
          oldValue: before ? before.gold : 0
        };
        render();
        break;
      }
      case "p:goldCancel":
        state.goldEdit = null;
        state.goldConfirm = null;
        render();
        break;
      case "p:goldYes": {
        var conf = state.goldConfirm;
        if (!conf) break;
        var who = conf.user_id;
        var val = conf.value;
        var oldVal = conf.oldValue;
        var snapName = state.snapshotPick;
        var mode2 = conf.mode;
        state.goldConfirm = null;
        render();
        savePlayerGold(mode2, who, val, snapName).then(function (res) {
          if (res && res.ok) {
            toast("ok", mode2 === "snapshot" ? "已改存档里的金币" : "已改玩家金币",
              who + "：" + fmtNum(oldVal) + " → " + fmtNum(val) +
              (mode2 === "snapshot" ? "（恢复这份存档后生效）" : ""));
            if (mode2 === "snapshot") fetchSnapshotPlayers(snapName, false).then(function () { render(); });
            else fetchPlayers(false).then(function () { render(); });
          } else {
            toast("err", "修改没成功", (res && res.message) || "未知原因");
            render();
          }
        });
        break;
      }

      /* ---- 💬 回复：视图切换 / 聚焦 / 预览 ---- */
      case "rp:view":
        state.replies.view = el.getAttribute("data-view") === "overview" ? "overview" : "cards";
        render();
        break;
      case "rp:focus": {
        var fid = el.getAttribute("data-scene");
        if (!replySceneById(fid)) break;
        state.replies.focus = fid;
        state.replies.previewOpen = true;
        render();
        break;
      }
      case "rp:preview":
        state.replies.previewOpen = !state.replies.previewOpen;
        render();
        break;
      case "rp:group": {
        var gid = el.getAttribute("data-group");
        state.replies.collapsed[gid] = !state.replies.collapsed[gid];
        refreshReplyMain();
        break;
      }
      case "rp:expandAll":
        state.replies.collapsed = {};
        refreshReplyMain();
        break;
      case "rp:collapseAll":
        (state.replies.groups || []).forEach(function (g) { state.replies.collapsed[g.id] = true; });
        refreshReplyMain();
        break;
      case "rp:mode":
        state.replies.chatMode = el.getAttribute("data-mode") === "private" ? "private" : "group";
        render();
        break;
      case "rp:retry":
        // 重读会丢掉没保存的草稿：跟「重新载入」一样要按两次
        if (replyDirtyCount() > 0 &&
            !(state.pendingConfirm && state.pendingConfirm.scope === "replies")) {
          state.pendingConfirm = { scope: "replies", action: "reload" };
          toast("warn", "有未保存的回复改动", "再点一次「↻ 重读场景」会丢弃它们");
          setTimeout(function () {
            if (state.pendingConfirm && state.pendingConfirm.scope === "replies") {
              state.pendingConfirm = null;
            }
          }, 3000);
          break;
        }
        state.pendingConfirm = null;
        loadReplies();
        break;
      case "rp:saveAll":
        saveReplies(null).then(function (res) {
          if (res.ok) toast("ok", "回复配置已保存", res.message);
          else if (res.empty) toast("info", "没有要保存的回复改动", res.message);
          else toast("warn", "回复配置没保存成功", res.message);
          render();
        });
        break;
      case "rp:saveCard": {
        var saveId = el.getAttribute("data-scene");
        saveReplies(saveId).then(function (res) {
          if (res.ok) toast("ok", "这张卡片已保存", res.message);
          else if (res.empty) toast("info", "这张卡片没有改动", res.message);
          else toast("warn", "这张卡片没保存成功", res.message);
          render();
        });
        break;
      }
      case "rp:reset": {
        var resetId = el.getAttribute("data-scene");
        delete state.replies.drafts[resetId];
        var resetScene = replySceneById(resetId);
        state.replies.layoutAllTouched = false;
        toast("info", "已还原这张卡片", resetScene ? resetScene.label : resetId);
        render();
        break;
      }
      case "rp:ph": {
        var phScene = el.getAttribute("data-scene");
        var phName = el.getAttribute("data-name");
        var box = document.querySelector('[data-act="rp:text"][data-scene="' + phScene + '"]');
        var d0 = replySceneDraft(phScene);
        if (box && typeof box.selectionStart === "number") {
          d0.text = insertPlaceholder(box.value, phName, box.selectionStart, box.selectionEnd);
          box.value = d0.text;
          var caret = box.selectionStart + ("{" + phName + "}").length;
          try { box.focus(); box.setSelectionRange(caret, caret); } catch (e) { /* 忽略 */ }
        } else {
          d0.text = insertPlaceholder(d0.text, phName);
        }
        var phSceneObj = replySceneById(phScene);
        d0.textTouched = d0.text !== (phSceneObj ? replyTextBaseline(phSceneObj) : "");
        state.replies.focus = phScene;
        refreshReplyLive(phScene);
        break;
      }

      /* ---- 💬 回复：卡片里的按钮增删改排序 ---- */
      /* 「＋ 加按钮」= 打开选择器（文案 / 指令 / 样式都是现成选项，不用自己写） */
      case "rp:btnAdd": {
        var addId = toText(el.getAttribute("data-scene"));
        state.replies.picker = addId;
        resetNewButtonDraft(addId);
        state.replies.focus = addId;
        // 从「按钮总览」点进来的：直接跳到这个场景的卡片（选择器在卡片里）
        if (el.getAttribute("data-jump") === "card") {
          jumpToSceneCard(addId);
        }
        render();
        var pickSel = document.querySelector('[data-act="rp:newLabel"][data-scene="' + addId + '"]');
        if (pickSel && pickSel.focus) pickSel.focus();
        break;
      }
      /* 选择器里点「加进去」：把选中的文案/指令/样式变成一行普通按钮（格式与手写完全一样） */
      case "rp:btnAddConfirm": {
        var okId = toText(el.getAttribute("data-scene"));
        var added = addPickedButton(okId);
        toast("ok", added.label ? "已加一个按钮" : "已加一个空按钮",
          (added.label || "（还没选文案）") + " → " + added.data);
        render();
        // 没选文案（想自己写）时，把焦点丢到刚加的那一行的文案输入框
        if (!added.label) {
          var boxes = document.querySelectorAll('[data-act="rp:btnLabel"][data-scene="' + okId + '"]');
          if (boxes && boxes.length && boxes[boxes.length - 1].focus) boxes[boxes.length - 1].focus();
        }
        break;
      }
      case "rp:newCancel":
        state.replies.picker = "";
        render();
        break;
      case "rp:newLabelPick":
        replyNewButtonDraft().labelMode = "pick";
        refreshReplyPicker(toText(el.getAttribute("data-scene")));
        break;
      case "rp:newDataPick":
        replyNewButtonDraft().dataMode = "pick";
        refreshReplyPicker(toText(el.getAttribute("data-scene")));
        break;
      case "rp:btnDel": {
        var delId = el.getAttribute("data-scene");
        var delI = Number(el.getAttribute("data-i"));
        var dd = replySceneDraft(delId);
        if (!dd.buttons[delI]) break;
        var gone = dd.buttons.splice(delI, 1)[0];
        dd.buttonsTouched = true;
        state.replies.sel = {};
        state.replies.batch = null;
        state.replies.focus = delId;
        toast("info", "已删掉这个按钮", gone.label || gone.data || "（空按钮）");
        render();
        break;
      }
      case "rp:btnUp":
      case "rp:btnDown": {
        var mvId = el.getAttribute("data-scene");
        var mvI = Number(el.getAttribute("data-i"));
        var md = replySceneDraft(mvId);
        var to = act === "rp:btnUp" ? mvI - 1 : mvI + 1;
        if (to < 0 || to >= md.buttons.length) break;
        var tmp = md.buttons[mvI];
        md.buttons[mvI] = md.buttons[to];
        md.buttons[to] = tmp;
        md.buttonsTouched = true;
        state.replies.sel = {};      // 顺序变了，总览里的勾选不再对应同一行
        state.replies.focus = mvId;
        render();
        break;
      }
      case "rp:goto": {
        jumpToSceneCard(el.getAttribute("data-scene"));
        render();
        break;
      }

      /* ---- 💬 回复：按钮总览的批量操作 ---- */
      case "rp:sel": {
        ev.stopPropagation();
        var selKey = el.getAttribute("data-key");
        state.replies.sel[selKey] = !state.replies.sel[selKey];
        render();
        break;
      }
      case "rp:selAll": {
        var allRows = replyOverviewRows();
        var allOn = allRows.length > 0 && allRows.every(function (x) { return state.replies.sel[x.key]; });
        state.replies.sel = {};
        if (!allOn) allRows.forEach(function (x) { state.replies.sel[x.key] = true; });
        render();
        break;
      }
      case "rp:batch": {
        var kind = el.getAttribute("data-kind");
        state.replies.batch = kind;
        state.replies.batchValue = kind === "prefix"
          ? "/钓鱼"
          : (kind === "style" ? (((state.replies.buttonStyles || [])[0] || {}).value || "default") : "");
        render();
        break;
      }
      case "rp:batchCancel":
        state.replies.batch = null;
        render();
        break;
      case "rp:batchApply": {
        var bk = state.replies.batch;
        var bv = state.replies.batchValue;
        var picked = replyOverviewRows().filter(function (x) { return state.replies.sel[x.key]; });
        if (!picked.length) { toast("warn", "没有勾选按钮", "先在左边勾几个"); break; }
        var touchedScenes = {};
        picked.forEach(function (x) { touchedScenes[x.scene_id] = true; });
        if (bk === "style") {
          picked.forEach(function (x) { x.button.style = toText(bv) || "default"; });
          toast("ok", "已批量改样式", picked.length + " 个按钮 → " + (toText(bv) || "default"));
        } else if (bk === "prefix") {
          if (!toText(bv).trim()) { toast("err", "前缀不能为空", "例如 /钓鱼"); break; }
          picked.forEach(function (x) { x.button.data = applyCommandPrefix(x.button.data, bv); });
          toast("ok", "已批量改指令前缀", picked.length + " 个按钮 → " + bv);
        } else if (bk === "delete") {
          var byScene = {};
          picked.forEach(function (x) {
            byScene[x.scene_id] = byScene[x.scene_id] || [];
            byScene[x.scene_id].push(x.i);
          });
          Object.keys(byScene).forEach(function (sid) {
            var idx = byScene[sid].slice().sort(function (a, b) { return b - a; });
            var d2 = replySceneDraft(sid);
            idx.forEach(function (i2) { d2.buttons.splice(i2, 1); });
          });
          toast("ok", "已批量删除", picked.length + " 个按钮（保存后生效）");
        } else {
          break;
        }
        Object.keys(touchedScenes).forEach(function (sid) {
          replySceneDraft(sid).buttonsTouched = true;
        });
        state.replies.sel = {};
        state.replies.batch = null;
        render();
        break;
      }
    }
  });

  /** 重新拉一次存档列表（新建/删除/改名之后保证显示的是真实状态）。 */
  async function refreshSnapshots(showToast) {
    try {
      var snaps = await loadSnapshots();
      state.snapshots = deepClone((snaps && snaps.snapshots) || []);
      if (snaps && snaps.autoBackup) state.autoBackup = deepClone(snaps.autoBackup);
      state.players = snaps ? snaps.players : state.players;
      state.nextAutoBackup = snaps ? snaps.nextAutoBackup : state.nextAutoBackup;
      if (showToast) toast("info", "已刷新存档列表", "共 " + state.snapshots.length + " 份");
    } catch (e) {
      if (showToast) toast("err", "刷新失败", String((e && e.message) || e));
    }
    render();
  }

  // 输入事件（行内编辑、批量参数、存档改名、自动备份表单）
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;

    if (el.classList && el.classList.contains("cell-input") && el.getAttribute("data-act") === "cell") {
      onCellInput(el);
      return;
    }
    var act = el.getAttribute("data-act");
    if (act === "batchValue") { state.batchValue = el.value; return; }
    if (act === "snapNote:input") {
      var s = state.snapshots[Number(el.getAttribute("data-index"))];
      if (s) s.note = el.value;
      return;
    }
    if (act === "batchField") { state.batchField = el.value; return; }
    /* ---- 💬 回复：文案 / 按钮 / 每行几个 的实时改动 ---- */
    if (act === "rp:text") {
      var textId = el.getAttribute("data-scene");
      var textScene = replySceneById(textId);
      if (!textScene) return;
      var td = replySceneDraft(textId);
      td.text = el.value;
      td.textTouched = el.value !== replyTextBaseline(textScene);
      state.replies.focus = textId;
      if (el.classList) el.classList.toggle("is-bad", templateWarnings(el.value, textScene).length > 0);
      refreshReplyLive(textId);
      return;
    }
    if (act === "rp:btnLabel" || act === "rp:btnData") {
      var bid = el.getAttribute("data-scene");
      var bi = Number(el.getAttribute("data-i"));
      var bd = replySceneDraft(bid);
      if (!bd.buttons[bi]) return;
      if (act === "rp:btnLabel") bd.buttons[bi].label = el.value;
      else bd.buttons[bi].data = el.value;
      bd.buttonsTouched = true;
      state.replies.focus = bid;
      var bErrs = validateReplyButton(bd.buttons[bi], bid);
      var bBad = act === "rp:btnLabel" ? bErrs.label : bErrs.data;
      if (el.classList) el.classList.toggle("is-bad", !!bBad);
      if (bBad) el.title = bBad; else el.removeAttribute("title");
      refreshReplyLive(bid);
      return;
    }
    if (act === "rp:perRow") {
      var prId = el.getAttribute("data-scene");
      var prd = replySceneDraft(prId);
      prd.perRow = el.value;
      prd.layoutTouched = clampPerRow(el.value, 0, replyRowMax()) > 0;
      if (el.classList) el.classList.toggle("is-bad", String(el.value).trim() !== "" && !prd.layoutTouched);
      state.replies.focus = prId;
      refreshReplyLive(prId);
      return;
    }
    if (act === "rp:layoutAll") {
      state.replies.layoutAllDraft = el.value;
      state.replies.layoutAllTouched = clampPerRow(el.value, 0, replyRowMax()) > 0;
      if (el.classList) {
        el.classList.toggle("is-bad", String(el.value).trim() !== "" && !state.replies.layoutAllTouched);
      }
      renderStatusBar();
      renderTabs();
      return;
    }
    if (act === "rp:batchValue") { state.replies.batchValue = el.value; return; }
    if (act === "rp:defaultStyle") {
      state.replies.defaultStyle = toText(el.value) || "default";
      state.replies.styleCfgTouched = true;
      return;
    }
    if (act === "rp:styleMode") {
      state.replies.styleMode = toText(el.value) || "按按钮表";
      state.replies.styleCfgTouched = true;
      return;
    }
    if (act === "rp:emptyScenes") {
      state.replies.emptyScenesDraft = toText(el.value);
      state.replies.styleCfgTouched = true;
      // 只更新状态栏与标签，避免输入时整页重绘导致失焦
      renderStatusBar();
      renderTabs();
      return;
    }
    if (act === "rp:query") {
      state.replies.query = el.value;
      refreshReplyMain();
      return;
    }
    /* 🔎 全部配置键：搜键名只换表格那一块（输入框不失焦、滚动位置不跳） */
    if (act === "key:query") {
      state.keysQuery = el.value;
      refreshKeysMain();
      return;
    }
    /* 💬 回复：加按钮选择器的「✏️ 手动输入」两个框（敲字时只更新草稿与汇总行） */
    if (act === "rp:newLabelText" || act === "rp:newDataText") {
      var nbDraft = replyNewButtonDraft();
      if (act === "rp:newLabelText") nbDraft.label = el.value;
      else nbDraft.data = el.value;
      refreshReplyPickerSummary(toText(el.getAttribute("data-scene")));
      return;
    }
    if (act === "p:goldInput") {
      if (state.goldEdit) state.goldEdit.value = el.value;
      return;
    }
    if (act === "p:snapPick") {   // 顺手支持 input（select 一般走 change）
      state.snapshotPick = el.value;
      return;
    }
    if (act && act.indexOf("auto:") === 0) {
      var field = act.split(":")[1];
      state.autoBackup[field] = el.type === "checkbox" ? el.checked : Number(el.value);
      state.autoBackupDirty = true;
      renderStatusBar();
      renderTabs();
    }
  });

  /* 点「占位符」标签时别让输入框失焦（否则插进去的位置就丢了） */
  document.addEventListener("mousedown", function (ev) {
    var el = ev.target;
    if (el && typeof el.closest === "function" && el.closest('[data-act="rp:ph"]')) {
      ev.preventDefault();
    }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    var act = el.getAttribute && el.getAttribute("data-act");
    if (!act) return;
    if (act === "filter") { state.filter = el.value; state.selected = []; render(); }
    else if (act === "sort") { state.sort = el.value; render(); }
    else if (act === "p:snapPick") {
      state.snapshotPick = el.value;
      state.goldEdit = null;
      state.goldConfirm = null;
      render();
      if (el.value) fetchSnapshotPlayers(el.value, false).then(function () { render(); });
    }
    else if (act === "auto:enable") {
      state.autoBackup.enable = el.checked;
      state.autoBackupDirty = true;
      render();
    }
    /* ---- 💬 回复：按钮样式下拉（select 走 change） ---- */
    else if (act === "rp:btnStyle") {
      var stId = el.getAttribute("data-scene");
      var stI = Number(el.getAttribute("data-i"));
      var sd = replySceneDraft(stId);
      if (!sd.buttons[stI]) return;
      sd.buttons[stI].style = toText(el.value) || "default";
      sd.buttonsTouched = true;
      state.replies.focus = stId;
      refreshReplyLive(stId);
    }
    /* ---- 💬 回复：加按钮选择器（文案 / 指令 / 样式）---- */
    else if (act === "rp:newLabel") {
      var nlDraft = replyNewButtonDraft();
      var nlScene = toText(el.getAttribute("data-scene"));
      if (el.value === "__manual__") nlDraft.labelMode = "manual";
      else nlDraft.label = toText(el.value);
      refreshReplyPicker(nlScene);
    }
    else if (act === "rp:newData") {
      var ndDraft = replyNewButtonDraft();
      var ndScene = toText(el.getAttribute("data-scene"));
      if (el.value === "__manual__") ndDraft.dataMode = "manual";
      else ndDraft.data = toText(el.value);
      refreshReplyPicker(ndScene);
    }
    else if (act === "rp:newStyle") {
      replyNewButtonDraft().style = toText(el.value) || "default";
      refreshReplyPickerSummary(toText(el.getAttribute("data-scene")));
    }
    else if (act === "rp:defaultStyle") {
      state.replies.defaultStyle = toText(el.value) || "default";
      state.replies.styleCfgTouched = true;
    }
    else if (act === "rp:styleMode") {
      state.replies.styleMode = toText(el.value) || "按按钮表";
      state.replies.styleCfgTouched = true;
    }
    else if (act === "rp:batchValue") {
      state.replies.batchValue = el.value;
    }
  });

  // 搜索框（用 input 事件，但它是动态渲染的，单独委托）
  document.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "playerSearch") {
      // 玩家页：回车才去后端查（避免每敲一个字都发一次请求）
      return;
    }
    if (ev.target && ev.target.id === "searchBox") {
      state.query = ev.target.value;
      var panel = document.getElementById("panel");
      var tab = TAB_BY_ID[state.tab];
      if (tab.columns) {
        // 只重绘表格部分，保持搜索框焦点
        var wrap = panel.querySelector(".table-wrap");
        var foot = panel.querySelector(".table-foot");
        var list = visibleRows(tab);
        // 搜索时只换表格内容：滚动位置也得保住，不然每敲一个字就跳回顶部
        var wrapTop = wrap ? wrap.scrollTop : 0;
        if (wrap) wrap.innerHTML = '<table class="grid stack"><thead>' +
          panel.querySelector("table.grid thead").innerHTML + "</thead><tbody>" +
          renderTableBody(tab, list) + "</tbody></table>";
        if (wrap) wrap.scrollTop = wrapTop;
        if (foot) foot.innerHTML = '<button class="btn btn-sm" data-act="row:add"' + (tab.makeRow ? "" : " disabled") + ">＋ 新增一行</button>" +
          '<span class="hint faint">' + (tab.makeRow ? "新行会加在表格末尾" : "此页为只读说明列，仅「当前值」可改") + "</span>" +
          '<span class="spacer"></span><span class="hint faint">筛出 ' + list.length + " 条</span>";
        var chip = panel.querySelector(".stat-chip");
        if (chip) chip.innerHTML = "共 <b>" + (state.data[tab.id] || []).length + "</b> 条（筛出 <b>" + list.length + "</b>）";
      }
    }
  });

  // 行内编辑键盘：Enter 提交、Esc 取消、Tab 跳下一个单元格
  document.addEventListener("keydown", function (ev) {
    var el = ev.target;
    if (el && el.id === "playerSearch" && ev.key === "Enter") {
      // 玩家页搜索：回车才发请求
      ev.preventDefault();
      state.playersQuery = String(el.value || "").trim();
      var keep = el.value;
      fetchPlayers(true).then(function () {
        render();
        var box = document.getElementById("playerSearch");
        if (box) { box.value = keep; box.focus(); }
      });
      return;
    }
    if (el && el.classList && el.classList.contains("cell-input")) {
      // 多行输入框（长列表）：回车是**换行**，要提交按 Ctrl/⌘+回车
      if (el.tagName === "TEXTAREA" && ev.key === "Enter" && !(ev.ctrlKey || ev.metaKey)) {
        return;
      }
      if (ev.key === "Enter") { ev.preventDefault(); commitEdit(); return; }
      if (ev.key === "Escape") { ev.preventDefault(); cancelEdit(); return; }
      if (ev.key === "Tab" && state.editing && state.editing.scope === "cell") {
        ev.preventDefault();
        var tab2 = TAB_BY_ID[state.tab];
        var cols = (tab2.columns || []).filter(function (c) { return c.type !== "readonly"; });
        var keys = cols.map(function (c) { return c.key; });
        var at = keys.indexOf(state.editing.key);
        var nextIndex = state.editing.index;
        var nextKey = keys[(at + (ev.shiftKey ? -1 : 1) + keys.length) % keys.length];
        commitEdit();
        startEdit(nextIndex, nextKey);
        return;
      }
      return;
    }
    if (ev.target && ev.target.id === "snapNote:input" && ev.key === "Enter") { commitEdit(); return; }

    // 全局快捷键
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "s" || ev.key === "S")) {
      ev.preventDefault();
      doSave();
      return;
    }
    if (ev.key === "Escape") {
      if (state.batchAction) { state.batchAction = null; render(); return; }
      if (state.pendingConfirm) { state.pendingConfirm = null; render(); return; }
      if (state.editing) { cancelEdit(); return; }
    }
    if (ev.key === "/" && !ev.ctrlKey && !ev.metaKey) {
      var box = document.getElementById("searchBox");
      if (box && document.activeElement !== box) { ev.preventDefault(); box.focus(); box.select(); }
    }
  });

  // 顶部按钮
  document.getElementById("btnSave").addEventListener("click", doSave);
  document.getElementById("btnReload").addEventListener("click", function () {
    if (dirtyTotal() > 0 && !state.pendingConfirm) {
      state.pendingConfirm = { scope: "global", action: "reload" };
      toast("warn", "有未保存的修改", "再点一次「重新载入」会丢弃它们");
      setTimeout(function () { state.pendingConfirm = null; }, 3000);
      return;
    }
    state.pendingConfirm = null;
    reloadAll();
  });
  document.getElementById("btnExport").addEventListener("click", doExport);
  document.getElementById("btnImport").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (f) doImportFile(f);
    ev.target.value = "";
  });

  window.addEventListener("beforeunload", function (ev) {
    if (dirtyTotal() > 0) {
      ev.preventDefault();
      ev.returnValue = "";
      return "";
    }
  });

  // AstrBot 会推送主题变化等上下文（上下文是异步来的，这里同时负责「迟到补写」）
  if (sdk && typeof sdk.onContext === "function") {
    try {
      sdk.onContext(function (next) {
        if (next && next.isDark !== undefined && next.isDark !== ENV.isDark) {
          applyTheme(next.isDark);
        }
        mergeContext(next);
        paintIdentity();
        render();
      });
    } catch (e) { /* 忽略：老版本 SDK 没有 onContext */ }
  }

  /* ===========================================================================
     17. 启动
     =========================================================================== */
  async function boot() {
    // 等 SDK 把上下文灌进来，再决定用哪个 pluginName 去读配置
    await waitForContext();
    mergeContext(readContext());
    ENV.online = !!sdk;
    paintIdentity();
    try {
      await reloadAll(true);
    } catch (e) {
      // reloadAll 自己已经兜住大部分错误，这里只处理意料之外的
      state.loading = false;
      state.loadError = String((e && e.message) || e);
      render();
      toast("err", "载入失败", state.loadError);
    }
    if (!ENV.online) {
      toast(
        "warn",
        "离线预览：不会真正保存",
        "检测不到 AstrBotPluginPage（桥接 SDK），当前用内置演示数据渲染；" +
        "保存与存档动作只会提示、不会真正执行。"
      );
      return;
    }
    toast("info", "已连接 AstrBot", "保存会直接写回插件配置（同步生效）");
  }

  boot();
})();
</script>
</body>
</html>
