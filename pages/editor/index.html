    html += '<button class="btn btn-sm" data-act="p:reload">↻ 刷新</button>';
    html += "</div>";

    if (state.playersError) {
      html += '<div class="notice"><span class="notice-icon">⛔</span><div>' + esc(state.playersError) + "</div></div>";
    }
    if (!live && state.snapshotPlayersError) {
      html += '<div class="notice"><span class="notice-icon">⛔</span><div>' + esc(state.snapshotPlayersError) + "</div></div>";
    }
    if (state.playersLoading) {
      html += '<div class="empty"><span class="empty-icon">⏳</span><div class="empty-title">正在读取玩家列表…</div></div>';
    } else if (!rows.length) {
      html += '<div class="empty"><span class="empty-icon">👥</span><div class="empty-title">' +
        (live ? "还没有玩家数据" : "还没选存档或这份存档里没有玩家") + "</div>" +
        '<div class="empty-sub">' + (live
          ? "有玩家在群里发过 /钓鱼 之后这里就会出现"
          : "先在上面选一份存档；没有存档就去「💾 存档」页新建一份") + "</div></div>";
    } else {
      html += '<div class="table-wrap"><table class="grid" style="min-width:1000px">';
      html += "<thead><tr>" +
        '<th style="width:130px">玩家 ID</th><th style="width:130px">昵称</th>' +
        '<th class="num" style="width:190px">金币（可改）</th>' +
        '<th class="num" style="width:70px">等级</th><th class="num" style="width:80px">钓获</th>' +
        '<th class="num" style="width:80px">卖出</th><th class="num" style="width:80px">鱼篓</th>' +
        '<th class="num" style="width:80px">水族馆</th>' +
        (live ? '<th style="width:170px">最近保存</th>' : "") +
        '<th style="width:150px"></th></tr></thead><tbody>';
      rows.forEach(function (r) { html += renderPlayerRow(r, live); });
      html += "</tbody></table></div>";
    }

    html += '<div class="table-foot">';
    html += '<span class="hint faint">' +
      (live
        ? "列表按金币从高到低，最多显示 " + esc(String(state.playersList.length)) + " 行；搜索能翻出更早的玩家"
        : "改动写在存档文件里，恢复这份存档后生效（实时数据不受影响）") +
      "</span>";
    html += "</div>";
    html += "</section>";
    return html;
  }

  function renderPlayerRow(r, live) {
    var uid = r.user_id;
    var editing = state.goldEdit && state.goldEdit.user_id === uid;
    var confirming = state.goldConfirm && state.goldConfirm.user_id === uid;
    var goldCell;
    if (editing) {
      goldCell = '<input class="cell-input mono" style="width:110px;display:inline-block" type="number" min="0" ' +
        'step="1" data-act="p:goldInput" value="' + esc(state.goldEdit.value) + '" />';
    } else {
      goldCell = "<b>" + esc(fmtNum(r.gold)) + "</b>";
    }
    var actions;
    if (confirming) {
      actions = '<div class="confirm-strip"><span class="q">改成 ' + esc(fmtNum(state.goldConfirm.value)) + "？</span>" +
        '<button class="btn btn-sm btn-primary" data-act="p:goldYes" data-uid="' + esc(uid) + '">确认修改</button>' +
        '<button class="btn btn-sm" data-act="p:goldCancel">取消</button></div>';
    } else if (editing) {
      actions = '<button class="btn btn-sm btn-primary" data-act="p:goldApply" data-uid="' + esc(uid) + '">下一步</button>' +
        '<button class="btn btn-sm" data-act="p:goldCancel">取消</button>';
    } else {
      actions = '<button class="btn btn-sm" data-act="p:gold" data-uid="' + esc(uid) + '" ' +
        (confirming ? "disabled" : "") + ">✏️ 改金币</button>";
    }
    return "<tr>" +
      '<td class="mono">' + esc(uid) + "</td>" +
      "<td>" + (r.name ? esc(r.name) : '<span class="placeholder">未记录</span>') + "</td>" +
      '<td class="num">' + goldCell + "</td>" +
      '<td class="num">' + esc(r.level) + "</td>" +
      '<td class="num">' + esc(fmtNum(r.caught)) + "</td>" +
      '<td class="num">' + esc(fmtNum(r.sold)) + "</td>" +
      '<td class="num">' + esc(r.fish) + "</td>" +
      '<td class="num">' + esc(r.aquarium) + "</td>" +
      (live ? "<td class=\"faint mono\">" + esc(r.saved_text || "—") + "</td>" : "") +
      "<td>" + actions + "</td>" +
      "</tr>";
  }

  /* ===========================================================================
     10c. 💬 回复：场景卡片 / 按钮总览 / 常驻预览

     数据来自插件注册的 GET「scenes」接口：它把所有「回复场景」按指令分组列出来，
     每个场景带文案模板（占位符 + 示例值）、当前生效的按钮、出厂默认按钮、
     按钮来源（config / inherit / default / none）与每行几个。

     站长改的东西最终写回三份「一行一条、竖线分隔」的配置文本：
       button_defs     场景|按钮文案|点击后发送|样式
       text_overrides  场景|文案模板
       button_layout   场景|每行几个（* 是全局默认）
     所以这一节的模型是「原始文本 + 草稿」：改的时候只动草稿，
     保存时按「跟原文比真的变了没有」只提交变化的那几项（绝不把没改的项写空）。

     这一节前半部分是**不碰 DOM 的纯函数**（测试直接 eval 它们），
     后半部分才是渲染、事件与请求。
     =========================================================================== */

  /** 保存回复配置时用到的三个配置键（顺序即提交顺序） */
  var REPLY_KEYS = ["button_defs", "text_overrides", "button_layout"];
  /**
   * 回复页里的两个**单选设置**（v1.13.0，按钮样式全局设置）。
   * 它们不是「一行一条」的文本表，所以单独走一条通道，不混进 REPLY_KEYS。
   */
  var REPLY_STYLE_KEYS = ["button_style_mode", "button_default_style"];
  /** button_layout 里的「全局默认」行：*|3 */
  var REPLY_LAYOUT_ALL = "*";
  /** QQ 官方按钮一行最多 5 个 */
  var REPLY_ROW_MAX = 5;
  var REPLY_SOURCE_LABEL = { config: "配置", inherit: "继承", default: "默认", none: "无按钮" };
  /** 旧按钮表里的场景名（只用于兜底展示时给个中文名） */
  var REPLY_SCENE_LABEL = {
    cast: "抛竿结果", pull: "咬钩拉线", bag: "背包", location: "钓点", story: "随机插曲"
  };
  var REPLY_DEMO_SAMPLE = "……";

  /** 每行几个按钮：1~max 的整数，其它一律算「没设置」（返回 fallback）。 */
  function clampPerRow(v, fallback, max) {
    var top = Number(max);
    if (!isFinite(top) || top < 1) top = REPLY_ROW_MAX;
    var n = Number(v);
    if (!isFinite(n) || Math.floor(n) !== n || n < 1 || n > top) {
      return fallback === undefined ? 0 : fallback;
    }
    return n;
  }

  /**
   * 插件回来的样式是数字（QQ 键盘的 render_data.style），也可能是 default/primary 字符串。
   *
   * 数字的含义按官网来：**0 = 灰色线框、1 = 蓝色线框**（与插件 ``_calc.BUTTON_STYLE_ALIASES``
   * 一致），其余数字（2~255）原样留着 —— 页面认不出的值不能改写，
   * 否则保存一次就把玩家所有按钮的颜色改掉了。
   */
  function normalizeButtonStyle(v) {
    var s = toText(v).trim();
    if (s === "") return "default";
    if (/^\d+$/.test(s)) {
      var n = Number(s);
      if (n === 0) return "default";
      if (n === 1) return "primary";
      return s;                 // 2~255：页面不认识，原样带走
    }
    var low = s.toLowerCase();
    if (BUTTON_STYLE_ALIASES.indexOf(low) >= 0) {
      return (low === "primary" || low === "主要" || low === "蓝" || low === "blue") ? "primary" : "default";
    }
    return low;   // 其它（例如 2~255 的官方颜色号）原样留着
  }

  /** 插件回来的按钮可能是 ["文案","指令",1]，也可能是 {label,data,style}。 */
  function normalizeReplyButton(raw) {
    var label = "", data = "", style = "default";
    if (Array.isArray(raw)) {
      label = toText(raw[0]);
      data = toText(raw[1]);
      style = normalizeButtonStyle(raw[2]);
    } else if (raw && typeof raw === "object") {
      label = toText(raw.label);
      data = toText(raw.data !== undefined ? raw.data : raw.command);
      style = normalizeButtonStyle(raw.style);
    } else {
      label = toText(raw);
    }
    return { label: label.trim(), data: data.trim(), style: style };
  }

  /** GET scenes 里的一个场景 -> 页面内部模型（字段一律补齐，后面就不用到处判空）。 */
  function normalizeReplyScene(raw, group) {
    var r = raw && typeof raw === "object" ? raw : {};
    var t = r.text && typeof r.text === "object" ? r.text : {};
    var samples = {};
    var rawSamples = t.samples && typeof t.samples === "object" ? t.samples : {};
    Object.keys(rawSamples).forEach(function (k) { samples[k] = toText(rawSamples[k]); });
    var places = Array.isArray(t.placeholders)
      ? t.placeholders.map(function (x) { return toText(x); }).filter(Boolean)
      : Object.keys(samples);
    var source = toText(r.source).trim().toLowerCase();
    var id = toText(r.id).trim().toLowerCase();
    return {
      id: id,
      label: toText(r.label) || id,
      desc: toText(r.desc),
      parent: toText(r.parent).trim().toLowerCase(),
      parent_label: toText(r.parent_label) || toText(r.parent),
      source: REPLY_SOURCE_LABEL[source] ? source : "none",
      per_row: clampPerRow(r.per_row, 0, REPLY_ROW_MAX),
      dynamic_text: !!r.dynamic_text,
      default_buttons: (Array.isArray(r.default_buttons) ? r.default_buttons : []).map(normalizeReplyButton),
      buttons: (Array.isArray(r.buttons) ? r.buttons : []).map(normalizeReplyButton),
      text: {
        template: toText(t.template),
        placeholders: places,
        samples: samples,
        override: toText(t.override),
        preview: toText(t.preview),
        dynamic: t.dynamic === undefined ? !!r.dynamic_text : !!t.dynamic
      },
      group_id: group ? group.id : "",
      group_label: group ? group.label : "",
      group_desc: group ? group.desc : ""
    };
  }

  /** GET scenes 的整个响应 -> {groups, scenes, perRowDefault, buttonStyles}。 */
  function normalizeReplyPayload(res) {
    var r = res && typeof res === "object" ? res : {};
    var groups = (Array.isArray(r.groups) ? r.groups : []).map(function (g, gi) {
      var gg = {
        id: toText(g && g.id) || ("g" + (gi + 1)),
        label: toText(g && g.label) || toText(g && g.id) || ("第 " + (gi + 1) + " 组"),
        desc: toText(g && g.desc),
        scenes: []
      };
      gg.scenes = (Array.isArray(g && g.scenes) ? g.scenes : []).map(function (s) {
        return normalizeReplyScene(s, gg);
      });
      return gg;
    });
    var styles = (Array.isArray(r.button_styles) ? r.button_styles : []).map(function (s) {
      return {
        value: toText(s && s.value),
        label: toText(s && s.label) || toText(s && s.value) || "默认（灰）"
      };
    });
    if (!styles.length) {
      styles = [{ value: "default", label: "默认（灰）" }, { value: "primary", label: "主要（蓝）" }];
    }
    var modes = (Array.isArray(r.button_style_modes) ? r.button_style_modes : []).map(function (m) {
      return {
        value: toText(m && m.value),
        label: toText(m && m.label) || toText(m && m.value)
      };
    }).filter(function (m) { return !!m.value; });
    if (!modes.length) {
      modes = [
        { value: "按按钮表", label: "按按钮表（每行各写各的）" },
        { value: "统一", label: "全部统一（所有按钮一个样式）" }
      ];
    }
    var scenes = [];
    groups.forEach(function (g) { g.scenes.forEach(function (s) { scenes.push(s); }); });
    return {
      transport: toText(r.transport),
      perRowDefault: clampPerRow(r.buttons_per_row_default, 3) || 3,
      perRowMax: clampPerRow(r.buttons_per_row_max, REPLY_ROW_MAX) || REPLY_ROW_MAX,
      buttonStyles: styles,
      // 按钮样式全局设置（v1.13.0）：策略 + 统一样式
      buttonStyleModes: modes,
      buttonStyleMode: toText(r.button_style_mode) || "按按钮表",
      buttonDefaultStyle: toText(r.button_default_style) || "default",
      // 效果键清单（插件给的；空 = 用内置清单）
      effectKeys: Array.isArray(r.effect_keys) ? r.effect_keys : [],
      groups: groups,
      scenes: scenes
    };
  }

  /** 「场景|值」这样的一行（只在第一个竖线处切，值里可以再出现竖线）。 */
  function replyKVLine(line) {
    var s = toText(line);
    var at = s.indexOf(SEP);
    if (at < 0) return null;
    var key = s.slice(0, at).trim();
    if (!key) return null;
    return { key: key, value: s.slice(at + 1).trim() };
  }

  /** 按给定顺序把 {键:值} 排成 [键,值] 列表（未知的键排在后面）。 */
  function serializeReplyLines(map, order) {
    var out = [];
    var seen = {};
    (order || []).forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(map, k) && !seen[k]) {
        seen[k] = 1;
        out.push([k, map[k]]);
      }
    });
    Object.keys(map || {}).forEach(function (k) {
      if (!seen[k]) { seen[k] = 1; out.push([k, map[k]]); }
    });
    return out;
  }

  /* ---- text_overrides：一行一条「场景|文案模板」 ---- */
  function parseTextOverrides(raw) {
    var out = {};
    toText(raw).split("\n").forEach(function (raw2) {
      var s = toText(raw2).trim();
      if (!s || s.charAt(0) === "#") return;
      var kv = replyKVLine(s);
      if (!kv) return;
      out[kv.key.toLowerCase()] = kv.value;
    });
    return out;
  }
  function serializeTextOverrides(map, order) {
    return serializeReplyLines(map || {}, order)
      .filter(function (kv) { return toText(kv[1]).trim() !== ""; })
      .map(function (kv) { return cell(kv[0]) + SEP + cell(kv[1]); })
      .join("\n");
  }

  /* ---- button_layout：一行一条「场景|每行几个」，* 是全局默认 ---- */
  function parseButtonLayout(raw, max) {
    var out = {};
    toText(raw).split("\n").forEach(function (raw2) {
      var s = toText(raw2).trim();
      if (!s || s.charAt(0) === "#") return;
      var kv = replyKVLine(s);
      if (!kv) return;
      var n = clampPerRow(kv.value, 0, max);
      if (!n) return;
      out[kv.key === REPLY_LAYOUT_ALL ? REPLY_LAYOUT_ALL : kv.key.toLowerCase()] = n;
    });
    return out;
  }
  function serializeButtonLayout(map, order, max) {
    var out = [];
    var all = clampPerRow((map || {})[REPLY_LAYOUT_ALL], 0, max);
    if (all) out.push(REPLY_LAYOUT_ALL + SEP + all);
    serializeReplyLines(map || {}, order).forEach(function (kv) {
      if (kv[0] === REPLY_LAYOUT_ALL) return;
      var n = clampPerRow(kv[1], 0, max);
      if (n) out.push(cell(kv[0]) + SEP + n);
    });
    return out.join("\n");
  }

  /**
   * 把「用户改过的场景」合并回原始 button_defs 文本：
   *  - 没改过的行**原样保留**（注释、老格式、别的场景都不动，避免误伤）
   *  - 改过的场景：整段替换成草稿里的按钮（空数组 = 这个场景不再有自己的按钮）
   *  - 原来没有的场景：追加到末尾
   */
  function mergeButtonDefs(originalLines, edits) {
    var edited = edits || {};
    var out = [];
    var done = {};
    (originalLines || []).forEach(function (line) {
      var s = toText(line).trim();
      var scene = "";
      if (s && s.charAt(0) !== "#") {
        var row = null;
        try { row = TABLE_DEFS.buttons.parse(s); } catch (e) { row = null; }
        if (row) scene = row.scene;
      }
      if (scene && Object.prototype.hasOwnProperty.call(edited, scene)) {
        if (done[scene]) return;      // 同一场景的后续行跟着一起被替换掉
        done[scene] = 1;
        (edited[scene] || []).forEach(function (r) {
          out.push(TABLE_DEFS.buttons.serialize(r));
        });
        return;
      }
      out.push(toText(line));
    });
    Object.keys(edited).forEach(function (scene) {
      if (done[scene]) return;
      (edited[scene] || []).forEach(function (r) {
        out.push(TABLE_DEFS.buttons.serialize(r));
      });
    });
    return out;
  }

  /**
   * text_overrides 的合并：
   *  - 没碰过的场景保留原来的覆盖
   *  - 碰过的场景：非空且跟 template 不同才写；与 template 相同 / 空串 = 删掉这条覆盖
   */
  function mergeTextOverrides(originalMap, scenes, drafts) {
    var out = {};
    Object.keys(originalMap || {}).forEach(function (k) { out[k] = originalMap[k]; });
    (scenes || []).forEach(function (s) {
      if (!Object.prototype.hasOwnProperty.call(drafts || {}, s.id)) return;
      var v = toText(drafts[s.id]).trim();
      if (v && v !== toText(s.text && s.text.template)) out[s.id] = v;
      else delete out[s.id];
    });
    return out;
  }

  /** button_layout 的合并：改了才写，空值 / 非法值 = 删掉这一行。 */
  function mergeButtonLayout(originalMap, drafts) {
    var out = {};
    Object.keys(originalMap || {}).forEach(function (k) { out[k] = originalMap[k]; });
    Object.keys(drafts || {}).forEach(function (k) {
      var n = clampPerRow(drafts[k], 0, replyRowMax());
      if (n) out[k] = n; else delete out[k];
    });
    return out;
  }

  /* ---- 文案模板：占位符替换 / 未知占位符判断 ---- */

  /** 模板里出现的占位符名（按出现顺序去重）。 */
  function templatePlaceholders(tpl) {
    var out = [];
    var re = /\{([^{}]+)\}/g;
    var s = toText(tpl);
    var m;
    while ((m = re.exec(s))) {
      if (out.indexOf(m[1]) < 0) out.push(m[1]);
    }
    return out;
  }

  /** 模板里「插件不认识」的占位符 —— declared 是场景声明的清单（插件按它校验）。 */
  function unknownPlaceholders(tpl, samples, declared) {
    var map = samples || {};
    var list = Array.isArray(declared) ? declared.map(toText) : [];
    return templatePlaceholders(tpl).filter(function (n) {
      if (Object.prototype.hasOwnProperty.call(map, n)) return false;
      return list.indexOf(n) < 0;
    });
  }

  /** 场景声明的占位符 ∪ 有示例值的占位符（"插件认识"的集合）。 */
  function knownPlaceholderNames(scene) {
    var t = (scene && scene.text) || {};
    var out = Array.isArray(t.placeholders) ? t.placeholders.map(toText) : [];
    Object.keys(t.samples || {}).forEach(function (k) {
      if (out.indexOf(k) < 0) out.push(k);
    });
    return out;
  }

  /** 用示例值替换已知占位符（没有示例值的保持原样），得到预览用的纯文本。 */
  function renderTemplateText(tpl, samples) {
    var map = samples || {};
    return toText(tpl).replace(/\{([^{}]+)\}/g, function (all, name) {
      return Object.prototype.hasOwnProperty.call(map, name) ? toText(map[name]) : all;
    });
  }

  /**
   * 预览气泡用的 HTML：
   *   有示例值的占位符 -> 标蓝显示示例值
   *   场景声明过、但没有示例值 -> 中性显示 {名字}（插件认它，不算写坏）
   *   谁都不认识 -> 用醒目标记圈出来（这行会被插件忽略）
   */
  function renderTemplateHtml(tpl, samples, declared) {
    var map = samples || {};
    var list = Array.isArray(declared) ? declared.map(toText) : [];
    return toText(tpl).split(/(\{[^{}]+\})/).map(function (piece) {
      var m = /^\{([^{}]+)\}$/.exec(piece);
      if (!m) return esc(piece);
      var name = m[1];
      if (Object.prototype.hasOwnProperty.call(map, name)) {
        return '<span class="rp-sampled" title="占位符 {' + esc(name) + '}">' +
          esc(map[name]) + "</span>";
      }
      if (list.indexOf(name) >= 0) {
        return '<span class="rp-decl" title="占位符 {' + esc(name) +
          "}：插件认，但这里没有示例值，预览里保持原样\">" + esc(piece) + "</span>";
      }
      return '<mark class="rp-ph-bad" title="插件不认识的占位符：{' + esc(name) +
        '}（不会被替换，这行会被插件忽略）">' + esc(piece) + "</mark>";
    }).join("");
  }

  /** 模板体检：哪些占位符不认识、dynamic_text 时代码要的 {原文} 在不在。 */
  function templateIssues(tpl, samples, dynamicText, declared) {
    var names = templatePlaceholders(tpl);
    var unknown = unknownPlaceholders(tpl, samples, declared);
    var hasOriginal = names.indexOf("原文") >= 0;
    return {
      names: names,
      unknown: unknown,
      hasOriginal: hasOriginal,
      missingOriginal: !!dynamicText && !hasOriginal,
      empty: toText(tpl).trim() === ""
    };
  }

  /** 模板体检 -> 中文警告（页面直接显示这几句）。 */
  function templateWarnings(tpl, scene) {
    var s = scene && typeof scene === "object" ? scene : {};
    var samples = (s.text && s.text.samples) || {};
    var declared = knownPlaceholderNames(s);
    var issues = templateIssues(tpl, samples, !!s.dynamic_text, declared);
    var out = [];
    if (issues.empty) out.push("文案是空的：保存后这条回复会没有内容。");
    if (issues.unknown.length) {
      out.push("插件不认识的占位符：" + issues.unknown.join(" / ") +
        "（不会被替换，这一行覆盖会被插件忽略）。这个场景可以用：" +
        (declared.join(" / ") || "（没有声明任何占位符）"));
    }
    if (issues.missingOriginal) {
      out.push("这条回复的文字是代码拼出来的，模板里必须保留 {原文}，否则插件会忽略这次覆盖。");
    }
    return out;
  }

  /** 点击占位符：插到光标处（有选中就替换选中的那段）。 */
  function insertPlaceholder(value, name, start, end) {
    var s = toText(value);
    var token = "{" + toText(name) + "}";
    var a = (start === undefined || start === null || Number(start) < 0)
      ? s.length : Math.min(Number(start), s.length);
    var b = (end === undefined || end === null || Number(end) < a)
      ? a : Math.min(Number(end), s.length);
    return s.slice(0, a) + token + s.slice(b);
  }

  /** 批量改指令前缀：把指令的第一段（/钓鱼）换成新的前缀。 */
  function applyCommandPrefix(data, prefix) {
    var s = toText(data).trim();
    var p = toText(prefix).trim();
    if (!p) return s;
    var m = /^\/\S+/.exec(s);
    if (m) return p + s.slice(m[0].length);
    return s ? (p + " " + s) : p;
  }

  /** 按钮草稿的校验（场景 id 由 scenes 接口说了算，这里只管文案/指令/样式）。 */
  function validateReplyButton(row) {
    var errs = {};
    var r = row || {};
    var label = toText(r.label).trim();
    var data = toText(r.data).trim();
    var style = toText(r.style).trim();
    if (!label) errs.label = "按钮文案不能为空";
    if (!data) errs.data = "要写点击后发送的指令，例如 /钓鱼 背包";
    else if (data.charAt(0) !== "/") errs.data = "指令要以 / 开头，例如 /钓鱼 背包";
    if (style && !isButtonStyle(style)) errs.style = "写 default / primary，或 0-255 的数字";
    return errs;
  }

  /**
   * 预览模型：把「这一条回复」在 QQ 里长什么样算成一个纯对象。
   * 群聊点按钮 = 只把指令填进输入框；单聊点按钮 = 直接发送。
   */
  function replyPreviewModel(scene, opts) {
    var s = scene && typeof scene === "object" ? scene : {};
    var o = opts || {};
    var samples = (s.text && s.text.samples) || {};
    var tpl = o.text === undefined
      ? (toText(s.text && s.text.override) || toText(s.text && s.text.template))
      : toText(o.text);
    var buttons = (Array.isArray(o.buttons) ? o.buttons : (s.buttons || [])).map(normalizeReplyButton);
    var mode = o.mode === "private" ? "private" : "group";
    var perRow = clampPerRow(o.perRow, 0) || clampPerRow(o.perRowDefault, 0) ||
      clampPerRow(s.per_row, 0) || 3;
    return {
      sceneId: toText(s.id),
      sceneLabel: toText(s.label),
      mode: mode,
      modeLabel: mode === "group" ? "群聊" : "单聊",
      chatName: mode === "group" ? "群聊 · 示例群聊" : "单聊 · 钓鱼佬",
      nick: mode === "group" ? "钓鱼佬" : "机器人",
      hint: mode === "group"
        ? "群聊：点按钮只会把指令填进输入框，不会自动发送（还得按一次发送）"
        : "单聊：点按钮会直接把指令发出去",
      perRow: perRow,
      text: renderTemplateText(tpl, samples),
      textHtml: renderTemplateHtml(tpl, samples, knownPlaceholderNames(s)),
      buttons: buttons,
      warnings: templateWarnings(tpl, s)
    };
  }

  /** 预览模型 -> HTML（昵称 + 气泡 + 按钮网格 + 群聊/单聊提示）。 */
  function renderReplyPreview(model) {
    var m = model || {};
    var mode = m.mode === "private" ? "private" : "group";
    var buttons = m.buttons || [];
    var cols = clampPerRow(m.perRow, 3) || 3;
    var html = '<div class="rp-phone">';
    html += '<div class="rp-phone-head">' +
      "<span>" + (mode === "group" ? "👥" : "👤") + " " + esc(m.modeLabel || (mode === "group" ? "群聊" : "单聊")) + "</span>" +
      '<span class="faint">' + esc(m.chatName || "") + "</span>" +
      '<span class="spacer"></span><span class="faint">实时预览</span></div>';
    html += '<div class="rp-msg"><div class="rp-avatar">🎣</div><div class="rp-msg-body">' +
      '<div class="rp-nick">' + esc(m.nick || "机器人") + "</div>" +
      '<div class="rp-bubble">' + (m.textHtml || "") + "</div>";
    if (buttons.length) {
      html += '<div class="rp-grid" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' +
        buttons.map(function (b) {
          var bad = Object.keys(validateReplyButton(b)).length > 0;
          return '<div class="rp-btn' + (b.style === "primary" ? " is-primary" : "") +
            (bad ? " is-bad" : "") + '" title="' + esc(b.data) + '">' + esc(b.label) + "</div>";
        }).join("") + "</div>";
    } else {
      html += '<div class="rp-hint">这条回复下面没有任何按钮</div>';
    }
    html += '<div class="rp-hint">' + esc(m.hint || "") + "</div>";
    html += "</div></div></div>";
    return html;
  }

  /* ---- 场景 / 草稿的取用（改的都先落在 state.replies.drafts 里） ---- */
  function replySceneById(id) {
    var list = state.replies.scenes || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  /** 场景文案的「载入时基线」：有覆盖用覆盖，否则用模板。 */
  function replyTextBaseline(scene) {
    return toText(scene && scene.text && scene.text.override) ||
      toText(scene && scene.text && scene.text.template);
  }

  function replySceneDraft(id) {
    var map = state.replies.drafts;
    if (!map[id]) {
      var s = replySceneById(id);
      map[id] = {
        text: s ? replyTextBaseline(s) : "",
        buttons: s ? s.buttons.map(function (b) {
          return { label: b.label, data: b.data, style: b.style };
        }) : [],
        perRow: "",
        textTouched: false,
        buttonsTouched: false,
        layoutTouched: false
      };
    }
    return map[id];
  }

  /** 全局默认「每行几个」：草稿优先，其次配置里的 *，最后插件给的默认值。 */
  function replyGlobalPerRow() {
    if (state.replies.layoutAllTouched) {
      return clampPerRow(state.replies.layoutAllDraft, 0, replyRowMax());
    }
    return clampPerRow((state.replies.originalLayout || {})[REPLY_LAYOUT_ALL], 0, replyRowMax());
  }

  /** 插件说的「一行最多几个」（接口给 buttons_per_row_max，没给就按 5）。 */
  function replyRowMax() {
    var n = Number(state.replies.perRowMax);
    return (isFinite(n) && n >= 1 && n <= 99) ? Math.floor(n) : REPLY_ROW_MAX;
  }

  /** 某个场景实际用几个一行：场景覆盖 > 全局 > 插件给这个场景的默认 > 兜底 3。 */
  function replyEffectivePerRow(scene) {
    var d = scene ? state.replies.drafts[scene.id] : null;
    var max = replyRowMax();
    if (d && d.layoutTouched) {
      var n = clampPerRow(d.perRow, 0, max);
      if (n) return n;
    }
    var own = clampPerRow((state.replies.originalLayout || {})[scene ? scene.id : ""], 0, max);
    var sceneRow = clampPerRow((state.replies.sceneRow || {})[scene ? scene.id : ""], 0, max);
    return own || replyGlobalPerRow() || sceneRow || state.replies.perRowDefault || 3;
  }

  /** 有未保存改动的场景数（文案 / 按钮 / 每行几个 各算一处）。 */
  function replyDirtyCount() {
    var n = 0;
    var drafts = state.replies.drafts || {};
    Object.keys(drafts).forEach(function (id) {
      var d = drafts[id];
      if (d.buttonsTouched) n++;
      if (d.textTouched) n++;
      if (d.layoutTouched) n++;
    });
    if (state.replies.layoutAllTouched) n++;
    if (state.replies.styleCfgTouched) n++;   // 全局样式设置（v1.13.0）
    return n;
  }

  /** 草稿里填得不完整的按钮（保存时会被跳过，页面上要说清楚）。 */
  function replyBadButtons(buttons) {
    return (buttons || []).filter(function (b) {
      return Object.keys(validateReplyButton(b)).length > 0;
    });
  }

  function replySelKey(sceneId, i) { return sceneId + "#" + i; }
  function replySelCount() {
    var sel = state.replies.sel || {};
    return Object.keys(sel).filter(function (k) { return !!sel[k]; }).length;
  }

  /** 按钮总览的行（跨全部场景，顺序 = 场景顺序 + 按钮顺序）。 */
  function replyOverviewRows() {
    var rows = [];
    (state.replies.scenes || []).forEach(function (s) {
      replySceneDraft(s.id).buttons.forEach(function (b, i) {
        rows.push({
          key: replySelKey(s.id, i), scene_id: s.id, scene_label: s.label,
          source: s.source, i: i, button: b
        });
      });
    });
    return rows;
  }

  /** 场景搜索：id / 名称 / 说明 / 父场景 / 分组都能搜（154 个场景时不然找不着）。 */
  function replyFilterScenes(scenes, query) {
    var q = toText(query).trim().toLowerCase();
    var list = (scenes || []).slice();
    if (!q) return list;
    return list.filter(function (s) {
      return [s.id, s.label, s.desc, s.parent_label, s.group_label]
        .join(" ").toLowerCase().indexOf(q) >= 0;
    });
  }

  /** 卡片视图要显示的分组（按搜索词过滤，空分组不显示）。 */
  function replyVisibleGroups() {
    var q = state.replies.query;
    return (state.replies.groups || []).map(function (g) {
      return { group: g, scenes: replyFilterScenes(g.scenes, q) };
    }).filter(function (item) { return item.scenes.length > 0; });
  }

  /** 这次要提交哪几个配置键（跟着「碰过的场景」走，没碰的绝不写）。 */
  function replyTouchedKeys(scope) {
    var keys = {};
    var drafts = state.replies.drafts || {};
    Object.keys(drafts).forEach(function (id) {
      if (scope && id !== scope) return;
      var d = drafts[id];
      if (d.buttonsTouched) keys.button_defs = true;
      if (d.textTouched) keys.text_overrides = true;
      if (d.layoutTouched) keys.button_layout = true;
    });
    if (!scope && state.replies.layoutAllTouched) keys.button_layout = true;
    return keys;
  }

  /** 用当前草稿算出三份配置文本（不改任何状态，纯计算）。 */
  function replyTextsNow() {
    var r = state.replies;
    var scenes = r.scenes || [];
    var order = scenes.map(function (s) { return s.id; });
    var edits = {};
    var textDrafts = {};
    var layoutDrafts = {};
    scenes.forEach(function (s) {
      var d = r.drafts[s.id];
      if (!d) return;
      if (d.buttonsTouched) {
        edits[s.id] = d.buttons.filter(function (b) {
          return toText(b.label).trim() !== "" && toText(b.data).trim() !== "";
        }).map(function (b) {
          return { scene: s.id, label: b.label, data: b.data, style: toText(b.style) || "default" };
        });
      }
      if (d.textTouched) textDrafts[s.id] = d.text;
      if (d.layoutTouched) layoutDrafts[s.id] = d.perRow;
    });
    if (r.layoutAllTouched) layoutDrafts[REPLY_LAYOUT_ALL] = r.layoutAllDraft;

    var merged = mergeButtonDefs(r.originalLines || [], edits);
    var overrides = mergeTextOverrides(r.originalOverrides || {}, scenes, textDrafts);
    var layout = mergeButtonLayout(r.originalLayout || {}, layoutDrafts);
    return {
      texts: {
        button_defs: merged.join("\n"),
        text_overrides: serializeTextOverrides(overrides, order),
        button_layout: serializeButtonLayout(layout, order, replyRowMax())
      },
      merged: merged,
      overrides: overrides,
      layout: layout
    };
  }

  /** 提交用的 payload：只有真的变了的那几项（scope 为空 = 整页保存）。 */
  function replyPayloadFor(scope) {
    var keys = replyTouchedKeys(scope);
    var now = replyTextsNow();
    var payload = {};
    REPLY_KEYS.forEach(function (k) {
      if (keys[k]) payload[k] = now.texts[k];
    });
    // 全局样式设置：改过就一起提交（和场景无关，保存任何一张卡片都带上）
    if (state.replies.styleCfgTouched && !state.replies.readonly) {
      payload.button_style_mode = toText(state.replies.styleMode) || "按按钮表";
      payload.button_default_style = toText(state.replies.defaultStyle) || "default";
    }
    return payload;
  }

  /** 把合并后的 button_defs 文本同步进「🔘 按钮（原始文本）」那张表，免得两条写入通道打架。 */
  function applyButtonsTextToTable(t) {
    var rows = [];
    toText(t).split("\n").forEach(function (line) {
      var s = toText(line).trim();
      if (!s || s.charAt(0) === "#") return;
      var row = null;
      try { row = TABLE_DEFS.buttons.parse(s); } catch (e) { row = null; }
      if (row) rows.push(row);
    });
    state.data.buttons = rows;
    var map = {};
    rows.forEach(function (row) {
      map[rowKey(TAB_BY_ID.buttons, row)] = JSON.stringify(row);
    });
    state.originals.buttons = map;
  }

  /** 保存成功后：把草稿的「已改」标记清掉，并把这次写出去的文本当成新基线。 */
  function markRepliesSaved(payload) {
    var r = state.replies;
    REPLY_KEYS.forEach(function (k) {
      if (Object.prototype.hasOwnProperty.call(payload || {}, k)) r.original[k] = payload[k];
    });
    r.originalLines = toText(r.original.button_defs).split("\n");
    r.originalOverrides = parseTextOverrides(r.original.text_overrides);
    r.originalLayout = parseButtonLayout(r.original.button_layout, replyRowMax());
    Object.keys(r.drafts || {}).forEach(function (id) {
      var d = r.drafts[id];
      d.textTouched = false;
      d.buttonsTouched = false;
      d.layoutTouched = false;
      d.perRow = "";
    });
    r.layoutAllTouched = false;
    r.layoutAllDraft = "";
    // 两个样式设置保存成功后：清脏标记，并把这次写出去的值当成新基线
    var wroteStyle = REPLY_STYLE_KEYS.some(function (k) {
      return Object.prototype.hasOwnProperty.call(payload || {}, k);
    });
    if (wroteStyle) {
      r.styleMode = toText(r.styleMode) || "按按钮表";
      r.defaultStyle = toText(r.defaultStyle) || "default";
      r.originalStyle = { mode: r.styleMode, style: r.defaultStyle };
      r.styleCfgTouched = false;
    }
    applyButtonsTextToTable(r.original.button_defs);
  }

  /** 端点半读不到时的兜底：拿已有 config 里的 button_defs 拼一份「只读场景」。 */
  function replyFallbackPayload() {
    var scenes = [];
    var byScene = {};
    (state.data.buttons || []).forEach(function (row) {
      var sid = toText(row.scene).trim().toLowerCase();
      if (!sid) return;
      if (!byScene[sid]) {
        byScene[sid] = {
          id: sid,
          label: REPLY_SCENE_LABEL[sid] || sid,
          desc: "来自配置文件 button_defs（只读）",
          parent: "", parent_label: "", source: "config",
          per_row: 0, dynamic_text: true, default_buttons: [], buttons: [],
          text: {
            template: "{原文}", placeholders: ["原文"],
            samples: { "原文": REPLY_DEMO_SAMPLE },
            override: "", preview: REPLY_DEMO_SAMPLE, dynamic: true
          }
        };
        scenes.push(byScene[sid]);
      }
      byScene[sid].buttons.push({
        label: row.label, data: row.data, style: normalizeButtonStyle(row.style)
      });
    });
    return normalizeReplyPayload({
      transport: "config",
      buttons_per_row_default: 3,
      groups: [{
        id: "config",
        label: "📄 配置里的按钮（只读）",
        desc: "scenes 接口读不到，就先把 button_defs 里的行列出来",
        scenes: scenes
      }]
    });
  }

  /** 读回复场景：GET scenes；读不到就用 config 里的 button_defs 只读兜底（绝不白屏）。 */
  async function loadReplies() {
    var r = state.replies;
    r.loading = true;
    r.error = "";
    r.readonly = false;
    r.source = "";
    r.drafts = {};
    r.sel = {};
    r.batch = null;
    r.batchValue = "";
    r.focus = "";
    r.query = "";
    r.collapsed = {};
    r.layoutAllTouched = false;
    r.layoutAllDraft = "";
    if (state.tab === "replies") render();

    var payload = null;
    if (!ENV.online) {
      payload = normalizeReplyPayload(DEMO.replies);
      r.source = "demo";
    } else {
      try {
        var res = await bridgeRequest("get", "scenes", {});
        if (!res || typeof res !== "object" || !Array.isArray(res.groups)) {
          throw new Error("scenes 接口没回 groups（插件端可能还没上线这个路由）");
        }
        payload = normalizeReplyPayload(res);
        r.source = payload.transport || "plugin-api";
      } catch (e) {
        r.error = describeError(e, "scenes");
        payload = replyFallbackPayload();
        r.source = "config";
        r.readonly = true;
      }
    }
    r.groups = payload.groups;
    r.scenes = payload.scenes;
    r.perRowDefault = payload.perRowDefault;
    r.perRowMax = payload.perRowMax;
    r.buttonStyles = payload.buttonStyles;
    r.styleModes = payload.buttonStyleModes || [];
    r.styleMode = payload.buttonStyleMode || "按按钮表";
    r.defaultStyle = payload.buttonDefaultStyle || "default";
    r.originalStyle = { mode: r.styleMode, style: r.defaultStyle };
    r.styleCfgTouched = false;
    applyEffectKeys(payload.effectKeys);   // 效果清单也从插件读（不再写死）

    /* 原始三份文本：保存时用来判断「哪几项真的变了」 */
    var original = { button_defs: "", text_overrides: "", button_layout: "" };
    if (ENV.online) {
      try {
        var raw = await fetchRawConfig();
        REPLY_KEYS.forEach(function (k) { original[k] = toText(raw[k]); });
      } catch (e) { /* 读不到原始文本也不影响看和改，下面的基线用本地表格兜底 */ }
    }
    if (!original.button_defs) {
      original.button_defs = (state.data.buttons || []).map(function (row) {
        return TABLE_DEFS.buttons.serialize(row);
      }).join("\n");
    }
    r.original = original;
    r.originalLines = toText(original.button_defs).split("\n");
    r.originalOverrides = parseTextOverrides(original.text_overrides);
    r.originalLayout = parseButtonLayout(original.button_layout, replyRowMax());
    /* 插件 payload 里已经生效的覆盖也并进基线：没改就不会被重写 */
    r.sceneRow = {};
    r.scenes.forEach(function (s) {
      if (s.text.override && !r.originalOverrides[s.id]) r.originalOverrides[s.id] = s.text.override;
      /* 每个场景「每行几个」只用于显示兜底，不写回配置（没改就不该多出配置行） */
      r.sceneRow[s.id] = clampPerRow(s.per_row, 0, replyRowMax());
    });

    r.focus = r.scenes.length ? r.scenes[0].id : "";
    r.loaded = true;
    r.loading = false;
    render();
  }

  /**
   * 保存回复配置：POST config {action:"save_replies", payload:{...}}。
   * payload 里只放真的改过的键；scope 非空 = 只保存某一张卡片。
   */
  async function saveReplies(scope) {
    var payload = replyPayloadFor(scope);
    if (!Object.keys(payload).length) {
      return { ok: false, empty: true, message: "这张卡片没有改动，不用保存" };
    }
    if (!ENV.online) {
      return { ok: false, message: "离线预览：不会真正保存回复配置" };
    }
    if (state.replies.readonly) {
      return { ok: false, message: "场景接口读不到，现在是只读模式（先点「↻ 重读场景」）" };
    }
    try {
      var res = await bridgeRequest("post", "config", { action: "save_replies", payload: payload });
      if (res && typeof res === "object" && typeof res.editor_status === "string") {
        try {
          var fresh = parseEditorStatus({ editor_status: res.editor_status });
          if (fresh) { pendingStatus = fresh; lastStatus = fresh; }
        } catch (e) { /* 状态解析失败不影响「已保存」这个结论 */ }
      }
      var bad = res && typeof res === "object" && (res.ok === false || res.status === "error");
      if (bad) {
        return {
          ok: false,
          message: toText(res.message) || "插件没有接受这次保存",
          detail: res
        };
      }
      var wrote = REPLY_KEYS.filter(function (k) {
        return Object.prototype.hasOwnProperty.call(payload, k);
      }).join(" / ");
      markRepliesSaved(payload);
      return {
        ok: true,
        message: toText(res && res.message) ||
          ("已写回 " + wrote + "（" + Object.keys(payload).length + " 项）"),
        wrote: wrote,
        detail: res
      };
    } catch (e) {
      return { ok: false, message: describeError(e, "config") };
    }
  }

  /* ---- 渲染：场景卡片 / 按钮总览 / 常驻预览 ---- */
  function replyWarnHtml(warnings, danger) {
    if (!warnings || !warnings.length) return "";
    return '<div class="rp-warn ' + (danger ? "is-danger" : "is-warn") + '"><ul>' +
      warnings.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul></div>";
  }

  /** 占位符标签：点一下就插到光标处。 */
  function renderReplyPlaceholderChips(scene, tpl) {
    var samples = (scene.text && scene.text.samples) || {};
    var declared = (scene.text && scene.text.placeholders) || [];
    var names = knownPlaceholderNames(scene);
    unknownPlaceholders(tpl, samples, declared).forEach(function (n) {
      if (names.indexOf(n) < 0) names.push(n);
    });
    if (!names.length) return '<span class="hint faint">这个场景没有可用占位符</span>';
    return names.map(function (n) {
      var hasSample = Object.prototype.hasOwnProperty.call(samples, n);
      var known = declared.indexOf(n) >= 0 || hasSample;
      var title = hasSample
        ? "点一下插到光标处；示例值：" + toText(samples[n])
        : (known ? "点一下插到光标处；插件认这个占位符，但接口没给示例值"
                 : "插件不认识这个占位符（这一行覆盖会被忽略）");
      return '<span class="rp-ph' + (known ? "" : " is-bad") + '" data-act="rp:ph" data-scene="' +
        esc(scene.id) + '" data-name="' + esc(n) + '" title="' + esc(title) + '">' +
        esc("{" + n + "}") + "</span>";
    }).join(" ");
  }

  /** 样式策略下拉（按按钮表 / 统一）；选项优先用插件给的。 */
  function replyStyleModeOptions(current) {
    var list = (state.replies.styleModes || []).slice();
    if (!list.length) {
      list = [
        { value: "按按钮表", label: "按按钮表（每行各写各的）" },
        { value: "统一", label: "全部统一（所有按钮一个样式）" }
      ];
    }
    var cur = toText(current) || "按按钮表";
    return list.map(function (m) {
      return '<option value="' + esc(m.value) + '"' + (m.value === cur ? " selected" : "") +
        ">" + esc(m.label) + "</option>";
    }).join("");
  }

  function replyStyleOptions(current) {
    var list = (state.replies.buttonStyles || []).slice();
    var cur = toText(current);
    if (!list.some(function (s) { return s.value === cur; })) {
      list.push({ value: cur, label: cur === "" ? "默认(灰)" : cur });
    }
    return list.map(function (s) {
      return '<option value="' + esc(s.value) + '"' + (s.value === cur ? " selected" : "") +
        ">" + esc(s.label) + "</option>";
    }).join("");
  }

  function replySourceHint(scene) {
    var src = scene.source;
    if (src === "config") return "这个场景的按钮目前来自配置文件 button_defs（你配过的）";
    if (src === "inherit") {
      return "这个场景没配按钮，现在借用父场景「" + (scene.parent_label || scene.parent) +
        "」的按钮；在这里改一下就会变成它自己的配置";
    }
    if (src === "default") return "这个场景没配按钮，现在用的是插件出厂默认按钮；改一下就会写进配置";
    return "这个场景目前没有任何按钮（也可以用默认按钮，如果插件提供了的话）";
  }

  function renderReplyButtonRow(sceneId, b, i, total) {
    var errs = validateReplyButton(b);
    var ro = state.replies.readonly;
    var sid = esc(sceneId);
    return '<div class="rp-btn-edit">' +
      '<span class="idx">' + (i + 1) + "</span>" +
      '<input class="cell-input' + (errs.label ? " is-bad" : "") +
      '" style="flex:1 1 140px;min-width:120px" data-act="rp:btnLabel" data-scene="' + sid +
      '" data-i="' + i + '" value="' + esc(b.label) + '" placeholder="按钮文案"' +
      (errs.label ? ' title="' + esc(errs.label) + '"' : "") + (ro ? " disabled" : "") + " />" +
      '<span class="arrow-to">→</span>' +
      '<input class="cell-input mono' + (errs.data ? " is-bad" : "") +
      '" style="flex:1 1 170px;min-width:140px" data-act="rp:btnData" data-scene="' + sid +
      '" data-i="' + i + '" value="' + esc(b.data) + '" placeholder="/钓鱼 背包"' +
      (errs.data ? ' title="' + esc(errs.data) + '"' : "") + (ro ? " disabled" : "") + " />" +
      '<select class="cell-input" data-act="rp:btnStyle" data-scene="' + sid + '" data-i="' + i +
      '"' + (ro ? " disabled" : "") + ">" + replyStyleOptions(b.style) + "</select>" +
      (ro ? "" : '<span class="rp-move">' +
        '<button class="btn btn-sm btn-icon btn-ghost" data-act="rp:btnUp" data-scene="' + sid +
        '" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' title="上移">↑</button>' +
        '<button class="btn btn-sm btn-icon btn-ghost" data-act="rp:btnDown" data-scene="' + sid +
        '" data-i="' + i + '"' + (i === total - 1 ? " disabled" : "") + ' title="下移">↓</button>' +
        '<button class="btn btn-sm btn-icon btn-ghost" data-act="rp:btnDel" data-scene="' + sid +
        '" data-i="' + i + '" title="删除这个按钮">🗑</button>' +
        "</span>") +
      "</div>";
  }

  function renderReplyCard(scene) {
    var r = state.replies;
    var d = replySceneDraft(scene.id);
    var text = d.text;
    var warnings = templateWarnings(text, scene);
    var bad = replyBadButtons(d.buttons);
    var src = scene.source || "none";
    var srcText = "来源：" + (REPLY_SOURCE_LABEL[src] || src) +
      (src === "inherit" && (scene.parent_label || scene.parent)
        ? "自 " + (scene.parent_label || scene.parent) : "");
    var ownRow = d.layoutTouched ? d.perRow : (r.originalLayout[scene.id] || "");
    var eff = replyEffectivePerRow(scene);

    var html = '<article class="rp-card' + (r.focus === scene.id ? " is-focus" : "") +
      '" data-scene="' + esc(scene.id) + '">';
    html += '<div class="rp-card-head" data-act="rp:focus" data-scene="' + esc(scene.id) + '">' +
      '<span class="rp-card-title">' + esc(scene.label) + "</span>" +
      '<span class="rp-card-id">' + esc(scene.id) + "</span>" +
      '<span class="rp-src src-' + esc(src) + '" title="' + esc(replySourceHint(scene)) + '">' +
      esc(srcText) + "</span>" +
      '<span class="spacer"></span>' +
      '<span class="hint faint">' + (d.buttons.length ? d.buttons.length + " 个按钮" : "没有按钮") + "</span>" +
      (r.readonly ? "" :
        '<button class="btn btn-sm" data-act="rp:saveCard" data-scene="' + esc(scene.id) +
        '" title="只把这个场景的改动写回插件">💾 只保存这张</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="rp:reset" data-scene="' + esc(scene.id) +
        '" title="把这张卡片改回载入时的样子">↺ 还原</button>') +
      "</div>";

    html += '<div class="rp-body">';
    html += '<div class="rp-row"><span class="rp-label">文案模板</span>' +
      '<span class="hint faint">' + esc(scene.desc || "") +
      (scene.dynamic_text ? "　（这条回复由代码拼装）" : "　（模板就是完整文案，可任意改写）") + "</span></div>";
    html += '<textarea class="rp-text' + (warnings.length ? " is-bad" : "") + '" data-act="rp:text" data-scene="' +
      esc(scene.id) + '" spellcheck="false" rows="2" placeholder="这条回复要说的话…"' +
      (r.readonly ? " readonly" : "") + ">" + esc(text) + "</textarea>";
    html += '<div class="rp-row"><span class="rp-label">可用占位符</span>' +
      renderReplyPlaceholderChips(scene, text) + "</div>";
    html += '<div id="rpWarn-' + esc(scene.id) + '">' + replyWarnHtml(warnings, false) + "</div>";

    html += '<div class="rp-row"><span class="rp-label">按钮</span>' +
      '<span class="hint faint">文案 → 点击后发送的指令；顺序就是 QQ 里的显示顺序</span></div>';
    if (!d.buttons.length) {
      html += '<div class="hint faint">这个场景' +
        (src === "none" ? "目前没有任何按钮" : "现在用的是「" + esc(REPLY_SOURCE_LABEL[src] || src) + "」的按钮") +
        "，点下面的「＋ 加按钮」给它配一排。</div>";
    }
    html += '<div class="rp-btns-edit">' + d.buttons.map(function (b, i) {
      return renderReplyButtonRow(scene.id, b, i, d.buttons.length);
    }).join("") + "</div>";
    html += '<div class="rp-row">' +
      (r.readonly ? "" :
        '<button class="btn btn-sm" data-act="rp:btnAdd" data-scene="' + esc(scene.id) + '">＋ 加按钮</button>') +
      '<span class="divider"></span><span class="hint">每行</span>' +
      '<input class="cell-input" style="width:58px" type="number" min="1" max="' + replyRowMax() +
      '" data-act="rp:perRow" data-scene="' + esc(scene.id) + '" value="' + esc(ownRow) +
      '" placeholder="' + esc(String(eff)) + '" title="这个场景每行摆几个按钮；留空 = 用全局默认"' +
      (r.readonly ? " disabled" : "") + " />" +
      '<span class="hint">个（留空 = 现在生效的 <b>' + esc(String(eff)) +
      "</b> 个；这里只写这个场景的覆盖行 " + '<span class="mono">' + esc(scene.id) + "|N</span>）</span>" +
      (bad.length ? '<span class="hint" style="color:var(--danger)">有 ' + bad.length +
        " 个按钮缺文案或指令，保存时会跳过</span>" : "") +
      "</div>";
    html += "</div></article>";
    return html;
  }

  /** 预览模型（草稿 -> 预览）：卡片里改什么，预览就跟着变。 */
  function previewModelFor(scene) {
    var d = scene ? state.replies.drafts[scene.id] : null;
    return replyPreviewModel(scene, {
      text: d ? d.text : undefined,
      buttons: d ? d.buttons : (scene ? scene.buttons : []),
      mode: state.replies.chatMode,
      perRow: replyEffectivePerRow(scene)
    });
  }

  function renderReplyPreviewPanel() {
    var r = state.replies;
    var scene = replySceneById(r.focus) || r.scenes[0] || null;
    var html = '<aside class="rp-side"><section class="card">';
    html += '<div class="card-head"><h2>👁️ 预览</h2><span class="spacer"></span>' +
      '<button class="btn btn-sm btn-ghost" data-act="rp:preview">' +
      (r.previewOpen ? "收起" : "展开") + "</button></div>";
    if (!r.previewOpen) {
      return html + '<div class="notice" style="margin:10px"><span class="notice-icon">👁️</span>' +
        "<div>预览已收起：点右上角「展开」看这条回复在 QQ 里的样子。</div></div></section></aside>";
    }
    if (!scene) {
      return html + '<div class="empty"><span class="empty-icon">🫧</span>' +
        '<div class="empty-title">还没有可预览的场景</div>' +
        '<div class="empty-sub">场景接口通了之后这里会跟着卡片实时更新</div></div></section></aside>';
    }
    html += '<div class="toolbar" style="border-bottom:1px solid var(--border)">' +
      '<button class="btn btn-sm' + (r.chatMode === "group" ? " btn-primary" : "") +
      '" data-act="rp:mode" data-mode="group">👥 群聊</button>' +
      '<button class="btn btn-sm' + (r.chatMode === "private" ? " btn-primary" : "") +
      '" data-act="rp:mode" data-mode="private">👤 单聊</button>' +
      '<span class="spacer" style="margin-left:auto"></span>' +
      '<span class="hint faint mono">' + esc(scene.id) + "</span></div>";
    html += '<div id="rpPreviewBody" style="padding:10px">' +
      renderReplyPreview(previewModelFor(scene)) + "</div>";
    html += '<div id="rpPreviewWarn" style="padding:0 10px 10px">' +
      replyWarnHtml(templateWarnings(replySceneDraft(scene.id).text, scene), true) + "</div>";
    html += "</section></aside>";
    return html;
  }

  function renderReplyBatchStrip() {
    var r = state.replies;
    var html = '<div class="toolbar" style="background:var(--primary-soft);border-bottom-color:var(--primary)">';
    if (r.batch === "style") {
      html += "<span class='nowrap'>把选中的按钮样式都改成</span>" +
        "<select class='cell-input' data-act='rp:batchValue'>" + replyStyleOptions(r.batchValue) + "</select>";
    } else if (r.batch === "prefix") {
      html += "<span class='nowrap'>把选中按钮的指令前缀都改成</span>" +
        "<input class='cell-input mono' style='width:150px' data-act='rp:batchValue' value='" +
        esc(r.batchValue) + "' placeholder='/钓鱼' />";
    } else if (r.batch === "delete") {
      html += "<span class='nowrap'>确定删除选中的 <b>" + replySelCount() +
        "</b> 个按钮？保存后才真正生效。</span>";
    }
    html += '<button class="btn btn-sm btn-primary" data-act="rp:batchApply">应用</button>' +
      '<button class="btn btn-sm" data-act="rp:batchCancel">取消</button></div>';
    return html;
  }

  /** 🔘 按钮总览：全局设置 + 所有按钮一张表 + 批量操作。 */
  function renderReplyOverview() {
    var r = state.replies;
    var rows = replyOverviewRows();
    var sel = replySelCount();
    var html = "";

    html += '<section class="card"><div class="card-head"><h2>🌐 全局设置</h2>' +
      '<span class="hint">每行几个、默认样式是所有场景共用的属性，只在这里配一次</span></div>';
    html += '<div class="form-grid">';
    html += '<div class="form-row"><label>每行几个按钮（* 全局默认，1-' + replyRowMax() + "）</label>" +
      '<span class="field"><input type="number" min="1" max="' + replyRowMax() + '" data-act="rp:layoutAll" value="' +
      esc(r.layoutAllTouched ? r.layoutAllDraft : (r.originalLayout[REPLY_LAYOUT_ALL] || "")) +
      '" placeholder="' + esc(String(r.perRowDefault || 3)) + '"' + (r.readonly ? " disabled" : "") +
      " /></span></div>";
    html += '<div class="form-row"><label>按钮样式</label><span class="field">' +
      '<select data-act="rp:styleMode"' + (r.readonly ? " disabled" : "") + ">" +
      replyStyleModeOptions(r.styleMode) + "</select></span></div>";
    html += '<div class="form-row"><label>默认 / 统一样式</label><span class="field">' +
      '<select data-act="rp:defaultStyle"' + (r.readonly ? " disabled" : "") + ">" +
      replyStyleOptions(r.defaultStyle) + "</select></span></div>";
    html += "</div>";
    html += '<div class="form-note" style="padding:0 10px 10px">写进配置的样子：' +
      '<span class="mono">*|3</span>（全局默认）、<span class="mono">story.prompt|1</span>（单个场景覆盖）。' +
      "卡片里的「每行 N 个」只写那个场景的覆盖行。</div>";
    html += '<div class="form-note" style="padding:0 10px 10px">' +
      "「默认 / 统一样式」既是新加按钮用的样式，也是按钮表里<b>没写样式</b>时的兜底。" +
      (r.styleMode === "统一"
        ? '　当前策略是<b style="color:var(--danger)">全部统一</b>：游戏里所有按钮都用它，' +
          "下面表格的「样式」列会被忽略（文字照原样保存，随时切回来）。"
        : "　当前策略是「按按钮表」：每个按钮用自己那一行写的样式。") +
      (r.styleCfgTouched ? '　<b style="color:var(--danger)">有改动没保存</b>' : "") + "</div>";
    html += "</section>";

    html += '<section class="card">';
    html += '<div class="card-head"><h2>🔘 所有按钮</h2><span class="hint">共 ' + rows.length +
      " 个按钮 · 和场景卡片是同一份草稿，改哪边都一样</span>" +
      '<span class="spacer"></span><span class="hint faint">批量操作：先勾选左边</span></div>';
    if (r.readonly) {
      html += '<div class="notice"><span class="notice-icon">🔒</span><div>只读模式：场景接口没读到，这里是 button_defs 的现有内容。</div></div>';
    } else {
      html += '<div class="toolbar"><span class="stat-chip">已选 <b>' + sel + "</b></span>" +
        '<button class="btn btn-sm" data-act="rp:batch" data-kind="style"' + (sel ? "" : " disabled") + ">批量改样式</button>" +
        '<button class="btn btn-sm" data-act="rp:batch" data-kind="prefix"' + (sel ? "" : " disabled") + ">批量改指令前缀</button>" +
        '<button class="btn btn-sm btn-danger" data-act="rp:batch" data-kind="delete"' + (sel ? "" : " disabled") + ">批量删除</button>" +
        '<span class="spacer" style="margin-left:auto"></span>' +
        '<button class="btn btn-sm" data-act="rp:selAll">全选 / 取消</button></div>';
      if (r.batch) html += renderReplyBatchStrip();
    }

    if (!rows.length) {
      html += '<div class="empty"><span class="empty-icon">🔘</span>' +
        '<div class="empty-title">所有场景都没有按钮</div>' +
        '<div class="empty-sub">到「场景卡片」视图里给需要的场景点「＋ 加按钮」</div></div>';
    } else {
      html += '<div class="table-wrap rp-table-wrap"><table class="grid" style="min-width:980px">';
      html += "<thead><tr>" +
        (r.readonly ? "" : '<th style="width:34px"></th>') +
        '<th style="width:210px">场景</th><th style="width:170px">按钮文案</th>' +
        '<th style="width:220px">点击后发送</th><th style="width:120px">样式</th>' +
        "<th>说明</th>" + (r.readonly ? "" : '<th style="width:130px"></th>') + "</tr></thead><tbody>";
      rows.forEach(function (row) {
        var errs = validateReplyButton(row.button);
        var bad = Object.keys(errs).length > 0;
        html += "<tr" + (bad ? ' class="is-invalid"' : "") + ">" +
          (r.readonly ? "" : '<td><input type="checkbox" data-act="rp:sel" data-key="' +
            esc(row.key) + '"' + (r.sel[row.key] ? " checked" : "") + " /></td>") +
          '<td class="id-cell">' + esc(row.scene_label) +
          ' <span class="mono faint">' + esc(row.scene_id) + "</span></td>" +
          "<td>" + esc(row.button.label) + "</td>" +
          '<td class="mono">' + esc(row.button.data) + "</td>" +
          "<td>" + esc(row.button.style) + "</td>" +
          '<td class="faint">' + esc(REPLY_SOURCE_LABEL[row.source] || row.source) +
          (bad ? "　<span style=\"color:var(--danger)\">" + esc(errs.label || errs.data || errs.style) + "</span>" : "") +
          "</td>" +
          (r.readonly ? "" :
            '<td class="actions">' +
            '<button class="btn btn-sm" data-act="rp:goto" data-scene="' + esc(row.scene_id) +
            '" title="跳到这张卡片">✏️ 改</button>' +
            '<button class="btn btn-sm btn-danger" data-act="rp:btnDel" data-scene="' + esc(row.scene_id) +
            '" data-i="' + row.i + '" title="删除这个按钮">🗑</button></td>') +
          "</tr>";
      });
      html += "</tbody></table></div>";
    }
    html += "</section>";
    return html;
  }

  /** 💬 回复 标签页：二级切换（场景卡片 / 按钮总览）+ 常驻预览。 */

    html += '<section class="card">';
    html += '<div class="card-head"><h2>💬 ' + esc(tab.title || "回复场景") + "</h2>" +
      '<span class="hint">' + esc(tab.hint || "") + "</span>" +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm" data-act="rp:retry" title="重新读一次场景接口">↻ 重读场景</button>' +
      '<button class="btn btn-sm btn-primary" data-act="rp:saveAll"' + (dirty ? "" : " disabled") +
      ">💾 保存回复改动" + (dirty ? "（" + dirty + "）" : "") + "</button></div>";

    if (r.loading) {
      html += '<div class="empty"><span class="empty-icon">⏳</span>' +
        '<div class="empty-title">正在读取回复场景…</div></div>';

      html += '<div class="notice notice-danger"><span class="notice-icon">⛔</span><div>' +
        "<b>读不到「回复场景」接口</b>　" + esc(r.error) +
