name: astrbot_plugin_qq_fishing
display_name: 群钓鱼
desc: QQ群钓鱼小游戏（内测）：带每日自动存档与一键导出/导入玩家数据的完整数据管理。271 种水族、19 个钓点、8 档鱼饵、6 档鱼竿、7 种养成道具（饲料/育灵水/洗髓丹/锦鲤玉佩/珊瑚造景）、天气与鱼市行情、变异个体、水族馆养成（**按每条鱼各自在缸里的时间产出挂机收益**，含带耐久的装饰物与隐藏的相处机制：会吃鱼的鱼不吃同类）、**按当前钓点刷新的订单**、52 个成就、20 个随机插曲（两个选项都有随机收益），QQ 官方机器人上支持按钮。个体品质 6 档（凡品→良品→精品→珍品→绝品→**神品**，和鱼种稀有度是两套名字；神品只能靠洗髓丹洗出来，同一条鱼每天限吃几颗、吃满会「厌恶」）。**每一条回复的按钮与文案都能单独配置**（159 个回复场景，动态文案可用 `!!` 整段替换），全部内容与数值都能在自带的数据编辑器页面里改（含命令别名、自定义命令、玩家金币，以及**作者名改过之后把旧作用域里的老存档找回**）。只注册一个 /钓鱼 指令，常用操作都有一步到位的短写法（放/取/领/喂/洗/交/买/装备/去/解锁）。**效果键集中在一张注册表里**，并且可以在 `extensions/*.py` 里给自己加新效果 —— 不用改插件本体。
short_desc: QQ群钓鱼：271 种水族 + 19 个钓点 + 官方按钮，下竿不要钱！
version: v1.18.8
