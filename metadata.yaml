name: astrbot_plugin_qq_fishing
display_name: 群钓鱼
desc: QQ群钓鱼小游戏（内测）：带每日自动存档与一键导出/导入玩家数据的完整数据管理。232 种水族、16 个钓点、8 档鱼饵、6 档鱼竿、6 种养成道具（饲料/育灵水/锦鲤玉佩/珊瑚造景）、天气与鱼市行情、变异个体、水族馆养成（含带耐久的装饰物与隐藏的相处机制）、不定时刷新的订单、53 个成就、随机小插曲，QQ 官方机器人上支持按钮。**每一条回复的按钮与文案都能单独配置**（154 个回复场景），全部内容与数值都能在自带的数据编辑器页面里改（含命令别名、自定义命令、玩家金币）。只注册一个 /钓鱼 指令。
short_desc: QQ群钓鱼：232 种水族 + 16 个钓点 + 官方按钮，下竿不要钱！
