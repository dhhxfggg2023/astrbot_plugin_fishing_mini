name: astrbot_plugin_fishing_mini
display_name: 群钓鱼
desc: QQ群钓鱼小游戏（内测）：带每日自动存档与一键导出/导入玩家数据的完整数据管理。271 种水族、19 个钓点、10 档鱼饵（含两档专精饵：深渊饵/龙涎）、8 档鱼竿（含两档后期手感竿：龙纹鲤竿/归墟竿；另有 2 根**大鱼乐限定竿**：潮汐竿/星陨竿，买不到、只能抽，限用 20/60 次）、15 种道具（普通/高级饲料、仙露、龙涎饲料、育灵水、珍珠梳、洗髓丹、锦鲤玉佩、潮汐香、玉髓灯、珊瑚造景/王座、姜汤，外加两张限定竿凭证）、天气与鱼市行情、变异个体、水族馆养成（**按每条鱼各自在缸里的时间产出挂机收益**，39 格上限）、**按当前钓点刷新、价格随你收入上涨的订单**、52 个成就、**49 个随机插曲 + 6 条连载剧情（18 话，选择会被记住、下一话接着上一话演，选项位置每次随机）**、**6 档称号与香火供奉（后期金币回收口）**、**大鱼乐（现实彩票玩法：花金币买票开奖，奖品可以是神话/神品/异色鱼、金币、道具、鱼饵，外加两份**限定竿**——概率比头奖还低，奖表与概率全部可配，带总开关与调试开关）**，QQ 官方机器人上支持按钮（**每个回复场景都配好了按钮**）。个体品质 6 档（凡品→良品→精品→珍品→绝品→**神品**，和鱼种稀有度是两套名字；神品只能靠洗髓丹洗出来，默认不设每日次数上限）。**道具都有每日额度**（手气道具每天合计 120 竿、姜汤 5 次、供奉 1 次，洗髓丹默认不限，都可配、0 = 不限），玩家从早玩到晚也刷不出无限强度；**同类手气道具不叠加**（两件同时用只按较强的那件算）。商店分成三家（`/钓鱼 鱼竿`、`/钓鱼 道具`、`/钓鱼 鱼饵`；`/钓鱼 买 <名字>` 自动认店）。**每一条回复的按钮与文案都能单独配置**（194 个回复场景，翻页与「再次使用」这两排动态按钮也在表里，动态文案可用 `!!` 整段替换），全部内容与数值都能在自带的数据编辑器页面里改（**131 项配置一个不漏** + 鱼池/钓点/鱼竿/鱼饵/道具/称号/杂物/变异/天气/彩蛋/按钮/别名/自定义命令十四张表，含**玩家数据编辑器（65 个字段全可改：金币/资产/装备/体力/手气/额度/订单/连载/图鉴，鱼可逐条增删改，还能直接改原始 JSON）**，以及**作者名改过之后把旧作用域里的老存档找回**）。只注册一个 /钓鱼 指令，常用操作都有一步到位的短写法（放/取/领/喂/洗/交/买/装备/去/解锁/自动/称号/供奉），批量命令支持任意多个序号。**效果键集中在一张注册表里**，并且可以在 `extensions/*.py` 里给自己加新效果 —— 不用改插件本体。
short_desc: QQ群钓鱼：271 种水族 + 19 个钓点 + 连载插曲 + 官方按钮，下竿不要钱！
